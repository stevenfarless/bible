name: Offline Build Audit

on:
  workflow_dispatch:
    inputs:
      initial_translations:
        description: Comma-separated translations included in the offline artifact
        required: true
        default: KJV,BSB
        type: string

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install audit dependencies
        run: |
          npm install --no-save --package-lock=false \
            @playwright/test@1.52.0 \
            esbuild@0.25.5 \
            firebase@9.23.0 \
            marked@9.1.6

      - name: Prepare source placeholders
        run: |
          SHA7="${GITHUB_SHA::7}"
          sed -i "s|__BUILD_INFO__|${SHA7}|g" index.html
          sed -i "s|__BUILD_COLOR__|#790606|g" css/pericope.css
          sed -i "s/__BUILD_ID__/${SHA7}/g" index.html
          echo "${GITHUB_SHA}" > version.txt

      - name: Inject Firebase config
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        run: |
          for f in config/firebase-config.js config/firebase-config.bundle.js; do
            sed -i "s|__FIREBASE_API_KEY__|${FIREBASE_API_KEY}|g" "$f"
            sed -i "s|__FIREBASE_APP_ID__|${FIREBASE_APP_ID}|g" "$f"
            sed -i "s|__FIREBASE_MESSAGING_SENDER_ID__|${FIREBASE_MESSAGING_SENDER_ID}|g" "$f"
          done

      - name: Run unit tests
        run: npm test

      - name: Build isolated offline artifact
        env:
          INITIAL_OFFLINE_TRANSLATIONS: ${{ inputs.initial_translations }}
        run: |
          node scripts/prepare-offline-build.mjs
          cp scripts/offline-sw.js _site/sw.js
          sed -i "s/__BUILD_ID__/${GITHUB_SHA::7}/g" _site/sw.js

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Start artifact server
        run: |
          python3 -m http.server 8080 --directory _site > /tmp/lege-lux-offline-audit.log 2>&1 &
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8080/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/lege-lux-offline-audit.log
          exit 1

      - name: Run application smoke tests
        env:
          BASE_URL: http://127.0.0.1:8080
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: npx playwright test --project=chromium

      - name: Run cold offline test
        env:
          BASE_URL: http://127.0.0.1:8080
        run: npx playwright test --config=playwright.offline.config.js --project=chromium

      - name: Upload offline artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: offline-build-${{ github.sha }}
          path: _site/
          retention-days: 7

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: offline-audit-failure-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            offline-test-results/
            /tmp/lege-lux-offline-audit.log
          if-no-files-found: ignore
          retention-days: 7
