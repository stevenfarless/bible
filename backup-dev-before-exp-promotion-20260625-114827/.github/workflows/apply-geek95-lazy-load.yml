name: Geek95 Lazy Load

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: geek95-lazy-load-exp
  cancel-in-progress: false

jobs:
  lazy-geek95:
    name: Apply Geek95 lazy-load fix
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exp
        uses: actions/checkout@v7
        with:
          ref: exp
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Apply Geek95 lazy-load fix
        run: python3 .github/scripts/lazy_geek95_css.py

      - name: Validate Geek95 lazy-load changes
        run: |
          git diff --check

          if grep -q 'rel="preload" href="css/geek95.css"' index.html; then
            echo "Geek95 CSS is still preloaded by default."
            exit 1
          fi

          if grep -q '<noscript><link rel="stylesheet" href="css/geek95.css"' index.html; then
            echo "Geek95 CSS is still in the startup noscript fallback."
            exit 1
          fi

          grep -q "var GEEK_THEME_CSS_ID = 'geek-theme-css';" prepaint-settings.js
          grep -q 'function ensureGeekThemeCss()' prepaint-settings.js
          grep -q "if (theme === 'geek') ensureGeekThemeCss();" prepaint-settings.js

          grep -q "const GEEK_THEME_CSS_ID = 'geek-theme-css';" ui.js
          grep -q 'function ensureGeekThemeCss()' ui.js
          grep -q "if (resolved === 'geek') ensureGeekThemeCss();" ui.js

          grep -q "'./css/geek95.css'," sw.js
          grep -q "'**/tests/geek95-lazy-load.spec.js'" playwright.config.js
          test -f tests/geek95-lazy-load.spec.js

          UNEXPECTED="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev '^(index.html|prepaint-settings.js|ui.js|sw.js|playwright.config.js|tests/geek95-lazy-load.spec.js)$' || true)"
          test -z "$UNEXPECTED" || {
            echo "Unexpected changed files:"
            echo "$UNEXPECTED"
            exit 1
          }

      - name: Install dependencies
        run: |
          npm install --package-lock=false
          npm install --no-save --package-lock=false @playwright/test esbuild firebase marked
          npx playwright install chromium --with-deps

      - name: Run unit tests
        run: npm test

      - name: Run Chromium tests
        env:
          BASE_URL: http://localhost:8080
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          python3 -m http.server 8080 > /tmp/lege-lux-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 10); do
            curl -fsS http://localhost:8080 > /dev/null && break
            sleep 1
          done

          curl -fsS http://localhost:8080 > /dev/null || {
            cat /tmp/lege-lux-http.log
            exit 1
          }

          npx playwright test --project=chromium

      - name: Run offline build audit
        run: node scripts/prepare-offline-build.mjs

      - name: Commit Geek95 lazy-load fix
        run: |
          if git diff --quiet -- index.html prepaint-settings.js ui.js sw.js playwright.config.js tests/geek95-lazy-load.spec.js; then
            echo "No Geek95 lazy-load changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html prepaint-settings.js ui.js sw.js playwright.config.js tests/geek95-lazy-load.spec.js
          git commit -F - <<'EOF'
          perf(css): lazy-load Geek95 theme CSS

          Load Geek95 overrides only when the Geek theme is active instead of
          making the stylesheet discoverable during every startup. Preserve
          offline availability by keeping the stylesheet in the service-worker
          app shell and add browser coverage for the lazy-loading boundary.

          Refs #415
          EOF
          git push origin exp

      - name: Dispatch GitHub Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESPONSE_FILE="$(mktemp)"
          STATUS="$({
            curl -sS \
              -o "$RESPONSE_FILE" \
              -w '%{http_code}' \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-gh-pages.yml/dispatches" \
              -d '{"ref":"exp"}'
          })"

          if [ "$STATUS" != "204" ]; then
            echo "Deploy to GitHub Pages workflow dispatch failed with HTTP $STATUS."
            cat "$RESPONSE_FILE"
            exit 1
          fi

          echo "Deploy to GitHub Pages dispatched for exp."
