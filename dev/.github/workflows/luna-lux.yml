name: "! Luna Lux"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  luna-lux:
    name: Apply Luna Lux polish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: exp
          fetch-depth: 0

      - name: Apply Luna Lux overrides
        run: python3 .github/scripts/apply_luna_lux.py

      - name: Verify Luna Lux changes
        run: |
          git diff --check
          test -f css/luna-lux.css
          grep -q 'css/luna-lux.css' index.html
          grep -q './css/luna-lux.css' sw.js
          git diff -- css/luna-lux.css index.html sw.js

      - name: Commit Luna Lux polish
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/luna-lux.css index.html sw.js
          git commit -m "style: apply Luna Lux polish"
          git push origin exp
