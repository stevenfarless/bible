name: Assign Project Statuses

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview changes without updating Project 3
        required: true
        type: boolean
        default: true
      overwrite_existing:
        description: Reclassify open issues that already have Now, Next, or Someday
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: assign-project-statuses
  cancel-in-progress: false

jobs:
  assign-statuses:
    name: Assign statuses to open Lege Lux issues
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
      PROJECT_OWNER: stevenfarless
      PROJECT_NUMBER: "3"
      REPOSITORY: stevenfarless/lege-lux
      DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      OVERWRITE_EXISTING: ${{ inputs.overwrite_existing && '1' || '0' }}

    steps:
      - name: Checkout exp
        uses: actions/checkout@v6
        with:
          ref: exp

      - name: Verify project token
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::Missing repository secret GH_PROJECT_TOKEN"
            echo "Create a classic personal access token with the project scope, then save it as GH_PROJECT_TOKEN."
            exit 1
          fi

          if [[ "$GH_TOKEN" == github_pat_* ]]; then
            echo "::error::GH_PROJECT_TOKEN is a fine-grained personal access token."
            echo "Fine-grained PATs cannot currently access Projects owned by a user account."
            echo "Replace it with a classic personal access token that has the project scope."
            exit 1
          fi

          gh auth status

          gh api graphql \
            -f query='query { viewer { login } }' \
            --jq '.data.viewer.login'

      - name: Assign project statuses
        shell: bash
        run: |
          set -euo pipefail

          python3 .github/scripts/assign_project_statuses.py | tee project-status-assignment.log

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Project status assignment"
            echo
            echo "- Project: stevenfarless Project 3"
            echo "- Repository: stevenfarless/lege-lux"
            echo "- Dry run: ${DRY_RUN}"
            echo "- Overwrite existing statuses: ${OVERWRITE_EXISTING}"
            echo

            if [[ -f project-status-assignment.log ]]; then
              echo '```text'
              cat project-status-assignment.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
