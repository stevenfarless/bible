name: '! Picker 7-1'

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  picker-7-1:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exp
        uses: actions/checkout@v4
        with:
          ref: exp

      - name: Apply picker Go flow fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          MODALS = Path('modals.js')
          COMPONENTS = Path('css/components.css')
          MODALS_CSS = Path('css/modals.css')
          SMOKE = Path('tests/smoke.spec.js')

          def read(path):
              return path.read_text(encoding='utf-8')

          def write(path, text):
              path.write_text(text.rstrip() + '\n', encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          def replace_between(text, start, end, new, label):
              start_index = text.find(start)
              if start_index < 0:
                  raise SystemExit(f'{label}: start anchor not found')
              end_index = text.find(end, start_index)
              if end_index < 0:
                  raise SystemExit(f'{label}: end anchor not found')
              return text[:start_index] + new + text[end_index:]

          modals = read(MODALS)

          transition_function = '''function _transitionReferencePickerView(app, renderNextView, { animate = true, direction = 'forward' } = {}) {
              const view = app.referencePickerView;
              const reduceMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;

              if (!view || !animate || reduceMotion) {
                  renderNextView();
                  _restoreReferencePickerScroll(app);
                  _focusReferencePicker(app);
                  return;
              }

              requestAnimationFrame(() => {
                  renderNextView();
                  _restoreReferencePickerScroll(app);

                  view.classList.add(direction === 'back'
                      ? 'reference-picker-view--enter-back'
                      : 'reference-picker-view--enter-forward');

                  requestAnimationFrame(() => {
                      view.classList.remove('reference-picker-view--enter-forward', 'reference-picker-view--enter-back');
                      _focusReferencePicker(app);
                  });
              });
          }'''

          modals = replace_between(
              modals,
              'function _transitionReferencePickerView(app, renderNextView',
              '\n\nfunction _renderReferencePickerView(app, view',
              transition_function,
              'reference picker fixed-height transition',
          )

          book_active_line = "        button.classList.toggle('picker-item--active', book === app.state.currentBook);\n"
          if book_active_line in modals:
              modals = modals.replace(book_active_line, '', 1)

          chapter_go_block = '''
              const actions = document.createElement('div');
              actions.className = 'picker-actions picker-actions--top';

              const goButton = document.createElement('button');
              goButton.className = 'secondary-btn reference-picker-go';
              goButton.type = 'button';
              goButton.textContent = 'Go';
              goButton.addEventListener('click', async () => {
                  const targetBook = draft.book || app.state.currentBook;
                  const targetChapter = draft.chapter || app.state.currentChapter;

                  app._dbgUserAction?.('picker go: ' + targetBook + ' ' + targetChapter);
                  await app.loadPassage(targetBook, targetChapter, false, 'chapter-picker-go');
                  closeReferencePicker(app);
              });

              actions.appendChild(goButton);
              view.appendChild(actions);
          '''

          if chapter_go_block in modals:
              modals = modals.replace(chapter_go_block, '\n', 1)

          old_active_verse = "    const activeVerse = app.state.selectedVerse || parseInt(app.currentVerseSpan?.textContent || '1', 10) || 1;"
          if old_active_verse in modals:
              modals = replace_once(
                  modals,
                  old_active_verse,
                  "    const activeVerse = app.state.selectedVerse;",
                  'verse picker active verse fallback',
              )

          verse_go_block = '''    if (draft.entryView !== 'verse') {
              const actions = document.createElement('div');
              actions.className = 'picker-actions picker-actions--top';

              const goButton = document.createElement('button');
              goButton.className = 'secondary-btn reference-picker-go';
              goButton.type = 'button';
              goButton.textContent = 'Go';
              goButton.addEventListener('click', () => {
                  const targetBook = draft.book || app.state.currentBook;
                  const targetChapter = draft.chapter || app.state.currentChapter;

                  app._dbgUserAction?.('picker go: ' + targetBook + ' ' + targetChapter);
                  app._dbgEvent?.('picker go from verse picker: ' + targetBook + ' ' + targetChapter);
                  app.referencePickerDraft = null;
                  app.state.selectedVerse = null;
                  if (app.currentVerseSpan) app.currentVerseSpan.textContent = '1';
                  app.applyVerseGlow?.();
                  closeReferencePicker(app);
              });

              actions.appendChild(goButton);
              view.appendChild(actions);
          }

          '''

          verse_start = modals.find('function _renderVersePickerView(app) {')
          if verse_start < 0:
              raise SystemExit('verse picker function not found')
          active_marker = "    const activeVerse = app.state.selectedVerse;"
          active_start = modals.find(active_marker, verse_start)
          if active_start < 0:
              raise SystemExit('verse picker active verse marker not found')
          go_start = modals.find("    if (draft.entryView !== 'verse') {", verse_start)
          if go_start >= 0 and go_start < active_start:
              modals = modals[:go_start] + verse_go_block + modals[active_start:]
          else:
              modals = modals[:active_start] + verse_go_block + modals[active_start:]

          write(MODALS, modals)

          css = read(COMPONENTS)
          book_hover = '''.book-item:hover {
              background-color: var(--primary-color);
              border-color: var(--primary-color);
              color: var(--bg-base);
              transform: translateY(-2px);
          }
          '''
          chapter_hover = '''.chapter-item:hover {
              background-color: var(--primary-color);
              border-color: var(--primary-color);
              color: var(--bg-base);
              transform: scale(1.05);
          }
          '''
          book_hover_media = '''@media (hover: hover) and (pointer: fine) {
              .book-item:hover {
                  background-color: var(--primary-color);
                  border-color: var(--primary-color);
                  color: var(--bg-base);
                  transform: translateY(-2px);
              }
          }
          '''
          chapter_hover_media = '''@media (hover: hover) and (pointer: fine) {
              .chapter-item:hover {
                  background-color: var(--primary-color);
                  border-color: var(--primary-color);
                  color: var(--bg-base);
                  transform: scale(1.05);
              }
          }
          '''
          if book_hover in css:
              css = css.replace(book_hover, book_hover_media, 1)
          if chapter_hover in css:
              css = css.replace(chapter_hover, chapter_hover_media, 1)
          write(COMPONENTS, css)

          modal_css = read(MODALS_CSS)
          fixed_reference_modal_rule = '''/* Reference picker */
          .reference-picker-modal .modal-content {
              height: 85vh;
              max-height: 85vh;
              transition: none;
          }

          @supports (height: 1dvh) {
              .reference-picker-modal .modal-content {
                  height: 85dvh;
                  max-height: 85dvh;
              }
          }

          '''
          modal_css = re.sub(
              r'/\* Reference picker \*/\n\.reference-picker-modal \.modal-content \{\n.*?\n\}\n\n',
              fixed_reference_modal_rule,
              modal_css,
              count=1,
              flags=re.S,
          )
          if 'height: 85dvh;' not in modal_css:
              raise SystemExit('fixed reference picker height was not written')
          write(MODALS_CSS, modal_css)

          tests = read(SMOKE)
          tests = tests.replace(
              "test('reference picker: book, chapter, verse flow supports verse and close'",
              "test('reference picker: book, chapter, verse flow supports verse and Go'",
              1,
          )
          tests = tests.replace(
              '''        await page.locator('#closeReferencePickerModal').click();

                  await expect(picker).not.toHaveClass(/active/);
                  await expect(page.locator('#passageTitle')).toContainText('Matthew 2');
                  await expect(page.locator('#currentVerse')).toHaveText('1');
          });''',
              '''        await expect(pickerView.locator('.reference-picker-go')).toBeVisible();
                  await pickerView.locator('.reference-picker-go').click();

                  await expect(picker).not.toHaveClass(/active/);
                  await expect(page.locator('#passageTitle')).toContainText('Matthew 2');
                  await expect(page.locator('#currentVerse')).toHaveText('1');
          });''',
              1,
          )
          tests = tests.replace(
              "test('chapter navigation: selecting a chapter opens verse picker and close keeps chapter'",
              "test('chapter navigation: selecting a chapter opens verse picker and Go keeps chapter'",
              1,
          )
          tests = tests.replace(
              '''        await page.locator('#closeReferencePickerModal').click();

                  await expect(picker).not.toHaveClass(/active/);
                  await expect(page.locator('#passageTitle')).toContainText('Genesis 2');
          });''',
              '''        await expect(pickerView.locator('.reference-picker-go')).toBeVisible();
                  await pickerView.locator('.reference-picker-go').click();

                  await expect(picker).not.toHaveClass(/active/);
                  await expect(page.locator('#passageTitle')).toContainText('Genesis 2');
          });''',
              1,
          )
          tests = tests.replace(
              "        await page.locator('#closeReferencePickerModal').click();\n        await waitForPassage(page);",
              "        await pickerView.locator('.reference-picker-go').click();\n        await waitForPassage(page);",
              2,
          )
          if "#referencePickerView .book-item.picker-item--active" not in tests:
              tests = tests.replace(
                  "        await expect(page.locator('.book-testament-filter--active')).toHaveCount(0);\n",
                  "        await expect(page.locator('.book-testament-filter--active')).toHaveCount(0);\n        await expect(page.locator('#referencePickerView .book-item.picker-item--active')).toHaveCount(0);\n",
                  1,
              )
          write(SMOKE, tests)
          PY

      - name: Validate picker changes
        shell: bash
        run: |
          node --check modals.js
          node --check tests/smoke.spec.js
          python3 <<'PY'
          from pathlib import Path
          import re

          modals = Path('modals.js').read_text(encoding='utf-8')
          components = Path('css/components.css').read_text(encoding='utf-8')
          modal_css = Path('css/modals.css').read_text(encoding='utf-8')
          tests = Path('tests/smoke.spec.js').read_text(encoding='utf-8')

          chapter = modals.split('function _renderChapterPickerView(app) {', 1)[1].split('function _renderVersePickerView(app) {', 1)[0]
          verse = modals.split('function _renderVersePickerView(app) {', 1)[1].split('// ── Deuterocanon info modal', 1)[0]
          book = modals.split('function _renderBookPickerView(app) {', 1)[1].split('function _renderChapterPickerView(app) {', 1)[0]
          transition = modals.split('function _transitionReferencePickerView(app, renderNextView', 1)[1].split('function _renderReferencePickerView(app, view', 1)[0]

          checks = {
              'chapter picker Go removed': 'reference-picker-go' not in chapter,
              'verse picker Go added': 'picker go from verse picker' in verse,
              'direct verse picker keeps Go hidden': "draft.entryView !== 'verse'" in verse,
              'verse picker does not preselect verse 1': 'const activeVerse = app.state.selectedVerse;' in verse,
              'book picker does not pre-highlight current book': 'picker-item--active' not in book,
              'reference picker height is fixed': 'height: 85vh;' in modal_css and 'height: 85dvh;' in modal_css,
              'reference picker transition no longer animates height': 'content.style.height' not in transition and 'scrollHeight' not in transition,
              'touch devices do not retain hover highlight': '@media (hover: hover) and (pointer: fine)' in components,
              'tests cover Go and unhighlighted book state': 'supports verse and Go' in tests and 'Go keeps chapter' in tests and '#referencePickerView .book-item.picker-item--active' in tests,
          }

          failures = [name for name, ok in checks.items() if not ok]
          if failures:
              raise SystemExit('Validation failed: ' + ', '.join(failures))

          if re.search(r'(?m)^\.book-item:hover', components) or re.search(r'(?m)^\.chapter-item:hover', components):
              raise SystemExit('Validation failed: unwrapped hover selector remains')
          PY

      - name: Commit picker changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No picker changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modals.js css/components.css css/modals.css tests/smoke.spec.js
          git commit -m "fix: refine reference picker state" -m "Remove the active book highlight in the book picker, keep the reference picker modal at one fixed height across book, chapter, and verse views, and preserve the verse-step Go action. Update smoke coverage for the visible picker state."
          git push origin HEAD:exp
