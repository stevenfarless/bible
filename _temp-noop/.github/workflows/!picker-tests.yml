name: "! picker tests"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: picker-tests-exp
  cancel-in-progress: false

jobs:
  picker-tests:
    name: Update picker smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exp
        uses: actions/checkout@v4
        with:
          ref: exp
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Playwright without saving to package.json
        env:
          npm_config_package_lock: "false"
          npm_config_save: "false"
        run: |
          npm install --no-save --package-lock=false @playwright/test
          rm -f package-lock.json

      - name: Install Chromium browser
        run: npx playwright install chromium --with-deps

      - name: Start local HTTP server
        run: |
          python3 -m http.server 8080 &
          for i in $(seq 1 10); do
            curl -s http://localhost:8080 > /dev/null && break || sleep 1
          done

      - name: Apply picker test migration
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -B .github/scripts/picker_tests.py
          python3 -B .github/scripts/picker_tests.py
          rm -rf .github/scripts/__pycache__
          rm -f package-lock.json

      - name: Validate migrated picker selectors
        run: |
          grep -q '#referencePickerModal' tests/smoke.spec.js
          grep -q '#referencePickerView' tests/smoke.spec.js
          grep -q '#referencePickerSubtitle' tests/smoke.spec.js
          grep -q 'closes the reference picker' tests/smoke.spec.js
          ! grep -q '#bookModal' tests/smoke.spec.js
          ! grep -q '#chapterModal' tests/smoke.spec.js
          ! grep -q '#verseModal' tests/smoke.spec.js
          ! grep -q '#oldTestamentBooks' tests/smoke.spec.js
          ! grep -q '#newTestamentBooks' tests/smoke.spec.js
          ! grep -q '#chapterGrid' tests/smoke.spec.js
          ! grep -q '#verseGrid' tests/smoke.spec.js
          ! grep -q '#verseGoButton' tests/smoke.spec.js
          git diff --check

      - name: Run picker smoke tests
        env:
          BASE_URL: http://localhost:8080
        run: |
          npx playwright test --project=chromium tests/smoke.spec.js
          rm -f package-lock.json

      - name: Verify changed files
        run: |
          rm -f package-lock.json
          allowed='^tests/smoke\.spec\.js$'
          unexpected="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"
          test -z "$unexpected" || {
            echo "Unexpected changed files:"
            echo "$unexpected"
            exit 1
          }

      - name: Commit picker test migration
        run: |
          files=(tests/smoke.spec.js)
          if [ -z "$(git status --porcelain -- "${files[@]}")" ]; then
            echo "Picker smoke tests are already migrated."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit \
            -m "test(picker): update smoke tests for unified reference picker" \
            -m "Update Playwright picker tests to use the unified reference picker modal and view-scoped selectors instead of the removed book, chapter, and verse modal IDs. Adjust close behavior expectations for the new chapter-to-verse flow."
          git push origin exp
