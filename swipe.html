<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swipe Parallax Demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111827;
      font-family: system-ui, sans-serif;
      color: white;
    }

    .phone {
      width: min(92vw, 360px);
      aspect-ratio: 9 / 16;
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      background: #0f172a;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      touch-action: pan-y;
    }

    .panel {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 2rem;
      font-weight: 700;
      will-change: transform;
    }

    .current {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      z-index: 2;
    }

    .incoming {
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      z-index: 1;
    }

    .label {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 3;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(0,0,0,.35);
      font-size: 14px;
      line-height: 1.35;
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>
  <div class="phone" id="swipeArea">
    <div class="panel incoming" id="incoming">Chapter 11</div>
    <div class="panel current" id="current">Chapter 10</div>
    <div class="label" id="label">Drag left</div>
  </div>

  <script>
    const swipeArea = document.getElementById('swipeArea');
    const current = document.getElementById('current');
    const incoming = document.getElementById('incoming');
    const label = document.getElementById('label');

    const PARALLAX = 0.9;

    let startX = 0;
    let deltaX = 0;
    let dragging = false;

    function setTransforms(dx) {
      const width = swipeArea.clientWidth;
      const clamped = Math.max(-width, Math.min(0, dx));

      current.style.transform = `translateX(${clamped}px)`;
      incoming.style.transform = `translateX(${width + clamped * PARALLAX}px)`;

      label.textContent =
        `drag=${Math.round(clamped)}px | current=${Math.round(clamped)}px | incoming=${Math.round(width + clamped * PARALLAX)}px`;
    }

    function reset(animated = true) {
      if (animated) {
        current.style.transition = 'transform 220ms ease';
        incoming.style.transition = 'transform 220ms ease';
      }
      current.style.transform = 'translateX(0px)';
      incoming.style.transform = `translateX(${swipeArea.clientWidth}px)`;
      label.textContent = 'Drag left';
    }

    swipeArea.addEventListener('pointerdown', (e) => {
      dragging = true;
      startX = e.clientX;
      deltaX = 0;
      current.style.transition = 'none';
      incoming.style.transition = 'none';
      swipeArea.setPointerCapture(e.pointerId);
    });

    swipeArea.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      deltaX = e.clientX - startX;
      if (deltaX > 0) deltaX = 0;
      setTransforms(deltaX);
    });

    function endDrag() {
      if (!dragging) return;
      dragging = false;

      const width = swipeArea.clientWidth;
      const shouldComplete = Math.abs(deltaX) > width * 0.33;

      current.style.transition = 'transform 220ms ease';
      incoming.style.transition = 'transform 220ms ease';

      if (shouldComplete) {
        current.style.transform = `translateX(${-width}px)`;
        incoming.style.transform = 'translateX(0px)';
        label.textContent = 'Completed';
      } else {
        reset(false);
      }
    }

    swipeArea.addEventListener('pointerup', endDrag);
    swipeArea.addEventListener('pointercancel', endDrag);

    reset(false);
  </script>
</body>
</html>
