name: "! Implement Settings Sync Prompt"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: implement-settings-sync-prompt-exp
  cancel-in-progress: false

jobs:
  implement:
    name: Show the sync prompt only in Settings
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exp
        uses: actions/checkout@v6
        with:
          ref: exp
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Apply and recheck implementation
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path

          path = Path('.github/scripts/implement-settings-sync-prompt.py')
          ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          PY

          python3 .github/scripts/implement-settings-sync-prompt.py
          python3 .github/scripts/implement-settings-sync-prompt.py

      - name: Validate patched source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html').read_text(encoding='utf-8')
          app = Path('app.js').read_text(encoding='utf-8')
          events = Path('events.js').read_text(encoding='utf-8')
          modals = Path('modals.js').read_text(encoding='utf-8')
          components = Path('css/components.css').read_text(encoding='utf-8')
          utilities = Path('css/utilities.css').read_text(encoding='utf-8')
          smoke = Path('tests/smoke.spec.js').read_text(encoding='utf-8')

          assert index.count('id="syncPrompt"') == 1
          settings_start = index.index('id="settingsModal"')
          prompt_start = index.index('id="syncPrompt"')
          toast_start = index.index('id="toast"')
          assert settings_start < prompt_start < toast_start
          assert '<h3 id="syncPromptTitle">' in index
          assert '<h2 id="syncPromptTitle">' not in index

          assert 'this.authStateResolved = !this.auth || !this.database;' in app
          assert 'this.authStateResolved = true;' in app
          assert "this.settingsModal?.classList.contains('active')" in app
          assert '''this.currentUser = null;
                          this.maybeShowSyncPrompt();''' not in app

          assert 'const openSettings = () => {' in events
          assert "app.settingsBtn?.addEventListener('click', openSettings);" in events
          assert 'app.authStateResolved &&' in events

          assert 'if (modal === app.settingsModal) {' in modals
          assert 'app.hideSyncPrompt?.();' in modals

          assert '.sync-prompt {\n    position: static;' in components
          assert '.sync-prompt h3 {' in components
          assert 'body.chrome-hidden .sync-prompt' not in components

          assert '    .sync-prompt {' not in utilities

          assert 'async function waitForAuthState(page)' in smoke
          assert "test('sync prompt: remains hidden during signed-out startup'" in smoke
          assert "test('sync prompt: stays inside settings on desktop and mobile'" in smoke
          assert 'sync prompt: responds to desktop and mobile layouts' not in smoke
          PY

          node --check app.js
          node --check events.js
          node --check modals.js
          node --check sync-prompt.js
          node --check tests/unit/sync-prompt.test.js
          node --check tests/smoke.spec.js
          git diff --check

      - name: Verify changed files
        run: |
          allowed='^(app\.js|events\.js|index\.html|modals\.js|css/components\.css|css/utilities\.css|tests/smoke\.spec\.js)$'
          unexpected="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"
          test -z "$unexpected" || {
            echo "Unexpected changed files:"
            echo "$unexpected"
            exit 1
          }

      - name: Install dependencies
        run: |
          npm install --package-lock=false
          npm install --no-save --package-lock=false @playwright/test

      - name: Run unit tests
        run: npm test

      - name: Run Chromium smoke tests
        env:
          BASE_URL: http://localhost:8080
        run: |
          npx playwright install chromium --with-deps
          python3 -m http.server 8080 > /tmp/lege-lux-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for i in $(seq 1 10); do
            curl -fsS http://localhost:8080 > /dev/null && break
            sleep 1
          done

          curl -fsS http://localhost:8080 > /dev/null || {
            cat /tmp/lege-lux-http.log
            exit 1
          }

          npx playwright test tests/smoke.spec.js --project=chromium

      - name: Commit issue 312 implementation
        run: |
          files=(
            app.js
            events.js
            index.html
            modals.js
            css/components.css
            css/utilities.css
            tests/smoke.spec.js
          )

          git diff --check

          if [ -z "$(git status --porcelain -- "${files[@]}")" ]; then
            echo "Issue 312 is already implemented"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -F - <<'EOF'
          fix(auth): show sync prompt only in settings

          Move the existing sync prompt into the Settings modal and trigger it
          only after authentication resolves to a signed-out state while
          Settings is open.

          Preserve dismissal and sign-in behavior while preventing the prompt
          from appearing during startup.

          Closes #312
          EOF
          git push origin exp
