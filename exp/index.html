<!DOCTYPE html>
<html lang="en">

<head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ESV Bible</title>
        <meta name="description" content="Read the ESV Bible with a clean, distraction-free interface." />
        <meta name="theme-color" content="#282A36" />
        <link rel="manifest" href="./site.webmanifest" />
        <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
        <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
        <link rel="icon" href="./favicon.ico" />

        <link rel="preconnect" href="https://esv-bible-6dffb-default-rtdb.firebaseio.com" />
        <link rel="preconnect" href="https://www.gstatic.com" />
        <link rel="preconnect" href="https://www.google.com" />

        <link rel="modulepreload" href="app.js" />
        <link rel="modulepreload" href="bible-api.js" />
        <link rel="modulepreload" href="bsb-structure.js" />
        <link rel="modulepreload" href="reading-state.js" />
        <link rel="modulepreload" href="ui.js" />
        <link rel="modulepreload" href="bible-structure.js" />
        <link rel="modulepreload" href="navigation.js" />
        <link rel="modulepreload" href="search.js" />
        <link rel="modulepreload" href="auth.js" />
        <link rel="modulepreload" href="modals.js" />
        <link rel="modulepreload" href="settings.js" />
        <link rel="modulepreload" href="keyboard.js" />
        <link rel="modulepreload" href="events.js" />

        <link rel="preload" href="./fonts/GentiumBookPlus-Regular.woff2" as="font" type="font/woff2" crossorigin />
        <link rel="preload" href="./fonts/Andika-Regular.woff2" as="font" type="font/woff2" crossorigin />
        <link rel="preload" href="./fonts/OpenDyslexic3-Regular.woff2" as="font" type="font/woff2" crossorigin />
        <link rel="preload" href="./fonts/Ubuntu-Regular.woff2" as="font" type="font/woff2" crossorigin />
        <link rel="stylesheet" href="css/fonts.css" />
        <link rel="stylesheet" href="css/base.css" />
        <link rel="stylesheet" href="css/tokens.css" />
        <link rel="stylesheet" href="css/themes.css" />
        <link rel="stylesheet" href="css/layout.css" />
        <link rel="stylesheet" href="css/components.css" />
        <link rel="stylesheet" href="css/interactions.css" />
        <link rel="stylesheet" href="css/utilities.css" />
        <link rel="stylesheet" href="css/responsive.css" />
</head>

<body>
        <div class="top-chrome">
                <header class="header">
                        <div class="header-content">
                                <span class="logo">ESV</span>
                                <div class="header-controls">
                                        <button id="searchBtn" class="icon-btn" aria-label="Search" title="Search (Ctrl+F)">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                                        viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                        <circle cx="11" cy="11" r="8"></circle>
                                                        <path d="m21 21-4.35-4.35"></path>
                                                </svg>
                                        </button>
                                        <button id="themeToggleBtn" class="icon-btn" aria-label="Toggle theme" title="Toggle light/dark (T)">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                                        </button>
                                        <button id="settingsBtn" class="icon-btn" aria-label="Settings" title="Settings (S)">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                                        viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                        <circle cx="12" cy="12" r="3"></circle>
                                                        <path
                                                                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                                                        </path>
                                                </svg>
                                        </button>
                                        <button id="helpBtn" class="icon-btn" aria-label="Help" title="Help (?)">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                                        viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                        <circle cx="12" cy="12" r="10"></circle>
                                                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                                                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                                                </svg>
                                        </button>
                                </div>
                        </div>
                </header>

                <nav class="navigation">
                        <div class="nav-content">
                                <button id="prevChapterBtn" class="nav-btn" aria-label="Previous chapter">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                                stroke-linecap="round" stroke-linejoin="round">
                                                <polyline points="15 18 9 12 15 6"></polyline>
                                        </svg>
                                        <span>Prev</span>
                                </button>

                                <div class="passage-selector">
                                        <button id="bookSelectBtn" class="selector-btn" aria-haspopup="dialog" aria-label="Select book">
                                                <span id="currentBook">Genesis</span>
                                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                                                        viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                        stroke-width="2" stroke-linecap="round"
                                                        stroke-linejoin="round">
                                                        <polyline points="6 9 12 15 18 9"></polyline>
                                                </svg>
                                        </button>
                                        <button id="chapterSelectBtn" class="selector-btn" aria-haspopup="dialog" aria-label="Select chapter">
                                                <span id="currentChapter">1</span>
                                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                                                        viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                        stroke-width="2" stroke-linecap="round"
                                                        stroke-linejoin="round">
                                                        <polyline points="6 9 12 15 18 9"></polyline>
                                                </svg>
                                        </button>
                                        <button id="translationSelectBtn" class="selector-btn selector-btn--translation" aria-haspopup="dialog" aria-label="Select translation">
                                                <span id="currentTranslation">ESV</span>
                                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                                                        viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                        stroke-width="2" stroke-linecap="round"
                                                        stroke-linejoin="round">
                                                        <polyline points="6 9 12 15 18 9"></polyline>
                                                </svg>
                                        </button>
                                </div>

                                <button id="nextChapterBtn" class="nav-btn" aria-label="Next chapter">
                                        <span>Next</span>
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                                stroke-linecap="round" stroke-linejoin="round">
                                                <polyline points="9 18 15 12 9 6"></polyline>
                                        </svg>
                                </button>
                        </div>
                </nav>
        </div>

        <div class="search-container" id="searchContainer" role="search">
                <div class="search-wrapper">
                        <div class="search-input-row">
                                <input type="text" id="searchInput" class="search-input"
                                        placeholder="Search..." autocomplete="off"
                                        aria-label="Search the Bible" />
                                <button id="searchCloseBtn" class="icon-btn" aria-label="Close search">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                                viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                                <line x1="6" y1="6" x2="18" y2="18"></line>
                                        </svg>
                                </button>
                        </div>
                        <div class="search-options-row">
                                <label class="search-toggle-label" title="Search across all translations">
                                        <input type="checkbox" id="megasearchToggle" class="search-toggle-checkbox" />
                                        <span class="search-toggle-track"></span>
                                        <span class="search-toggle-text">All translations</span>
                                </label>
                        </div>
                </div>
                <div class="search-results-summary" id="searchResultsSummary" aria-live="polite"></div>
                <div class="search-results" id="searchResults" role="listbox" aria-label="Search results"></div>
        </div>

        <main class="main-content" id="mainContent">
                <div class="passage-container">
                        <div class="passage-header">
                                <h1 class="passage-title" id="passageTitle">Genesis 1</h1>
                                <button id="referencesBtn" class="icon-btn" aria-label="Footnotes and cross-references" title="Footnotes & references (R)" style="display:none">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                                viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <path
                                                        d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z">
                                                </path>
                                                <polyline points="14 2 14 8 20 8"></polyline>
                                                <line x1="16" y1="13" x2="8" y2="13"></line>
                                                <line x1="16" y1="17" x2="8" y2="17"></line>
                                                <polyline points="10 9 9 9 8 9"></polyline>
                                        </svg>
                                </button>
                        </div>
                        <div class="passage-text" id="passageText">
                                <div class="loading">Loading...</div>
                        </div>
                        <div class="passage-footer">
                                <p class="copyright" id="copyright"></p>
                        </div>
                </div>
        </main>

        <!-- Book Selection Modal -->
        <div class="modal" id="bookModal" role="dialog" aria-modal="true" aria-labelledby="bookModalTitle">
                <div class="modal-content">
                        <div class="modal-header">
                                <h3 id="bookModalTitle">Select Book</h3>
                                <button class="close-btn" data-close="bookModal" aria-label="Close">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                                viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                                <line x1="6" y1="6" x2="18" y2="18"></line>
                                        </svg>
                                </button>
                        </div>
                        <div class="modal-body" id="bookList">
                        </div>
                </div>
        </div>

        <!-- Chapter Selection Modal -->
        <div class="modal" id="chapterModal" role="dialog" aria-modal="true" aria-labelledby="chapterModalTitle">
                <div class="modal-content">
                        <div class="modal-header">
                                <h3 id="chapterModalTitle">Select Chapter</h3>
                                <button class="close-btn" data-close="chapterModal" aria-label="Close">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                                viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                                <line x1="6" y1="6" x2="18" y2="18"></line>
                                        </svg>
                                </button>
                        </div>
                        <div class="modal-body" id="chapterList">
                        </div>
                </div>
        </div>

        <!-- Translation Selection Modal -->
        <div class="modal" id="translationModal" role="dialog" aria-modal="true" aria-labelledby="translationModalTitle">
                <div class="modal-content modal-content--sm">
                        <div class="modal-header">
                                <h3 id="translationModalTitle">Translation</h3>
                                <button class="close-btn" data-close="translationModal" aria-label="Close">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                                viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                                <line x1="6" y1="6" x2="18" y2="18"></line>
                                        </svg>
                                </button>
                        </div>
                        <div class="modal-body">
                                <ul class="translation-modal-list" id="translationList" role="listbox" aria-label="Available translations"></ul>
                        </div>
                </div>
        </div>

        <!-- Settings Modal (Bottom Sheet) -->
        <div class="modal" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsModalTitle">
                <div class="modal-content">
                        <div class="modal-header">
                                <h3 id="settingsModalTitle">Settings</h3>
                                <button class="close-btn" data-close="settingsModal" aria-label="Close">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                                viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                                <line x1="6" y1="6" x2="18" y2="18"></line>
                                        </svg>
                                </button>
                        </div>
                        <div class="modal-body" id="settingsContent">
                        </div>
                </div>
        </div>

        <!-- Help Modal -->
        <div class="modal" id="helpModal" role="dialog" aria-modal="true" aria-labelledby="helpModalTitle">
                <div class="modal-content">
                        <div class="modal-header">
                                <h3 id="helpModalTitle">Help</h3>
                                <button class="close-btn" data-close="helpModal" aria-label="Close">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                                viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                                <line x1="6" y1="6" x2="18" y2="18"></line>
                                        </svg>
                                </button>
                        </div>
                        <div class="modal-body" id="helpContent">
                        </div>
                </div>
        </div>

        <!-- Auth Modal -->
        <div class="modal" id="authModal" role="dialog" aria-modal="true" aria-labelledby="authModalTitle">
                <div class="modal-content modal-content--sm">
                        <div class="modal-header">
                                <h3 id="authModalTitle">Sign In</h3>
                                <button class="close-btn" data-close="authModal" aria-label="Close">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                                viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                                <line x1="6" y1="6" x2="18" y2="18"></line>
                                        </svg>
                                </button>
                        </div>
                        <div class="modal-body" id="authContent">
                        </div>
                </div>
        </div>

        <!-- References Modal (Bottom Sheet) -->
        <div class="modal" id="referencesModal" role="dialog" aria-modal="true" aria-labelledby="referencesModalTitle">
                <div class="modal-content modal-bottom-sheet">
                        <div class="modal-header">
                                <h3 id="referencesModalTitle">Footnotes &amp; References</h3>
                                <button class="close-btn" data-close="referencesModal" aria-label="Close">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                                viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                                <line x1="6" y1="6" x2="18" y2="18"></line>
                                        </svg>
                                </button>
                        </div>
                        <div class="modal-body" id="referencesContent">
                        </div>
                </div>
        </div>

        <div id="toast" class="toast" role="status" aria-live="polite"></div>

        <script type="module" src="app.js?v=9fcf253f6caf95470f819117e764a54af12335ea"></script>
</body>

</html>
