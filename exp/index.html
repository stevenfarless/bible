<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Lege Lux</title>
	<meta name="description" content="Lege Lux is a fast, offline-capable Bible reader with multiple translations, themes, font options, and cross-reference tools — built for focused reading." />
	<meta property="og:title" content="Lege Lux" />
	<meta property="og:description" content="A fast, offline-capable Bible reader with multiple translations, themes, font options, and cross-reference tools — built for focused reading." />
	<meta property="og:type" content="website" />
	<meta name="twitter:card" content="summary" />
	<meta name="twitter:title" content="Lege Lux" />
	<meta name="twitter:description" content="A fast, offline-capable Bible reader with multiple translations, themes, font options, and cross-reference tools — built for focused reading." />
	<meta name="build-id" content="2edc9fa" />

	<script>
		(function () {
			var el = document.documentElement;
			var theme = 'basic';
			try { theme = localStorage.getItem('colorTheme') || 'basic'; } catch (_) {}
			var valid = { dracula: 1, dracula2test: 1, onyx: 1, sage: 1, ember: 1, perplexity: 1, basic: 1, geek: 1, gnome: 1, parchment: 1, vespers: 1, vigil: 1 };
			if (!valid[theme]) theme = 'basic';
			el.classList.add(theme + '-theme', 'no-color-transition');

			var mode = 'system';
			try {
				var raw = localStorage.getItem('lightMode');
				if (raw === 'true' || raw === 'light') mode = 'light';
				else if (raw === 'false' || raw === 'dark') mode = 'dark';
			} catch (_) {}
			var isLight = mode === 'light' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
			if (isLight) el.classList.add('light-mode');
		}());
	</script>

	<link rel="manifest" href="./site.webmanifest" />
	<link rel="modulepreload" href="app.js" />
	<link rel="modulepreload" href="ui.js" />
	<link rel="modulepreload" href="events.js" />

	<link rel="stylesheet" href="css/base.css?v=2edc9fa" />
	<link rel="stylesheet" href="css/themes.css?v=2edc9fa" />
</head>

<body>
	<div id="topChrome"></div>
	<main id="app"></main>

	<script type="module" src="app.js?v=2edc9fa"></script>
</body>

</html>
