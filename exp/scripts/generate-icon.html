<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lege Lux — Icon Generator</title>
  <!-- JSZip for in-browser zip creation -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #191a21;
      color: #f8f8f2;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      gap: 1.5rem;
      margin: 0;
    }
    h1 { font-size: 1.1rem; opacity: 0.7; margin: 0; }
    #preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 1rem;
      width: 100%;
      max-width: 700px;
    }
    .preview-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
    }
    .preview-item canvas {
      border-radius: 22%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      width: 100%;
      height: auto;
      max-width: 100px;
    }
    .preview-item span {
      font-size: 0.7rem;
      opacity: 0.55;
      text-align: center;
      white-space: pre-line;
    }
    .btn-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
      max-width: 340px;
    }
    button {
      width: 100%;
      padding: 0.65rem 1.4rem;
      background: #FFD700;
      color: #1e1e2e;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #f0c800; }
    button:disabled { background: #555; color: #999; cursor: not-allowed; }
    #drop-zone {
      width: 100%;
      max-width: 340px;
      padding: 2rem;
      border: 2px dashed #44475a;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    #drop-zone.over { border-color: #FFD700; }
    #drop-zone p { margin: 0; opacity: 0.5; font-size: 0.9rem; }
    #file-input { display: none; }
    .note { font-size: 0.75rem; opacity: 0.4; text-align: center; max-width: 420px; line-height: 1.6; }
    .note code { opacity: 0.8; background: #2a2b38; padding: 0.1em 0.3em; border-radius: 3px; }
    #status { font-size: 0.85rem; opacity: 0.7; min-height: 1.2em; }
  </style>
</head>
<body>
  <h1>Lege Lux — Icon Generator</h1>

  <div id="drop-zone" onclick="document.getElementById('file-input').click()">
    <p>📂 Click or drop <strong>logo_original.png</strong> here</p>
    <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp">
  </div>

  <div id="status">Waiting for image…</div>

  <div id="preview-grid"></div>

  <div class="btn-row">
    <button id="dl-all" disabled onclick="downloadZip()">⇓ Download lege-lux-icons.zip</button>
  </div>

  <p class="note">
    Zip contains two folders:<br>
    <code>icons/</code> — drop contents into your repo’s <code>icons/</code> folder<br>
    <code>root/</code> — <code>favicon.ico.png</code>: convert at
    <a href="https://favicon.io/favicon-converter/" target="_blank" style="color:#FFD700">favicon.io</a>
    then place <code>favicon.ico</code> in repo root
  </p>

  <script>
    const EXPORTS = [
      { path: 'icons/icon-512.png',         size: 512, note: 'PWA manifest • Android' },
      { path: 'icons/icon-192.png',         size: 192, note: 'PWA manifest • Android home screen' },
      { path: 'icons/apple-touch-icon.png', size: 180, note: 'iOS Add to Home Screen' },
      { path: 'icons/favicon-32.png',       size: 32,  note: 'Browser tab' },
      { path: 'icons/favicon-16.png',       size: 16,  note: 'Browser tab (legacy)' },
      { path: 'root/favicon.ico.png',       size: 32,  note: 'Convert → favicon.ico → repo root' },
    ];

    let sourceImg = null;
    const grid    = document.getElementById('preview-grid');
    const dlBtn   = document.getElementById('dl-all');
    const status  = document.getElementById('status');

    // ── File input ───────────────────────────────────
    const dropZone  = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');

    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('over');
      loadFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', () => loadFile(fileInput.files[0]));

    function loadFile(file) {
      if (!file) return;
      status.textContent = 'Loading…';
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          sourceImg = img;
          buildPreviews();
          dlBtn.disabled = false;
          status.textContent = `✓ Loaded — ${img.naturalWidth}×${img.naturalHeight}px`;
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // ── Previews ────────────────────────────────────
    function buildPreviews() {
      grid.innerHTML = '';
      EXPORTS.forEach(exp => {
        const wrap  = document.createElement('div');
        wrap.className = 'preview-item';
        const c = makeCanvas(exp.size);
        const label = document.createElement('span');
        label.textContent = `${exp.path.split('/').pop()}\n${exp.size}×${exp.size}`;
        wrap.appendChild(c);
        wrap.appendChild(label);
        grid.appendChild(wrap);
      });
    }

    // ── Canvas helper ──────────────────────────────
    function makeCanvas(size) {
      const c   = document.createElement('canvas');
      c.width   = size;
      c.height  = size;
      const ctx = c.getContext('2d');
      const iw  = sourceImg.naturalWidth;
      const ih  = sourceImg.naturalHeight;
      const scale = Math.max(size / iw, size / ih);
      const dw  = iw * scale;
      const dh  = ih * scale;
      ctx.drawImage(sourceImg, (size - dw) / 2, (size - dh) / 2, dw, dh);
      return c;
    }

    // Canvas → PNG blob (Promise)
    function canvasToBlob(canvas) {
      return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    }

    // ── Zip download ──────────────────────────────
    async function downloadZip() {
      if (!sourceImg) return;
      dlBtn.disabled = true;
      status.textContent = 'Building zip…';

      const zip = new JSZip();

      for (const exp of EXPORTS) {
        const canvas = makeCanvas(exp.size);
        const blob   = await canvasToBlob(canvas);
        const buf    = await blob.arrayBuffer();
        zip.file(exp.path, buf);
      }

      const zipBlob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
      const a = document.createElement('a');
      a.download = 'lege-lux-icons.zip';
      a.href = URL.createObjectURL(zipBlob);
      a.click();
      URL.revokeObjectURL(a.href);

      status.textContent = `✓ lege-lux-icons.zip downloaded (${EXPORTS.length} files)`;
      dlBtn.disabled = false;
    }
  </script>
</body>
</html>
