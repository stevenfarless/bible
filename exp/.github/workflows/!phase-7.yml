name: "! Phase 7"

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: phase-7-exp
  cancel-in-progress: false

jobs:
  fix:
    name: Defer non-startup CSS and deploy Pages
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exp
        uses: actions/checkout@v6
        with:
          ref: exp
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Defer hidden UI CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          replacements = {
              '<link rel="stylesheet" href="css/modals.css" />': '<link rel="preload" href="css/modals.css" as="style" onload="this.onload=null;this.rel=\'stylesheet\'" />\n\t<noscript><link rel="stylesheet" href="css/modals.css" /></noscript>',
              '<link rel="stylesheet" href="css/interactions.css" />': '<link rel="preload" href="css/interactions.css" as="style" onload="this.onload=null;this.rel=\'stylesheet\'" />\n\t<noscript><link rel="stylesheet" href="css/interactions.css" /></noscript>',
              '<link rel="stylesheet" href="css/utilities.css" />': '<link rel="preload" href="css/utilities.css" as="style" onload="this.onload=null;this.rel=\'stylesheet\'" />\n\t<noscript><link rel="stylesheet" href="css/utilities.css" /></noscript>',
              '<link rel="stylesheet" href="css/geek95.css">': '<link rel="preload" href="css/geek95.css" as="style" onload="this.onload=null;this.rel=\'stylesheet\'">\n\t<noscript><link rel="stylesheet" href="css/geek95.css"></noscript>',
          }

          changed = False
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
                  changed = True

          if not changed and 'rel="preload" href="css/modals.css" as="style"' in text:
              print('Phase 7 CSS deferral is already present.')
          elif not changed:
              raise SystemExit('Expected startup CSS links were not found in index.html.')

          path.write_text(text)
          PY

      - name: Validate changed files
        run: |
          git diff --check

          grep -q 'rel="stylesheet" href="css/fonts.css"' index.html
          grep -q 'rel="stylesheet" href="css/base.css"' index.html
          grep -q 'rel="stylesheet" href="css/tokens.css"' index.html
          grep -q 'rel="stylesheet" href="css/themes.css"' index.html
          grep -q 'rel="stylesheet" href="css/layout.css"' index.html
          grep -q 'rel="stylesheet" href="css/components.css"' index.html
          grep -q 'rel="stylesheet" href="css/pericope.css"' index.html

          grep -q 'rel="preload" href="css/modals.css" as="style"' index.html
          grep -q 'rel="preload" href="css/interactions.css" as="style"' index.html
          grep -q 'rel="preload" href="css/utilities.css" as="style"' index.html
          grep -q 'rel="preload" href="css/geek95.css" as="style"' index.html

          grep -q '<noscript><link rel="stylesheet" href="css/modals.css" /></noscript>' index.html
          grep -q '<noscript><link rel="stylesheet" href="css/interactions.css" /></noscript>' index.html
          grep -q '<noscript><link rel="stylesheet" href="css/utilities.css" /></noscript>' index.html
          grep -q '<noscript><link rel="stylesheet" href="css/geek95.css"></noscript>' index.html

          if grep -q 'rel="stylesheet" href="css/modals.css" />' index.html; then
            echo "modals.css still blocks first render."
            exit 1
          fi

          if grep -q 'rel="stylesheet" href="css/interactions.css" />' index.html; then
            echo "interactions.css still blocks first render."
            exit 1
          fi

          if grep -q 'rel="stylesheet" href="css/utilities.css" />' index.html; then
            echo "utilities.css still blocks first render."
            exit 1
          fi

          if grep -q 'rel="stylesheet" href="css/geek95.css">' index.html; then
            echo "geek95.css still blocks first render."
            exit 1
          fi

          UNEXPECTED="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev '^(index.html)$' || true)"
          test -z "$UNEXPECTED" || {
            echo "Unexpected changed files:"
            echo "$UNEXPECTED"
            exit 1
          }

      - name: Install dependencies
        run: |
          npm install --package-lock=false
          npm install --no-save --package-lock=false @playwright/test esbuild firebase marked
          npx playwright install chromium --with-deps

      - name: Run unit tests
        run: npm test

      - name: Run Chromium tests
        env:
          BASE_URL: http://localhost:8080
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          python3 -m http.server 8080 > /tmp/lege-lux-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 10); do
            curl -fsS http://localhost:8080 > /dev/null && break
            sleep 1
          done

          curl -fsS http://localhost:8080 > /dev/null || {
            cat /tmp/lege-lux-http.log
            exit 1
          }

          npx playwright test tests/smoke.spec.js tests/auth-settings-race.spec.js --project=chromium

      - name: Run offline build audit
        run: node scripts/prepare-offline-build.mjs

      - name: Commit Phase 7
        run: |
          FILES=(
            index.html
          )

          if git diff --quiet -- "${FILES[@]}"; then
            echo "No Phase 7 changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "${FILES[@]}"
            git commit -F - <<'EOF'
          perf(css): defer non-startup stylesheets

          Load modal, interaction, utility, and Geek95 styles after first paint
          while keeping startup layout, theme, font, component, and passage CSS
          render-blocking to reduce flicker risk.

          Refs #393
          EOF
            git push origin exp
          fi

      - name: Dispatch GitHub Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESPONSE_FILE="$(mktemp)"
          STATUS="$({
            curl -sS \
              -o "$RESPONSE_FILE" \
              -w '%{http_code}' \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-gh-pages.yml/dispatches" \
              -d '{"ref":"exp"}'
          })"

          if [ "$STATUS" != "204" ]; then
            echo "Deploy to GitHub Pages workflow dispatch failed with HTTP $STATUS."
            cat "$RESPONSE_FILE"
            exit 1
          fi

          echo "Deploy to GitHub Pages workflow dispatched for exp."
