name: "! instant upgrade"

on:
  push:
    branches:
      - exp
    paths:
      - ".github/workflows/! instant upgrade.yml"
  workflow_dispatch:

jobs:
  patch:
    name: Patch raw-prefix search
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout exp
        uses: actions/checkout@v4
        with:
          ref: exp
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply raw-prefix search patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          bible_path = Path('bible-api.js')
          bible = bible_path.read_text(encoding='utf-8')

          if 'function _buildSearchToken(token)' not in bible:
              replacement = """function _buildSearchToken(token) {
    return {
        raw: token,
        normalized: _normalizeTerm(token),
    };
}

function _termMatchRank(term, token) {
    if (token.raw === term.raw || token.normalized === term.normalized) return TEXT_MATCH_EXACT;
    if (term.raw.length >= PREFIX_MATCH_MIN_LENGTH && token.raw.startsWith(term.raw)) return TEXT_MATCH_PREFIX;
    if (term.normalized.length >= PREFIX_MATCH_MIN_LENGTH && token.normalized.startsWith(term.normalized)) return TEXT_MATCH_PREFIX;
    return TEXT_MATCH_NONE;
}

function _buildTextMatcher(query) {
    const terms = _tokenizeSearchText(query)
        .map((term) => _buildSearchToken(term))
        .filter((term) => term.raw || term.normalized);

    return (value) => {
        const tokens = _tokenizeSearchText(value)
            .map((token) => _buildSearchToken(token))
            .filter((token) => token.raw || token.normalized);
        let overallRank = TEXT_MATCH_EXACT;

        for (const term of terms) {
            let termRank = TEXT_MATCH_NONE;

            for (const token of tokens) {
                const rank = _termMatchRank(term, token);
                if (rank > termRank) termRank = rank;
                if (termRank === TEXT_MATCH_EXACT) break;
            }

            if (termRank === TEXT_MATCH_NONE) return TEXT_MATCH_NONE;
            if (termRank < overallRank) overallRank = termRank;
        }

        return overallRank;
    };
}"""
              bible, count = re.subn(
                  r"function _termMatchRank\(term, token\) \{.*?\n\}\n\nfunction _buildTextMatcher\(query\) \{.*?\n\}",
                  replacement,
                  bible,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit('Failed to replace current text matcher')

          bible_path.write_text(bible, encoding='utf-8')

          test_path = Path('tests/unit/bible-api-search.test.js')
          test = test_path.read_text(encoding='utf-8')

          if "'Genesis 1:10': 'predestinated us unto adoption'" not in test:
              test = test.replace(
                  "        'Genesis 1:9': 'the word was spoken',",
                  "        'Genesis 1:9': 'the word was spoken',\n        'Genesis 1:10': 'predestinated us unto adoption',\n        'Genesis 1:11': 'predestin doctrine appears',",
                  1,
              )
              test = test.replace(
                  "                '9': 'The word was spoken',",
                  "                '9': 'The word was spoken',\n                '10': 'Predestinated us unto adoption',\n                '11': 'Predestin doctrine appears',",
                  1,
              )

          regression_tests = """
    it('matches raw prefixes before normalization can alter the query', async () => {
        const api = makeApi();
        const { results } = await api.searchPassages('predest');

        expect(results.map((result) => result.reference)).toEqual([
            'Genesis 1:10',
            'Genesis 1:11',
        ]);
    });

    it('matches raw prefixes when falling back to book scanning', async () => {
        const api = makeApi();
        api._searchIndexCache.set('KJV', null);
        const { results } = await api.searchPassages('predest');

        expect(results.map((result) => result.reference)).toEqual([
            'Genesis 1:10',
            'Genesis 1:11',
        ]);
    });
"""

          if "matches raw prefixes before normalization can alter the query" not in test:
              marker = '\n});'
              index = test.rfind(marker)
              if index == -1:
                  raise SystemExit('Failed to find test describe close')
              test = test[:index] + '\n' + regression_tests.rstrip() + test[index:]

          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Validate syntax
        run: |
          node --check bible-api.js
          node --check tests/unit/bible-api-search.test.js

      - name: Commit raw-prefix fix
        run: |
          git config user.name "stevenfarless"
          git config user.email "125781365+stevenfarless@users.noreply.github.com"
          git add bible-api.js tests/unit/bible-api-search.test.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix(search): preserve raw prefixes" \
            -m "Keep raw and normalized forms during text matching so searches like predest still prefix-match predestinated after normalization. Preserve exact-before-prefix ranking and cover the regression with unit tests."
          git push origin HEAD:exp
