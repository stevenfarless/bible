name: "! Picker"

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: picker-exp
  cancel-in-progress: false

jobs:
  implement:
    name: Chain book, chapter, and verse pickers
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exp
        uses: actions/checkout@v7
        with:
          ref: exp
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Apply picker flow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          index_path = 'index.html'
          index = read(index_path)
          if 'id="verseGoButton"' not in index:
              old = '''            <div class="modal-body">
                <div id="verseGrid" class="chapter-grid"></div>
            </div>
'''
              new = '''            <div class="modal-body">
                <div class="picker-actions">
                    <button id="verseGoButton" class="primary-btn" type="button"
                        aria-label="Go to selected chapter without choosing a verse">
                        Go
                    </button>
                </div>
                <div id="verseGrid" class="chapter-grid"></div>
            </div>
'''
              index = replace_once(index, old, new, 'index.html verse modal body')
              write(index_path, index)

          components_path = 'css/components.css'
          components = read(components_path)
          if '.picker-actions {' not in components:
              anchor = '''.chapter-item:hover {
    background-color: var(--primary-color);
    border-color: var(--primary-color);
    color: var(--bg-base);
    transform: scale(1.05);
}

'''
              insert = anchor + '''.picker-actions {
    display: flex;
    justify-content: flex-end;
    margin-bottom: var(--spacing-md);
}

.picker-actions .primary-btn {
    min-width: 96px;
}

'''
              components = replace_once(components, anchor, insert, 'css/components.css picker action insertion')
              write(components_path, components)

          ui_path = 'ui.js'
          ui = read(ui_path)
          if '"verseGoButton",' not in ui:
              ui = replace_once(
                  ui,
                  '    "verseGrid",\n',
                  '    "verseGrid",\n    "verseGoButton",\n',
                  'ui.js REQUIRED_IDS verseGoButton',
              )
          if 'app.verseGoButton = document.getElementById("verseGoButton");' not in ui:
              ui = replace_once(
                  ui,
                  '    app.verseGrid = document.getElementById("verseGrid");\n',
                  '    app.verseGrid = document.getElementById("verseGrid");\n    app.verseGoButton = document.getElementById("verseGoButton");\n',
                  'ui.js cache verseGoButton',
              )
          write(ui_path, ui)

          app_path = 'app.js'
          app = read(app_path)
          if 'this.referencePickerDraft = null;' not in app:
              app = replace_once(
                  app,
                  '        this._translationKbIndex = -1;\n',
                  '        this._translationKbIndex = -1;\n        this.referencePickerDraft = null;\n',
                  'app.js referencePickerDraft property',
              )
              write(app_path, app)

          modals_path = 'modals.js'
          modals = read(modals_path)
          old = '''        button.addEventListener('click', () => {
            app.state.selectedVerse = null;
            app.loadPassage(book, 1);
            app.closeModal(app.bookModal);
        });
'''
          new = '''        button.addEventListener('click', () => {
            app.referencePickerDraft = { book, chapter: 1 };
            app.state.selectedVerse = null;
            app.closeModal(app.bookModal);
            app.openChapterModal();
        });
'''
          if old in modals:
              modals = replace_once(modals, old, new, 'modals.js book button flow')

          old = '''    app.chapterModalBook.textContent = app.getDisplayName(app.state.currentBook);
    app.chapterGrid.innerHTML = '';

    const chapterCount = app.getChapterCount(app.state.currentBook);
'''
          new = '''    const book = app.referencePickerDraft?.book || app.state.currentBook;

    app.chapterModalBook.textContent = app.getDisplayName(book);
    app.chapterGrid.innerHTML = '';

    const chapterCount = app.getChapterCount(book);
'''
          if old in modals:
              modals = replace_once(modals, old, new, 'modals.js chapter draft book')

          old = '''        btn.addEventListener('click', () => {
            app.state.selectedVerse = null;
            app.loadPassage(app.state.currentBook, i);
            app.closeModal(app.chapterModal);
        });
'''
          new = '''        btn.addEventListener('click', async () => {
            const book = app.referencePickerDraft?.book || app.state.currentBook;

            app.referencePickerDraft = { book, chapter: i };
            app.state.selectedVerse = null;

            await app.loadPassage(book, i);

            app.closeModal(app.chapterModal);
            app.openVerseModal();
        });
'''
          if old in modals:
              modals = replace_once(modals, old, new, 'modals.js chapter button flow')

          old = '''        btn.addEventListener('click', () => {
            app.scrollToVerse(i);
            app.closeModal(app.verseModal);
        });
'''
          new = '''        btn.addEventListener('click', () => {
            app.referencePickerDraft = null;
            app.scrollToVerse(i);
            app.closeModal(app.verseModal);
        });
'''
          if old in modals:
              modals = replace_once(modals, old, new, 'modals.js verse button clears draft')
          write(modals_path, modals)

          events_path = 'events.js'
          events = read(events_path)
          old = '''    app.bookSelector?.addEventListener('click', () => app.openBookModal());
    app.chapterSelector?.addEventListener('click', () => app.openChapterModal());
    app.verseSelector?.addEventListener('click', () => app.openVerseModal());
'''
          new = '''    app.bookSelector?.addEventListener('click', () => {
        app.referencePickerDraft = null;
        app.openBookModal();
    });
    app.chapterSelector?.addEventListener('click', () => {
        app.referencePickerDraft = null;
        app.openChapterModal();
    });
    app.verseSelector?.addEventListener('click', () => {
        app.referencePickerDraft = null;
        app.openVerseModal();
    });
'''
          if old in events:
              events = replace_once(events, old, new, 'events.js direct picker listeners')

          if 'app.verseGoButton?.addEventListener' not in events:
              anchor = '''    app.closeVerseModal?.addEventListener('click', () => app.closeModal(app.verseModal));
'''
              insert = anchor + '''    app.verseGoButton?.addEventListener('click', () => {
        app.referencePickerDraft = null;
        app.closeModal(app.verseModal);
    });
'''
              events = replace_once(events, anchor, insert, 'events.js verse Go listener')
          write(events_path, events)

          tests_path = 'tests/smoke.spec.js'
          tests = read(tests_path)
          old = '''test('book navigation: selecting a book loads its first chapter', async ({ page }) => {
        await page.goto('/');
        await waitForPassage(page);

        await page.locator('#bookSelector').click();
        await expect(page.locator('#bookModal')).toBeVisible();

        await page.locator('#newTestamentBooks button', { hasText: 'Matt' }).first().click();

        await expect(page.locator('#bookModal')).not.toHaveClass(/active/);
        await expect(page.locator('#passageTitle')).toContainText('Matthew 1');
        await expect(page.locator('#passageText')).not.toBeEmpty();
});
'''
          new = '''test('reference picker: book, chapter, verse flow supports verse and Go', async ({ page }) => {
        await page.goto('/');
        await waitForPassage(page);

        await page.locator('#bookSelector').click();
        await expect(page.locator('#bookModal')).toBeVisible();

        await page.locator('#newTestamentBooks button', { hasText: 'John' }).first().click();

        await expect(page.locator('#bookModal')).not.toHaveClass(/active/);
        await expect(page.locator('#chapterModal')).toBeVisible();
        await expect(page.locator('#chapterModalBook')).toHaveText('John');

        await page.locator('#chapterGrid button', { hasText: '3' }).first().click();

        await expect(page.locator('#chapterModal')).not.toHaveClass(/active/);
        await expect(page.locator('#passageTitle')).toContainText('John 3');
        await expect(page.locator('#passageText')).not.toBeEmpty();
        await expect(page.locator('#verseModal')).toBeVisible();

        await page.locator('#verseGrid button', { hasText: '16' }).first().click();

        await expect(page.locator('#verseModal')).not.toHaveClass(/active/);
        await expect(page.locator('#currentVerse')).toHaveText('16');

        await page.locator('#bookSelector').click();
        await page.locator('#newTestamentBooks button', { hasText: 'Matt' }).first().click();
        await page.locator('#chapterGrid button', { hasText: '2' }).first().click();

        await expect(page.locator('#passageTitle')).toContainText('Matthew 2');
        await expect(page.locator('#verseModal')).toBeVisible();

        await page.locator('#verseGoButton').click();

        await expect(page.locator('#verseModal')).not.toHaveClass(/active/);
        await expect(page.locator('#passageTitle')).toContainText('Matthew 2');
        await expect(page.locator('#currentVerse')).toHaveText('1');
});
'''
          if old in tests:
              tests = replace_once(tests, old, new, 'tests/smoke.spec.js book picker flow test')

          old = '''test('chapter navigation: selecting a chapter loads passage text', async ({ page }) => {
        await page.goto('/');
        await waitForPassage(page);

        await page.locator('#chapterSelector').click();
        await expect(page.locator('#chapterModal')).toBeVisible();
        await page.locator('#chapterGrid button', { hasText: '2' }).first().click();

        await expect(page.locator('#chapterModal')).not.toHaveClass(/active/);
        await expect(page.locator('#passageTitle')).toContainText('Genesis 2');
        await expect(page.locator('#passageText')).not.toBeEmpty();
});
'''
          new = '''test('chapter navigation: selecting a chapter opens verse picker and Go keeps chapter', async ({ page }) => {
        await page.goto('/');
        await waitForPassage(page);

        await page.locator('#chapterSelector').click();
        await expect(page.locator('#chapterModal')).toBeVisible();
        await page.locator('#chapterGrid button', { hasText: '2' }).first().click();

        await expect(page.locator('#chapterModal')).not.toHaveClass(/active/);
        await expect(page.locator('#passageTitle')).toContainText('Genesis 2');
        await expect(page.locator('#passageText')).not.toBeEmpty();
        await expect(page.locator('#verseModal')).toBeVisible();

        await page.locator('#verseGoButton').click();

        await expect(page.locator('#verseModal')).not.toHaveClass(/active/);
        await expect(page.locator('#passageTitle')).toContainText('Genesis 2');
});
'''
          if old in tests:
              tests = replace_once(tests, old, new, 'tests/smoke.spec.js chapter picker Go test')

          old = '''        await page.locator('#chapterSelector').click();
        await page.locator('#chapterGrid button', { hasText: '2' }).first().click();
        await waitForPassage(page);

        await page.locator('#chapterSelector').click();
        await page.locator('#chapterGrid button', { hasText: '1' }).first().click();
        await waitForPassage(page);
'''
          new = '''        await page.locator('#chapterSelector').click();
        await page.locator('#chapterGrid button', { hasText: '2' }).first().click();
        await expect(page.locator('#verseModal')).toBeVisible();
        await page.locator('#verseGoButton').click();
        await waitForPassage(page);

        await page.locator('#chapterSelector').click();
        await page.locator('#chapterGrid button', { hasText: '1' }).first().click();
        await expect(page.locator('#verseModal')).toBeVisible();
        await page.locator('#verseGoButton').click();
        await waitForPassage(page);
'''
          if old in tests:
              tests = replace_once(tests, old, new, 'tests/smoke.spec.js passage cache picker flow')
          write(tests_path, tests)
          PY

      - name: Validate implementation markers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          required = {
              'index.html': [
                  'id="verseGoButton"',
                  'class="picker-actions"',
                  'Go\n                    </button>',
              ],
              'css/components.css': [
                  '.picker-actions {',
                  '.picker-actions .primary-btn {',
                  'min-width: 96px;',
              ],
              'ui.js': [
                  '"verseGoButton",',
                  'app.verseGoButton = document.getElementById("verseGoButton");',
              ],
              'app.js': [
                  'this.referencePickerDraft = null;',
              ],
              'modals.js': [
                  'app.referencePickerDraft = { book, chapter: 1 };',
                  'const book = app.referencePickerDraft?.book || app.state.currentBook;',
                  'await app.loadPassage(book, i);',
                  'app.openVerseModal();',
                  'app.referencePickerDraft = null;',
              ],
              'events.js': [
                  'app.verseGoButton?.addEventListener',
                  'app.referencePickerDraft = null;',
                  'app.openBookModal();',
                  'app.openChapterModal();',
                  'app.openVerseModal();',
              ],
              'tests/smoke.spec.js': [
                  'reference picker: book, chapter, verse flow supports verse and Go',
                  'chapter navigation: selecting a chapter opens verse picker and Go keeps chapter',
                  "page.locator('#verseGoButton').click()",
              ],
          }

          for path_name, snippets in required.items():
              text = Path(path_name).read_text(encoding='utf-8')
              for snippet in snippets:
                  assert snippet in text, f'Missing from {path_name}: {snippet}'

          assert Path('index.html').read_text(encoding='utf-8').count('id="verseGoButton"') == 1
          assert Path('ui.js').read_text(encoding='utf-8').count('verseGoButton') >= 2
          PY

      - name: Verify changed files
        run: |
          allowed='^(index\.html|ui\.js|app\.js|modals\.js|events\.js|css/components\.css|tests/smoke\.spec\.js)$'
          unexpected="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"

          test -z "$unexpected" || {
            echo "Unexpected changed files:"
            echo "$unexpected"
            exit 1
          }

      - name: Run syntax checks
        run: |
          node --check app.js
          node --check ui.js
          node --check modals.js
          node --check events.js
          node --check tests/smoke.spec.js
          git diff --check

      - name: Install smoke test dependencies
        run: |
          npm install --package-lock=false
          npm install --no-save --package-lock=false @playwright/test

      - name: Run picker smoke tests
        env:
          BASE_URL: http://localhost:8080
        run: |
          npx playwright install chromium --with-deps
          python3 -m http.server 8080 > /tmp/lege-lux-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for i in $(seq 1 10); do
            curl -fsS http://localhost:8080 > /dev/null && break
            sleep 1
          done

          curl -fsS http://localhost:8080 > /dev/null || {
            cat /tmp/lege-lux-http.log
            exit 1
          }

          npx playwright test tests/smoke.spec.js --project=chromium --grep "reference picker|chapter navigation|verse navigation|passage cache"

      - name: Commit picker flow
        run: |
          files=(
            index.html
            ui.js
            app.js
            modals.js
            events.js
            css/components.css
            tests/smoke.spec.js
          )

          git diff --check
          git diff --stat -- "${files[@]}"

          if [ -z "$(git status --porcelain -- "${files[@]}")" ]; then
            echo "Picker flow is already implemented."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -F - <<'EOF'
          feat(nav): chain picker selection flow

          Advance book selections into the chapter picker, then load the chosen
          chapter and open verse selection. Add a Go action so users can stop at
          the selected chapter without choosing a verse.
          EOF
          git push origin exp

      - name: Dispatch GitHub Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESPONSE_FILE="$(mktemp)"
          STATUS="$(
            curl -sS \
              -o "$RESPONSE_FILE" \
              -w '%{http_code}' \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-gh-pages.yml/dispatches" \
              -d '{"ref":"exp"}'
          )"

          if [ "$STATUS" != "204" ]; then
            echo "Deploy to GitHub Pages workflow dispatch failed with HTTP $STATUS."
            cat "$RESPONSE_FILE"
            exit 1
          fi

          echo "Deploy to GitHub Pages dispatched for exp."
