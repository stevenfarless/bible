name: Tidy Translation Registry Cache Fix

on:
  push:
    branches:
      - exp
    paths:
      - '.github/workflows/tidy-translation-registry-cache-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    name: Align registry cache fix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exp
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: exp
          fetch-depth: 0

      - name: Correct indentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.js')
          text = path.read_text()
          old = '''      const buildId =
  document.querySelector('meta[name="build-id"]')?.content || "";
const registryUrl =
  buildId && !buildId.startsWith("__BUILD_")
    ? `./translations/index.json?v=${encodeURIComponent(buildId)}`
    : "./translations/index.json";
const res = await fetch(registryUrl);'''
          new = '''      const buildId =
        document.querySelector('meta[name="build-id"]')?.content || "";
      const registryUrl =
        buildId && !buildId.startsWith("__BUILD_")
          ? `./translations/index.json?v=${encodeURIComponent(buildId)}`
          : "./translations/index.json";
      const res = await fetch(registryUrl);'''

          if text.count(old) != 1:
              raise SystemExit('Expected misindented registry block not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate final change
        shell: bash
        run: |
          node --check app.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          text = Path('app.js').read_text()
          expected = '''      const buildId =
        document.querySelector('meta[name="build-id"]')?.content || "";
      const registryUrl =
        buildId && !buildId.startsWith("__BUILD_")
          ? `./translations/index.json?v=${encodeURIComponent(buildId)}`
          : "./translations/index.json";
      const res = await fetch(registryUrl);'''
          if expected not in text:
              raise SystemExit('Final registry block does not match expected formatting')
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/tidy-translation-registry-cache-fix.yml

      - name: Commit formatting correction
        shell: bash
        run: |
          git config user.name "stevenfarless"
          git config user.email "125781365+stevenfarless@users.noreply.github.com"
          git add app.js .github/workflows/tidy-translation-registry-cache-fix.yml
          git commit -m "style(translations): align registry cache fix" -m "Align the build-versioned translation registry fetch with the surrounding startup code without changing behavior."
          git push origin exp
