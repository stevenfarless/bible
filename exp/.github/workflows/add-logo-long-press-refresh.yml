name: Add Logo Long-Press Refresh

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-app:
    name: Patch app.js
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: exp
          fetch-depth: 0

      - name: Patch app.js
        run: python3 .github/scripts/add_logo_long_press_refresh.py

      - name: Verify changes
        run: |
          git diff --check
          git diff -- app.js

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "feat: add long-press logo hard refresh"
          git push origin exp
