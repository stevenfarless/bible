name: Normalize Translation JSON

on:
  workflow_dispatch:

jobs:
  normalize:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout feature/special-access
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: feature/special-access

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Run normalizer
        run: python .github/scripts/normalize_translations.py

      - name: Commit normalized files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add translations/
          git diff --cached --quiet && echo "Nothing to commit" || \
            git commit -m "fix: normalize translation JSON to {Book:{ch:{vs:text}}} format"
          git push
