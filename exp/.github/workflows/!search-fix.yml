name: "! search fix"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: search-fix-issue-390-exp
  cancel-in-progress: false

jobs:
  fix-search:
    name: Fix issue 390 search matching
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exp
        uses: actions/checkout@v6
        with:
          ref: exp
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Apply issue 390 patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          api_path = Path('bible-api.js')
          text = api_path.read_text(encoding='utf-8')

          new_text_matcher = r"""function _tokenizeSearchText(value) {
              return String(value || '')
                  .toLowerCase()
                  .split(/[^\p{L}\p{N}']+/u)
                  .filter(Boolean);
          }

          function _buildTextMatcher(query) {
              const normalizedTerms = _tokenizeSearchText(query).map((term) => _normalizeTerm(term));

              return (value) => {
                  const normalizedTokens = new Set(
                      _tokenizeSearchText(value).map((token) => _normalizeTerm(token))
                  );

                  return normalizedTerms.every((term) => normalizedTokens.has(term));
              };
          }
          """

          helper_start = 'function _buildStemRegex(q) {'
          helper_end = '\n\nexport async function loadTranslationIndex()'
          if helper_start in text:
              start = text.index(helper_start)
              end = text.index(helper_end, start)
              text = text[:start] + new_text_matcher + text[end:]
          elif 'function _buildTextMatcher(query)' not in text:
              raise SystemExit('Expected search matcher helper block was not found.')

          old_eth_block = """    if (w.endsWith('eth') && w.length > 4) {
                  return _normalizeTerm(w.slice(0, -3));
              }
          """
          new_eth_block = """    if (w.endsWith('eth') && w.length > 4) {
                  return _normalizeTerm(w.slice(0, -3));
              }
              if (w.endsWith('ing') && w.length > 5) {
                  return _normalizeTerm(w.slice(0, -3));
              }
          """

          if "w.endsWith('ing')" not in text:
              if old_eth_block not in text:
                  raise SystemExit('Expected _normalizeTerm eth block was not found.')
              text = text.replace(old_eth_block, new_eth_block, 1)

          replacements = {
              "const stemRegexes = mode === 'text' ? _buildStemRegex(normalizedQ) : [];":
                  "const textMatcher = mode === 'text' ? _buildTextMatcher(normalizedQ) : null;",
              "const stemRegexes = mode === 'text' ? _buildStemRegex(q.toLowerCase()) : [];":
                  "const textMatcher = mode === 'text' ? _buildTextMatcher(q.toLowerCase()) : null;",
          }

          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'Expected search matcher setup was not found: {old}')

          old_matcher = ": (value) => stemRegexes.every((re) => re.test(String(value || '')));"
          new_matcher = ": (value) => textMatcher?.(value) ?? false;"
          matcher_count = text.count(old_matcher)
          if matcher_count:
              text = text.replace(old_matcher, new_matcher)
          elif text.count(new_matcher) < 2:
              raise SystemExit('Expected stemRegex matcher branches were not found.')

          if '_buildStemRegex' in text or 'stemRegexes' in text:
              raise SystemExit('Obsolete stem regex search code is still present.')
          if text.count('function _buildTextMatcher(query)') != 1:
              raise SystemExit('Expected exactly one _buildTextMatcher helper.')

          api_path.write_text(text, encoding='utf-8')

          test_path = Path('tests/unit/bible-api-search.test.js')
          test_path.write_text(r"""import { describe, it, expect } from 'vitest';
          import { BibleApi } from '../../bible-api.js';

          function makeApi() {
              const api = new BibleApi('KJV');

              api._searchIndexCache.set('KJV', {
                  'Genesis 1:1': 'he that hateth his brother',
                  'Genesis 1:2': 'he hath spoken',
                  'Genesis 1:3': 'they hated him',
                  'Genesis 1:4': 'sin entered the world',
                  'Genesis 1:5': 'since that day',
                  'Genesis 1:6': 'the man stood',
                  'Genesis 1:7': 'many were there',
                  'Genesis 1:8': 'he spoke plainly',
                  'Genesis 1:9': 'the word was spoken',
              });

              api._bookCache.set('KJV/Genesis', {
                  Genesis: {
                      '1': {
                          '1': 'He that hateth his brother',
                          '2': 'He hath spoken',
                          '3': 'They hated him',
                          '4': 'Sin entered the world',
                          '5': 'Since that day',
                          '6': 'The man stood',
                          '7': 'Many were there',
                          '8': 'He spoke plainly',
                          '9': 'The word was spoken',
                      },
                  },
              });

              return api;
          }

          describe('BibleApi search word matching', () => {
              it('matches hate forms without matching hath', async () => {
                  const api = makeApi();
                  const { results } = await api.searchPassages('hate');

                  expect(results.map((result) => result.reference)).toEqual([
                      'Genesis 1:1',
                      'Genesis 1:3',
                  ]);
              });

              it('does not match sin inside since', async () => {
                  const api = makeApi();
                  const { results } = await api.searchPassages('sin');

                  expect(results.map((result) => result.reference)).toEqual([
                      'Genesis 1:4',
                  ]);
              });

              it('does not match man inside many', async () => {
                  const api = makeApi();
                  const { results } = await api.searchPassages('man');

                  expect(results.map((result) => result.reference)).toEqual([
                      'Genesis 1:6',
                  ]);
              });

              it('does not match he inside the', async () => {
                  const api = makeApi();
                  const { results } = await api.searchPassages('he');

                  expect(results.map((result) => result.reference)).toEqual([
                      'Genesis 1:1',
                      'Genesis 1:2',
                      'Genesis 1:8',
                  ]);
              });
          });
          """, encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path

          api = Path('bible-api.js').read_text(encoding='utf-8')
          test = Path('tests/unit/bible-api-search.test.js').read_text(encoding='utf-8')

          assert 'function _buildTextMatcher(query)' in api
          assert 'function _buildStemRegex' not in api
          assert 'stemRegexes' not in api
          assert "w.endsWith('ing')" in api
          assert "textMatcher?.(value) ?? false" in api
          assert "matches hate forms without matching hath" in test
          assert "does not match he inside the" in test
          PY

      - name: Validate issue 390 patch
        run: |
          node --check bible-api.js
          node --check tests/unit/bible-api-search.test.js
          git diff --check

          unexpected="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev '^(bible-api\.js|tests/unit/bible-api-search\.test\.js)$' || true)"
          test -z "$unexpected" || {
            echo "Unexpected changed files:"
            echo "$unexpected"
            exit 1
          }

      - name: Install dependencies
        run: npm install --package-lock=false

      - name: Run unit tests
        run: npm test

      - name: Commit issue 390 fix
        run: |
          files=(
            bible-api.js
            tests/unit/bible-api-search.test.js
          )

          if [ -z "$(git status --porcelain -- "${files[@]}")" ]; then
            echo "Issue 390 is already fixed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -F - <<'EOF'
          fix(search): prevent partial word matches

          Replace prefix based stem regex matching with normalized token matching
          so searches like hate, sin, and man no longer match unrelated words
          such as hath, since, and many.

          Add regression coverage for the known false positives from issue #390.

          Closes #390
          EOF
          git push origin exp
