name: "! Phase 5"

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: issue-389-phase-5-exp
  cancel-in-progress: false

jobs:
  fix:
    name: Improve copyright contrast and deploy Pages
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exp
        uses: actions/checkout@v6
        with:
          ref: exp
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Apply reviewed patch
        run: |
          PATCH=.github/patches/issue-389-phase-5.patch

          if git apply --check --recount "$PATCH"; then
            git apply --recount "$PATCH"
          elif git apply --reverse --check --recount "$PATCH"; then
            echo "Phase 5 changes are already present."
          else
            echo "The affected files no longer match the reviewed Phase 5 patch."
            exit 1
          fi

      - name: Validate changed files
        run: |
          node --check tests/smoke.spec.js
          git diff --check

          grep -A4 '^\.copyright {' css/components.css | grep -q 'color: var(--text-body);'
          grep -q 'copyright text meets WCAG AA contrast' tests/smoke.spec.js

          if grep -A4 '^\.copyright {' css/components.css | grep -q 'color: var(--text-muted);'; then
            echo "Copyright text still uses the low-contrast muted color."
            exit 1
          fi

          UNEXPECTED="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev '^(css/components.css|tests/smoke.spec.js)$' || true)"
          test -z "$UNEXPECTED" || {
            echo "Unexpected changed files:"
            echo "$UNEXPECTED"
            exit 1
          }

      - name: Install dependencies
        run: |
          npm install --package-lock=false
          npm install --no-save --package-lock=false @playwright/test esbuild firebase marked
          npx playwright install chromium --with-deps

      - name: Run unit tests
        run: npm test

      - name: Run Chromium tests
        env:
          BASE_URL: http://localhost:8080
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          python3 -m http.server 8080 > /tmp/lege-lux-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 10); do
            curl -fsS http://localhost:8080 > /dev/null && break
            sleep 1
          done

          curl -fsS http://localhost:8080 > /dev/null || {
            cat /tmp/lege-lux-http.log
            exit 1
          }

          npx playwright test tests/smoke.spec.js tests/auth-settings-race.spec.js --project=chromium

      - name: Run offline build audit
        run: node scripts/prepare-offline-build.mjs

      - name: Commit Phase 5
        run: |
          FILES=(
            css/components.css
            tests/smoke.spec.js
          )

          if git diff --quiet -- "${FILES[@]}"; then
            echo "No Phase 5 changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "${FILES[@]}"
            git commit -F - <<'EOF'
          fix(accessibility): improve copyright text contrast

          Use the theme body-text color for passage copyright notices so the
          small italic text meets WCAG AA contrast requirements.

          Refs #389
          EOF
            git push origin exp
          fi

      - name: Request GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESPONSE_FILE="$(mktemp)"
          STATUS="$({
            curl -sS \
              -o "$RESPONSE_FILE" \
              -w '%{http_code}' \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
          })"

          if [ "$STATUS" != "201" ]; then
            echo "GitHub Pages build request failed with HTTP $STATUS."
            cat "$RESPONSE_FILE"
            exit 1
          fi

          cat "$RESPONSE_FILE"
          echo "GitHub Pages build requested successfully."
