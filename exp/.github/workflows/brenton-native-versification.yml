name: Build Brenton native versification

on:
  push:
    branches:
      - exp
    paths:
      - .github/workflows/brenton-native-versification.yml
      - scripts/apply-brenton-native.py.gz.b64
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exp
        uses: actions/checkout@v4
        with:
          ref: exp
          fetch-depth: 0

      - name: Apply reader architecture
        run: |
          python - <<'PY'
          import base64
          import gzip
          import re
          from pathlib import Path

          payload = Path('scripts/apply-brenton-native.py.gz.b64').read_text(encoding='ascii').strip()
          if len(payload) == 15203:
              payload = payload[:15077] + 'D' + payload[15077:]
          decoded = base64.b64decode(payload, validate=True)
          Path('scripts/apply-brenton-native.py').write_bytes(gzip.decompress(decoded))
          PY
          python scripts/apply-brenton-native.py
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('scripts/import-brenton.py')
          text = path.read_text(encoding='utf-8')
          text, removed = re.subn(
              r'\ndef trim_duplicate_combined_ezra\(.*?\n(?=def main\(\) -> None:)',
              '\n',
              text,
              flags=re.DOTALL,
          )
          if removed != 1:
              raise RuntimeError(f'Expected one Ezra trimming helper, removed {removed}')
          call = '        trim_duplicate_combined_ezra(parsed)\n'
          if call not in text:
              raise RuntimeError('Expected Ezra trimming call')
          text = text.replace(call, '')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Import Brenton corpus and native structure
        run: |
          for attempt in 1 2 3; do
            if python scripts/import-brenton.py; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Validate generated Brenton data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          bst = root / 'translations' / 'BST'
          meta = json.loads((bst / 'meta.json').read_text(encoding='utf-8'))
          books = {book['name']: book for book in meta['books']}

          assert len(meta['books']) == 53, len(meta['books'])
          assert books['Ezra']['chapters'] == 23, books['Ezra']
          assert books['Nehemiah']['chapters'] == 13, books['Nehemiah']
          assert books['Psalm']['chapters'] == 151, books['Psalm']
          assert books['Joel']['chapters'] == 4, books['Joel']
          assert books['Malachi']['chapters'] == 3, books['Malachi']

          psalm = json.loads((bst / 'Psalm.json').read_text(encoding='utf-8'))
          assert 'Lord tends me as a shepherd' in psalm['22']['1'], psalm['22']['1']
          assert "earth is the Lord's" in psalm['23']['1'], psalm['23']['1']

          versification = meta['versification']
          assert versification['scheme'] == 'brenton-lxx'
          assert versification['books']['Psalm']['chapters']['22']['baselineChapters'] == [23]
          assert versification['books']['Psalm']['chapters']['23']['baselineChapters'] == [24]
          assert versification['books']['Psalm']['chapters']['151']['baselineChapters'] == []

          structure_dir = bst / 'BST_structure'
          structure_files = list(structure_dir.glob('*.json'))
          assert len(structure_files) == 53, len(structure_files)
          psalm_structure = json.loads((structure_dir / 'Psalm.json').read_text(encoding='utf-8'))
          assert psalm_structure, 'Psalm native structure is empty'
          assert all(event['type'] in {'heading', 'para_break'} for event in psalm_structure)
          assert not any(
              event.get('type') == 'heading'
              and event.get('ch') == 23
              and 'shepherd' in event.get('text', '').lower()
              for event in psalm_structure
          ), 'Psalm 23 inherited a mismatched shepherd heading'

          daniel = json.loads((bst / 'Daniel.json').read_text(encoding='utf-8'))
          assert '72a' in daniel['3'] and '72b' in daniel['3']

          importer = (root / 'scripts' / 'import-brenton.py').read_text(encoding='utf-8')
          assert 'trim_duplicate_combined_ezra' not in importer

          print(
              'Validated BST:',
              len(meta['books']),
              'books,',
              len(psalm_structure),
              'Psalm structure events'
          )
          PY

      - name: Validate JavaScript and patch cleanliness
        run: |
          python -m py_compile scripts/import-brenton.py
          node --check versification.js
          node --check bsb-structure.js
          node --check bible-api.js
          node --check app.js
          node --check settings.js
          node --check modals.js
          node --check navigation.js
          node --check events.js
          node --check swipe.js
          node --check sw.js
          git diff --check
          test "$(grep -c "BST/BST_structure" bsb-structure.js)" -eq 1
          ! grep -q "Number(heading.dataset.startVerse)" events.js

      - name: Remove one-time integration files
        run: rm .github/workflows/brenton-native-versification.yml scripts/apply-brenton-native.py scripts/apply-brenton-native.py.gz.b64

      - name: Commit native Brenton versification
        run: |
          git config user.name "stevenfarless"
          git config user.email "125781365+stevenfarless@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "feat(translations): add native Brenton versification" -m "Generate Brenton-native passage scaffolding from USFM, add LXX chapter equivalence metadata, and map references across translation changes without applying BSB headings to mismatched LXX numbering."
          git push origin HEAD:exp
