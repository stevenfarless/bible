name: Create Theme

on:
  workflow_dispatch:
    inputs:
      theme_name:
        description: Display name, such as Midnight Blue
        required: true
        type: string
      theme_id:
        description: Lowercase ID used for the CSS class, such as midnight-blue
        required: true
        type: string
      mode:
        description: Theme mode
        required: true
        default: dark
        type: choice
        options:
          - dark
          - light
      bg_base:
        description: Base background, with or without #
        required: true
        type: string
      bg_card:
        description: Card and panel background, with or without #
        required: true
        type: string
      text_heading:
        description: Heading text, with or without #
        required: true
        type: string
      text_body:
        description: Scripture and body text, with or without #
        required: true
        type: string
      text_muted:
        description: Muted text and verse numbers, with or without #
        required: true
        type: string
      primary_color:
        description: Primary interactive color, with or without #
        required: true
        type: string
      brand_secondary:
        description: Secondary brand and section-heading color, with or without #
        required: true
        type: string
      accent_color:
        description: Supporting accent color, with or without #
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-theme:
    name: Create theme
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: exp
          fetch-depth: 0

      - name: Generate theme
        env:
          THEME_NAME: ${{ inputs.theme_name }}
          THEME_ID: ${{ inputs.theme_id }}
          THEME_MODE: ${{ inputs.mode }}
          BG_BASE: ${{ inputs.bg_base }}
          BG_CARD: ${{ inputs.bg_card }}
          TEXT_HEADING: ${{ inputs.text_heading }}
          TEXT_BODY: ${{ inputs.text_body }}
          TEXT_MUTED: ${{ inputs.text_muted }}
          PRIMARY_COLOR: ${{ inputs.primary_color }}
          BRAND_SECONDARY: ${{ inputs.brand_secondary }}
          ACCENT_COLOR: ${{ inputs.accent_color }}
        run: python3 .github/scripts/create_theme.py

      - name: Verify generated theme
        env:
          THEME_ID: ${{ inputs.theme_id }}
        run: |
          node --check ui.js
          git diff --check
          grep -F ":root.${THEME_ID}-theme" css/themes.css
          grep -F "value=\"${THEME_ID}\"" index.html
          grep -F "${THEME_ID}: 1" index.html
          grep -F "'${THEME_ID}-theme'" ui.js
          git diff -- css/themes.css index.html ui.js

      - name: Commit theme
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/themes.css index.html ui.js
          git commit -m "feat: add generated theme"
          git pull --rebase origin exp
          git push origin exp
