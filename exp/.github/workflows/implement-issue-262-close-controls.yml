name: Fix Close Controls

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-close-controls:
    name: Standardize close controls
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: exp
          fetch-depth: 0

      - name: Apply close control fix
        run: python3 .github/scripts/fix_close_controls.py

      - name: Verify changes
        run: |
          node --check modals.js
          node --check app.js
          git diff --check
          grep -F 'class="close-control"' index.html
          grep -F '.close-control {' css/components.css
          grep -F 'stroke: currentColor;' css/components.css
          grep -F 'stroke-width: 3;' css/components.css
          grep -F 'stroke-linecap: round;' css/components.css
          if grep -Eq '<button[^>]*>\s*(×|&#xD7;|&times;)\s*</button>' index.html; then
            echo "Typographic close button remains in index.html"
            exit 1
          fi
          git diff -- index.html modals.js css/components.css css/modals.css

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html modals.js css/components.css css/modals.css
          git commit -m "fix: standardize modal close controls"
          git pull --rebase origin exp
          git push origin exp
