name: "! Apply Issue 253 App Edits"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-issue-253-app-edits-exp
  cancel-in-progress: false

jobs:
  edit-app:
    name: Apply deferred Firebase startup edits to app.js
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exp
        uses: actions/checkout@v6
        with:
          ref: exp
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Verify required supporting changes
        run: |
          grep -q 'export function initializeFirebaseAuth()' config/firebase-config.js || {
            echo 'config/firebase-config.js must export initializeFirebaseAuth() first.'
            exit 1
          }
          grep -q 'export function initializeFirebaseDatabase()' config/firebase-config.js || {
            echo 'config/firebase-config.js must export initializeFirebaseDatabase() first.'
            exit 1
          }
          grep -q 'await app.ensureInteractiveAuth();' auth.js || {
            echo 'auth.js must initialize Auth before interactive account actions.'
            exit 1
          }
          grep -q 'await app.ensureInteractiveDatabase();' auth.js || {
            echo 'auth.js must initialize Database before synchronized account writes.'
            exit 1
          }
          grep -q 'app.canWriteRemoteState()' auth.js || {
            echo 'auth.js must suspend Firebase writes during restoration.'
            exit 1
          }
          grep -q 'app.canWriteRemoteState()' settings.js || {
            echo 'settings.js must suspend Firebase writes during restoration.'
            exit 1
          }
          grep -q 'app.canWriteRemoteState()' ui.js || {
            echo 'ui.js must suspend Firebase writes during restoration.'
            exit 1
          }
          grep -q 'app.canWriteRemoteState()' events.js || {
            echo 'events.js must suspend Firebase writes during restoration.'
            exit 1
          }
          if grep -q "'./config/firebase-config.bundle.js'" sw.js; then
            echo 'Remove the lazy Firebase bundle from the web service-worker APP_SHELL first.'
            exit 1
          fi

      - name: Apply app.js edits
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app.js')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              if new in text:
                  print(f'Already applied: {label}')
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{label}: expected one current-code anchor, found {count}'
                  )
              text = text.replace(old, new, 1)

          def replace_region(start_marker, end_marker, replacement, sentinel, label):
              global text
              if sentinel and sentinel in text:
                  print(f'Already applied: {label}')
                  return
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f'{label}: start marker not found')
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f'{label}: end marker not found')
              text = text[:start] + replacement + text[end:]

          replace_once(
              """        this.auth     = window.firebaseAuth;
                  this.database = window.firebaseDatabase;
                  this.currentUser = null;
                  this.authStateResolved = !this.auth || !this.database;
          """,
              """        this.auth = null;
                  this.database = null;
                  this.currentUser = null;
                  this.authAvailable = null;
                  this.authStateResolved = false;
                  this._firebaseModulePromise = null;
                  this._authInitializationPromise = null;
                  this._databaseInitializationPromise = null;
                  this._authRestorationPromise = null;
                  this._authObserverAttached = false;
                  this._authRestorationScheduled = false;
                  this._firebaseConnectedUnsubscribe = null;
                  this._syncWritesEnabled = false;
          """,
              'constructor Firebase state',
          )

          methods = r"""
              _firebaseModuleUrl() {
                  const buildId =
                      document.querySelector('meta[name="build-id"]')?.content || '';

                  if (buildId && !buildId.startsWith('__BUILD_')) {
                      return (
                          './config/firebase-config.bundle.js?v=' +
                          encodeURIComponent(buildId)
                      );
                  }

                  return './config/firebase-config.bundle.js';
              }

              async _loadFirebaseModule(reason) {
                  if (!this._firebaseModulePromise) {
                      this._dbg.t_firebase_module_start = ms();
                      this._dbgEvent(`firebase module: loading (${reason})`);

                      this._firebaseModulePromise = import(this._firebaseModuleUrl())
                          .then((module) => {
                              this._dbg.t_firebase_module_end = ms();
                              this._dbgEvent(`firebase module: loaded (${reason})`);
                              return module;
                          })
                          .catch((error) => {
                              this._dbg.t_firebase_module_end = ms();
                              this._dbgEvent(
                                  `firebase module: failed (${reason}) — ${error.message}`
                              );
                              throw error;
                          });
                  }

                  return this._firebaseModulePromise;
              }

              async _ensureFirebaseAuth(reason) {
                  if (!this._authInitializationPromise) {
                      this._dbg.t_auth_init_start = ms();
                      this._dbgEvent(`Firebase Auth: initializing (${reason})`);

                      this._authInitializationPromise = this
                          ._loadFirebaseModule(reason)
                          .then((module) => module.initializeFirebaseAuth())
                          .then((auth) => {
                              this.auth = auth;
                              this.authAvailable = true;
                              this._dbg.t_auth_init_end = ms();
                              this._dbgEvent(`Firebase Auth: ready (${reason})`);
                              return auth;
                          })
                          .catch((error) => {
                              this.authAvailable = false;
                              this._dbg.t_auth_init_end = ms();
                              throw error;
                          });
                  }

                  return this._authInitializationPromise;
              }

              async _ensureFirebaseDatabase(reason) {
                  if (!this._databaseInitializationPromise) {
                      this._dbg.t_database_init_start = ms();
                      this._dbgEvent(
                          `Firebase Database/App Check: initializing (${reason})`
                      );

                      this._databaseInitializationPromise = this
                          ._loadFirebaseModule(reason)
                          .then((module) => module.initializeFirebaseDatabase())
                          .then((database) => {
                              this.database = database;
                              this._dbg.t_database_init_end = ms();

                              if (
                                  !this._firebaseConnectedUnsubscribe &&
                                  database.onConnected
                              ) {
                                  this._firebaseConnectedUnsubscribe =
                                      database.onConnected((connected) => {
                                          this._dbg.firebaseConnected = connected;
                                          this._dbgEvent(
                                              `firebase: ${
                                                  connected
                                                      ? 'connected'
                                                      : 'disconnected'
                                              }`
                                          );
                                      });
                              }

                              return database;
                          });
                  }

                  return this._databaseInitializationPromise;
              }

              _attachAuthObserver(auth) {
                  if (this._authObserverAttached) return;

                  this._authObserverAttached = true;
                  auth.onAuthStateChanged((user) => {
                      void this._handleAuthStateChanged(user);
                  });
              }

              async _handleAuthStateChanged(user) {
                  this._dbg.t_auth_state = ms();
                  this.authStateResolved = true;

                  if (!user) {
                      this.currentUser = null;
                      this._syncWritesEnabled = false;
                      this._dbg.authStateUser = 'signed out';
                      this._dbgEvent('auth restoration: signed out');
                      this._dbgEvent(
                          'database/App Check skipped for signed-out session'
                      );

                      this.hideSyncPrompt();
                      await this.loadSyncedTranslationLibrary();
                      this.maybeShowTranslationSyncModal();
                      return;
                  }

                  this.currentUser = user;
                  this._syncWritesEnabled = false;
                  this._dbg.authStateUser = user.email;
                  this._dbgEvent(
                      `auth restoration: signed in as ${user.email}`
                  );
                  this.completeSyncPrompt();

                  try {
                      await this._ensureFirebaseDatabase(
                          'authenticated session restoration'
                      );

                      const translationBefore = this.state.translation;
                      await withTimeout(this.loadUserData(), 5000);
                      const translationSyncResult =
                          await this.loadSyncedTranslationLibrary();

                      this._dbg.t_user_data_loaded = ms();
                      this.applySettings();

                      const bookBefore = this.state.currentBook;
                      const chapterBefore = this.state.currentChapter;
                      await this._loadSavedPositionIfChanged();

                      const positionChanged =
                          this.state.currentBook !== bookBefore ||
                          this.state.currentChapter !== chapterBefore;

                      if (
                          translationSyncResult.activeTranslationChanged &&
                          !positionChanged &&
                          this.state.translation !== translationBefore
                      ) {
                          await this.loadPassage(
                              this.state.currentBook,
                              this.state.currentChapter,
                              Boolean(this.lastScrollPosition)
                          );
                      }

                      this._syncWritesEnabled = true;
                      this.maybeShowTranslationSyncModal();
                      this._dbg.t_firebase_position_end = ms();
                      this._dbg.firebasePositionChanged = positionChanged;
                  } catch (error) {
                      this._syncWritesEnabled = false;
                      console.error('Authenticated restoration failed', error);
                      this._dbgEvent(
                          `auth restoration: synchronization failed — ${error.message}`
                      );
                  }
              }

              async _restoreAuthSession() {
                  if (this._authRestorationPromise) {
                      return this._authRestorationPromise;
                  }

                  this._dbg.t_auth_restore_start = ms();
                  this._dbgEvent('auth restoration: started');

                  this._authRestorationPromise = (async () => {
                      try {
                          const auth = await this._ensureFirebaseAuth(
                              'background restoration'
                          );

                          await auth.ready;
                          this._attachAuthObserver(auth);
                      } catch (error) {
                          this.authAvailable = false;
                          this.authStateResolved = true;
                          this.currentUser = null;
                          console.warn(
                              'Background authentication unavailable:',
                              error
                          );
                          this._dbgEvent(
                              `auth restoration: unavailable — ${error.message}`
                          );
                      }
                  })();

                  return this._authRestorationPromise;
              }

              _startBackgroundAuthRestoration() {
                  if (this._authRestorationScheduled) return;

                  this._authRestorationScheduled = true;
                  this._dbg.t_auth_restore_scheduled = ms();
                  this._dbgEvent(
                      'auth restoration: scheduled after reader reveal'
                  );

                  requestAnimationFrame(() => {
                      requestAnimationFrame(() => {
                          setTimeout(() => {
                              void this._restoreAuthSession();
                          }, 0);
                      });
                  });
              }

              async ensureInteractiveAuth() {
                  try {
                      const auth = await this._ensureFirebaseAuth(
                          'interactive account action'
                      );
                      this._attachAuthObserver(auth);
                      return auth;
                  } catch (error) {
                      throw new Error(
                          'Account services could not be loaded. Check your connection and reload the app.',
                          { cause: error }
                      );
                  }
              }

              async ensureInteractiveDatabase() {
                  try {
                      return await this._ensureFirebaseDatabase(
                          'interactive account action'
                      );
                  } catch (error) {
                      throw new Error(
                          'Synchronization services could not be loaded. Check your connection and try again.',
                          { cause: error }
                      );
                  }
              }

              async ensureInteractiveFirebase() {
                  await this.ensureInteractiveAuth();
                  await this.ensureInteractiveDatabase();
              }

              canWriteRemoteState() {
                  return Boolean(
                      this.currentUser &&
                      this.database &&
                      this._syncWritesEnabled
                  );
              }

          """

          marker = "    getAllBooks()          { return getAllBooks(this); }\n"
          if '_firebaseModuleUrl() {' not in text:
              if text.count(marker) != 1:
                  raise SystemExit('lazy Firebase method insertion marker not found once')
              text = text.replace(marker, methods + marker, 1)
          else:
              print('Already applied: lazy Firebase methods')

          replace_region(
              """            if (!this.auth || !this.database) {
                          console.warn('Firebase not available — sign-in disabled.');
          """,
              "            const cacheHit = this._restorePassageCache();",
              "",
              "firebase module: loading (${reason})",
              'eager Firebase availability and connectivity block',
          )

          replace_once(
              """                revealApp();
                          this._dbgEvent('init: cache hit + position match — skipping fetch');
          """,
              """                revealApp();
                          this._startBackgroundAuthRestoration();
                          this._dbgEvent('init: cache hit + position match — skipping fetch');
          """,
              'cache-hit restoration scheduling',
          )

          replace_once(
              """                revealApp();
                          this._dbgEvent(`init: cache hit but position mismatch — loading ${savedPos.book} ${savedPos.chapter}`);
          """,
              """                revealApp();
                          this._startBackgroundAuthRestoration();
                          this._dbgEvent(`init: cache hit but position mismatch — loading ${savedPos.book} ${savedPos.chapter}`);
          """,
              'position-mismatch restoration scheduling',
          )

          replace_once(
              """                revealApp();
                          this._dbgEvent('init: cache miss — revealing with loading spinner');
          """,
              """                revealApp();
                          this._startBackgroundAuthRestoration();
                          this._dbgEvent('init: cache miss — revealing with loading spinner');
          """,
              'cache-miss restoration scheduling',
          )

          replace_region(
              """            if (!this.auth || !this.database) {
                          await this.loadSyncedTranslationLibrary();
          """,
              "        } catch (err) {",
              """            await this.loadSyncedTranslationLibrary();
                      this.maybeShowTranslationSyncModal();
          """,
              "database/App Check skipped for signed-out session",
              'inline Auth observer removal',
          )

          replace_once(
              """        `  authStateChanged:     ${ts(dbg.t_auth_state)} (${dbg.authStateUser ?? 'n/a'})`,
                  `  userDataLoaded:       ${ts(dbg.t_user_data_loaded)}`,
          """,
              """        `  authRestoreScheduled: ${ts(dbg.t_auth_restore_scheduled)}`,
                  `  authRestoreStart:     ${ts(dbg.t_auth_restore_start)}`,
                  `  firebaseModuleStart:  ${ts(dbg.t_firebase_module_start)}`,
                  `  firebaseModuleEnd:    ${ts(dbg.t_firebase_module_end)}`,
                  `  authInitStart:        ${ts(dbg.t_auth_init_start)}`,
                  `  authInitEnd:          ${ts(dbg.t_auth_init_end)}`,
                  `  databaseInitStart:    ${ts(dbg.t_database_init_start)}`,
                  `  databaseInitEnd:      ${ts(dbg.t_database_init_end)}`,
                  `  authStateChanged:     ${ts(dbg.t_auth_state)} (${dbg.authStateUser ?? 'n/a'})`,
                  `  userDataLoaded:       ${ts(dbg.t_user_data_loaded)}`,
          """,
              'debug lifecycle timings',
          )

          replace_once(
              """(async () => {
                  await new Promise(resolve => {
                      if (document.readyState !== 'loading') return resolve();
                      document.addEventListener('DOMContentLoaded', resolve, { once: true });
                  });
                  await import('./config/firebase-config.bundle.js').catch(
                      (err) => console.warn('Firebase bundle failed to load — sign-in unavailable:', err)
                  );
                  new BibleApp();
              })();
          """,
              """(async () => {
                  await new Promise((resolve) => {
                      if (document.readyState !== 'loading') {
                          resolve();
                          return;
                      }

                      document.addEventListener('DOMContentLoaded', resolve, {
                          once: true,
                      });
                  });

                  new BibleApp();
              })();
          """,
              'boot-time Firebase import removal',
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate app.js boundaries
        run: |
          node --check app.js
          git diff --check

          ! grep -q 'window.firebaseAuth' app.js
          ! grep -q 'window.firebaseDatabase' app.js
          ! grep -q "await import('./config/firebase-config.bundle.js')" app.js
          grep -q '_firebaseModuleUrl()' app.js
          grep -q 'initializeFirebaseAuth()' app.js
          grep -q 'initializeFirebaseDatabase()' app.js
          grep -q 'database/App Check skipped for signed-out session' app.js
          grep -q 'canWriteRemoteState()' app.js

          test "$(grep -c 'this._startBackgroundAuthRestoration();' app.js)" -eq 3
          test "$(git status --porcelain | sed -E 's/^.. //' | grep -vc '^app.js$' || true)" -eq 0

      - name: Install test dependencies
        run: |
          npm install --package-lock=false
          npm install --no-save --package-lock=false @playwright/test

      - name: Run unit tests
        run: npm test

      - name: Run Chromium smoke tests
        env:
          BASE_URL: http://localhost:8080
        run: |
          npx playwright install chromium --with-deps
          python3 -m http.server 8080 > /tmp/lege-lux-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for i in $(seq 1 10); do
            curl -fsS http://localhost:8080 > /dev/null && break
            sleep 1
          done

          curl -fsS http://localhost:8080 > /dev/null || {
            cat /tmp/lege-lux-http.log
            exit 1
          }

          npx playwright test tests/smoke.spec.js --project=chromium

      - name: Commit app.js
        run: |
          if git diff --quiet -- app.js; then
            echo 'app.js already contains the requested changes.'
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -F - <<'EOF'
          perf(auth): defer Firebase until after reader startup

          Construct the reader without loading Firebase, restore Auth after the
          reading interface is revealed, and initialize Database and App Check
          only for authenticated synchronization or interactive account actions.

          Refs #253
          EOF
          git push origin exp
