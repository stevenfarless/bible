name: Phase 11 LCP Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: phase-11-lcp-diagnostics-exp
  cancel-in-progress: false

jobs:
  phase-11:
    name: Apply Phase 11 LCP diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exp
        uses: actions/checkout@v6
        with:
          ref: exp
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Apply Phase 11 diagnostics
        run: python3 .github/scripts/phase11_lcp_diagnostics.py

      - name: Validate Phase 11 changes
        run: |
          git diff --check
          grep -q '_recordPassagePaintDiagnostics(source)' app.js
          grep -q 'passageHtmlInserted:' app.js
          grep -q '=== LCP diagnostics ===' app.js
          grep -q 'first paragraph second frame' app.js
          grep -q 'fonts status at passage ready' app.js

          UNEXPECTED="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev '^(app.js)$' || true)"
          test -z "$UNEXPECTED" || {
            echo "Unexpected changed files:"
            echo "$UNEXPECTED"
            exit 1
          }

      - name: Install dependencies
        run: |
          npm install --package-lock=false
          npm install --no-save --package-lock=false @playwright/test esbuild firebase marked
          npx playwright install chromium --with-deps

      - name: Run unit tests
        run: npm test

      - name: Run Chromium tests
        env:
          BASE_URL: http://localhost:8080
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          python3 -m http.server 8080 > /tmp/lege-lux-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 10); do
            curl -fsS http://localhost:8080 > /dev/null && break
            sleep 1
          done

          curl -fsS http://localhost:8080 > /dev/null || {
            cat /tmp/lege-lux-http.log
            exit 1
          }

          npx playwright test tests/smoke.spec.js tests/auth-settings-race.spec.js --project=chromium

      - name: Run offline build audit
        run: node scripts/prepare-offline-build.mjs

      - name: Commit Phase 11
        run: |
          if git diff --quiet -- app.js; then
            echo "No Phase 11 changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -F - <<'EOF'
          chore(debug): add LCP passage render diagnostics

          Record passage HTML insertion, passage-ready timing, first paragraph
          layout timing, and font readiness so LCP render delay can be diagnosed
          from the in-app debug report before making another performance patch.
          EOF
          git push origin exp

      - name: Dispatch GitHub Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESPONSE_FILE="$(mktemp)"
          STATUS="$({
            curl -sS \
              -o "$RESPONSE_FILE" \
              -w '%{http_code}' \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-gh-pages.yml/dispatches" \
              -d '{"ref":"exp"}'
          })"

          if [ "$STATUS" != "204" ]; then
            echo "Deploy to GitHub Pages workflow dispatch failed with HTTP $STATUS."
            cat "$RESPONSE_FILE"
            exit 1
          fi

          echo "Deploy to GitHub Pages dispatched for exp."
