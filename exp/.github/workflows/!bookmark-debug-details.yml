name: "! Bookmark Debug Details"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bookmark-debug-details-exp
  cancel-in-progress: false

jobs:
  bookmark-debug-details:
    name: Add bookmark debug details
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exp
        uses: actions/checkout@v7
        with:
          ref: exp
          fetch-depth: 0

      - name: Apply bookmark debug detail change
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -B -m py_compile .github/scripts/bookmark_debug_details.py
          python3 -B .github/scripts/bookmark_debug_details.py
          python3 -B .github/scripts/bookmark_debug_details.py
          rm -rf .github/scripts/__pycache__

      - name: Validate bookmark debug detail change
        run: |
          grep -q 'const activeItems = items.filter((item) => item && item.deleted !== true);' app.js
          grep -q 'formatBookmark(item, "active")' app.js
          grep -q 'formatBookmark(item, "deleted")' app.js
          grep -q 'color=${color}' app.js
          node --check app.js
          git diff --check

      - name: Verify changed files
        run: |
          allowed='^app\.js$'
          unexpected="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"
          test -z "$unexpected" || {
            echo "Unexpected changed files:"
            echo "$unexpected"
            exit 1
          }

      - name: Commit bookmark debug detail change
        run: |
          files=(app.js)
          if [ -z "$(git status --porcelain -- "${files[@]}")" ]; then
            echo "Bookmark debug details are already applied."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit \
            -m "fix(debug): show bookmark details in debug log" \
            -m "Expand the bookmarksV1 debug entry to include each active or deleted bookmark reference, color, and updated timestamp so bookmark state can be inspected from copied logs."
          git push origin exp
