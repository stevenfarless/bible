name: "! Expand Android Haptics"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: expand-android-haptics-exp
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exp
        uses: actions/checkout@v6
        with:
          ref: exp
          fetch-depth: 0

      - name: Apply Android haptics expansion
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_name, old, new):
              path = Path(path_name)
              text = path.read_text(encoding='utf-8')
              if new in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one replacement anchor in {path_name}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('haptics.js').write_text('\n'.join([
              'const LIGHT_CLICK_MS = 12;',
              'const FIRM_PATTERN = [30, 20, 30];',
              '',
              'const debugState = {',
              '    lastAttempt: null,',
              '};',
              '',
              'function supported() {',
              "    return typeof navigator.vibrate === 'function';",
              '}',
              '',
              'function enabled(app) {',
              '    return app?.state?.hapticsEnabled !== false;',
              '}',
              '',
              'function record(kind, pattern, result, reason = null) {',
              '    debugState.lastAttempt = {',
              '        at: Date.now(),',
              '        kind,',
              '        pattern,',
              '        result,',
              '        reason,',
              '    };',
              '}',
              '',
              'function vibrate(app, kind, pattern) {',
              '    if (!enabled(app)) {',
              "        record(kind, pattern, false, 'disabled');",
              '        return false;',
              '    }',
              '',
              '    if (!supported()) {',
              "        record(kind, pattern, false, 'unsupported');",
              '        return false;',
              '    }',
              '',
              '    const result = navigator.vibrate(pattern);',
              '    record(kind, pattern, result, result ? null : \'rejected\');',
              '    return result;',
              '}',
              '',
              'export function hapticLight(app) {',
              "    return vibrate(app, 'light', LIGHT_CLICK_MS);",
              '}',
              '',
              'export function hapticFirm(app) {',
              "    return vibrate(app, 'firm', FIRM_PATTERN);",
              '}',
              '',
              'export function supportsHaptics() {',
              '    return supported();',
              '}',
              '',
              'export function getHapticsDebugState(app) {',
              '    return {',
              '        supported: supported(),',
              '        enabled: enabled(app),',
              '        lastAttempt: debugState.lastAttempt,',
              '    };',
              '}',
              '',
              'export function attachButtonHaptics(app) {',
              "    document.addEventListener('click', (event) => {",
              "        const control = event.target.closest('button, [role=\"button\"], input[type=\"checkbox\"], input[type=\"radio\"]');",
              '        if (!control || control.disabled) return;',
              "        if (control.closest('[data-no-haptics]')) return;",
              "        if (control.id === 'hapticsToggle' && !control.checked) return;",
              '        hapticLight(app);',
              '    });',
              '}',
              '',
          ]), encoding='utf-8')

          replace_once(
              'settings.js',
              "    const hapticsSetting = document.getElementById('hapticsSetting');\n    if (hapticsSetting) hapticsSetting.hidden = typeof navigator.vibrate !== 'function';\n",
              "    const hapticsSetting = document.getElementById('hapticsSetting');\n    if (hapticsSetting) hapticsSetting.hidden = false;\n",
          )

          replace_once(
              'events.js',
              "import { hapticFirm } from './haptics.js';\n",
              "import { attachButtonHaptics, hapticFirm } from './haptics.js';\n",
          )

          replace_once(
              'events.js',
              "    normalizeModalMarkup();\n    installCanonFallback(app);\n",
              "    normalizeModalMarkup();\n    installCanonFallback(app);\n    attachButtonHaptics(app);\n",
          )

          replace_once(
              'app.js',
              "import { hapticFirm } from './haptics.js';\n",
              "import { getHapticsDebugState, hapticFirm } from './haptics.js';\n",
          )

          replace_once(
              'app.js',
              "    const swController = navigator.serviceWorker?.controller?.scriptURL ?? 'none';\n",
              "    const swController = navigator.serviceWorker?.controller?.scriptURL ?? 'none';\n    const hapticsDebug = getHapticsDebugState(app);\n",
          )

          replace_once(
              'app.js',
              "        `  serviceWorker controller: ${swController}`,\n",
              "        `  serviceWorker controller: ${swController}`,\n        `  hapticsSupported: ${hapticsDebug.supported}`,\n        `  hapticsEnabled: ${hapticsDebug.enabled}`,\n        `  hapticsLastAttempt: ${hapticsDebug.lastAttempt ? JSON.stringify(hapticsDebug.lastAttempt) : '(none)'}`,\n",
          )

          replace_once(
              'app.js',
              "        `  showChapterArrows: ${app?.state?.showChapterArrows}`,\n",
              "        `  showChapterArrows: ${app?.state?.showChapterArrows}`,\n        `  hapticsEnabled: ${app?.state?.hapticsEnabled}`,\n",
          )
          PY

      - name: Validate source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          required = {
              'haptics.js': [
                  'export function attachButtonHaptics(app)',
                  'export function getHapticsDebugState(app)',
                  "record(kind, pattern, false, 'unsupported')",
                  "record(kind, pattern, false, 'disabled')",
                  "control.id === 'hapticsToggle'",
              ],
              'settings.js': [
                  'if (hapticsSetting) hapticsSetting.hidden = false;',
              ],
              'events.js': [
                  "import { attachButtonHaptics, hapticFirm } from './haptics.js';",
                  'attachButtonHaptics(app);',
              ],
              'app.js': [
                  "import { getHapticsDebugState, hapticFirm } from './haptics.js';",
                  'const hapticsDebug = getHapticsDebugState(app);',
                  'hapticsSupported:',
                  'hapticsLastAttempt:',
              ],
          }

          for path_name, snippets in required.items():
              text = Path(path_name).read_text(encoding='utf-8')
              for snippet in snippets:
                  assert snippet in text, f'Missing from {path_name}: {snippet}'

          for path in Path('.').glob('*.js'):
              if path.name == 'haptics.js':
                  continue
              text = path.read_text(encoding='utf-8')
              assert 'navigator.vibrate(' not in text, f'Direct vibrate call in {path}'
              assert 'navigator.vibrate?.(' not in text, f'Direct optional vibrate call in {path}'
          PY

          node --check haptics.js
          node --check settings.js
          node --check events.js
          node --check app.js
          git diff --check

      - name: Verify changed files
        run: |
          allowed='^(haptics\.js|settings\.js|events\.js|app\.js)$'
          unexpected="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"
          test -z "$unexpected" || { echo "$unexpected"; exit 1; }

      - name: Commit Android haptics expansion
        run: |
          files=(haptics.js settings.js events.js app.js)

          if [ -z "$(git status --porcelain -- "${files[@]}")" ]; then
            echo "Android haptics expansion is already implemented"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -F - <<'EOF'
          feat(haptics): expand Android feedback and diagnostics

          Add light haptic feedback to ordinary actionable controls, keep the
          haptics setting visible for troubleshooting, and record vibration
          support, enabled state, and the latest attempt in the debug report.
          EOF
          git push origin exp
