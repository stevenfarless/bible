name: "! 434"

on:
  push:
    branches:
      - exp
    paths:
      - ".github/workflows/! 434.yml"
  workflow_dispatch:

jobs:
  patch:
    name: Implement issue 434
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout exp
        uses: actions/checkout@v7
        with:
          ref: exp
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch book load cache behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('bible-api.js')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  """                        this._bookCache.set(cacheKey, null);\n                        return null;""",
                  """                        this._bookCache.delete(cacheKey);\n                        return null;""",
              ),
              (
                  """                    console.error(`BibleApi: failed to load ${translation}/${this._sanitizeForLog(book)}`, err);\n                    this._bookCache.set(cacheKey, null);\n                    return null;""",
                  """                    console.error(`BibleApi: failed to load ${translation}/${this._sanitizeForLog(book)}`, err);\n                    this._bookCache.delete(cacheKey);\n                    return null;""",
              ),
              (
                  """            this._bookCache.set(cacheKey, bookData);\n            return bookData;""",
                  """            if (bookData !== null) {\n                this._bookCache.set(cacheKey, bookData);\n            } else {\n                this._bookCache.delete(cacheKey);\n            }\n            return bookData;""",
              ),
              (
                  """            console.error(`BibleApi: failed to load ${translation}/${book} from RTDB`, err);\n            this._bookCache.set(cacheKey, null);\n            return null;""",
                  """            console.error(`BibleApi: failed to load ${translation}/${book} from RTDB`, err);\n            this._bookCache.delete(cacheKey);\n            return null;""",
              ),
          ]

          for old, new in replacements:
              if old not in text and new not in text:
                  raise SystemExit(f'Missing expected bible-api.js anchor:\n{old}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Add retry regression tests
        run: |
          cat > tests/unit/bible-api-book-cache.test.js <<'EOF'
          import { afterEach, beforeEach, describe, expect, it, vi } from 'vitest';

          const translationStore = vi.hoisted(() => ({
              idbGetBook: vi.fn(),
              idbPutBook: vi.fn(),
              idbGetSearchIndex: vi.fn(),
              idbPutSearchIndex: vi.fn(),
              idbIsDownloaded: vi.fn(),
              idbMarkDownloaded: vi.fn(),
              idbDeleteTranslation: vi.fn(),
          }));

          vi.mock('../../translation-store.js', () => translationStore);

          import { BibleApi } from '../../bible-api.js';
          import { idbGetBook } from '../../translation-store.js';

          const originalFetch = globalThis.fetch;
          const genesisData = {
              Genesis: {
                  '1': {
                      '1': 'In the beginning',
                  },
              },
          };

          describe('BibleApi book-load cache misses', () => {
              beforeEach(() => {
                  vi.clearAllMocks();
                  idbGetBook.mockReset();
                  vi.spyOn(console, 'error').mockImplementation(() => {});
              });

              afterEach(() => {
                  vi.restoreAllMocks();
                  globalThis.fetch = originalFetch;
              });

              it('retries a non-precached local book after an IndexedDB miss', async () => {
                  const api = new BibleApi('ASV');
                  idbGetBook
                      .mockResolvedValueOnce(null)
                      .mockResolvedValueOnce(genesisData);

                  const first = await api._loadBook('ASV', 'Genesis');
                  const second = await api._loadBook('ASV', 'Genesis');

                  expect(first).toBeNull();
                  expect(second).toBe(genesisData);
                  expect(idbGetBook).toHaveBeenCalledTimes(2);
                  expect(api._bookCache.get('ASV/Genesis')).toBe(genesisData);
              });

              it('retries a precached local book after a failed network load', async () => {
                  const api = new BibleApi('KJV');
                  const fetchMock = vi
                      .fn()
                      .mockRejectedValueOnce(new Error('offline'))
                      .mockResolvedValueOnce({
                          ok: true,
                          json: async () => genesisData,
                      });
                  globalThis.fetch = fetchMock;

                  const first = await api._loadBook('KJV', 'Genesis');
                  const second = await api._loadBook('KJV', 'Genesis');

                  expect(first).toBeNull();
                  expect(second).toBe(genesisData);
                  expect(fetchMock).toHaveBeenCalledTimes(2);
                  expect(api._bookCache.get('KJV/Genesis')).toBe(genesisData);
              });
          });
          EOF

      - name: Validate changed JavaScript
        run: |
          node --check bible-api.js
          node --check tests/unit/bible-api-book-cache.test.js
          npm install --no-package-lock --no-audit --no-fund
          npm test -- --run tests/unit/bible-api-book-cache.test.js tests/unit/bible-api-search.test.js
          rm -f package-lock.json

      - name: Remove one-shot workflow
        run: |
          rm -f ".github/workflows/! 434.yml"

      - name: Commit issue 434 fix
        run: |
          git config user.name "stevenfarless"
          git config user.email "125781365+stevenfarless@users.noreply.github.com"
          git add bible-api.js tests/unit/bible-api-book-cache.test.js ".github/workflows/! 434.yml"
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix(storage): avoid caching null book loads" \
            -m "Delete failed or missing book loads from the in-memory cache so later calls can retry IndexedDB or network reads. Add regression coverage for an IndexedDB miss and a failed precached fetch followed by a successful retry.\n\nFixes #434"
          git push origin HEAD:exp
