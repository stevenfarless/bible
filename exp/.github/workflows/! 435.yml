name: "! 435"

on:
  push:
    branches:
      - exp
    paths:
      - ".github/workflows/! 435.yml"
  workflow_dispatch:

jobs:
  patch:
    name: Implement issue 435
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout exp
        uses: actions/checkout@v7
        with:
          ref: exp
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add background failure diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path

          patches = [
              (
                  Path('bible-api.js'),
                  """                    idbPutSearchIndex(translation, index).catch(() => { });""",
                  """                    idbPutSearchIndex(translation, index).catch((error) => {\n                        console.warn(`BibleApi: failed to persist search index for ${translation}`, error);\n                    });""",
              ),
              (
                  Path('app.js'),
                  """            this.bibleApi._loadBook(t, book)\n                .catch(() => { })\n                .finally(() => setTimeout(next, 300));""",
                  """            this.bibleApi._loadBook(t, book)\n                .catch((error) => {\n                    const message = `prefetch failed: ${t}/${book}`;\n                    console.warn(message, error);\n                    this._dbgEvent(`${message} — ${error?.message || error}`);\n                })\n                .finally(() => setTimeout(next, 300));""",
              ),
              (
                  Path('app.js'),
                  """                this.bibleApi._loadBook(translation, book).catch(() => { });""",
                  """                this.bibleApi._loadBook(translation, book).catch((error) => {\n                    const message = `prefetch adjacent failed: ${translation}/${book}`;\n                    console.warn(message, error);\n                    this._dbgEvent(`${message} — ${error?.message || error}`);\n                });""",
              ),
              (
                  Path('app.js'),
                  """                .catch(() => { });""",
                  """                .catch((error) => {\n                    console.warn(`BibleApp: failed to load ${startingTranslation} meta.json`, error);\n                    this._dbgEvent(`meta load failed: ${startingTranslation} — ${error?.message || error}`);\n                });""",
              ),
          ]

          for path, old, new in patches:
              text = path.read_text(encoding='utf-8')
              if old not in text and new not in text:
                  raise SystemExit(f'Missing expected anchor in {path}:\n{old}')
              text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate changed JavaScript
        run: |
          node --check bible-api.js
          node --check app.js
          npm install --no-package-lock --no-audit --no-fund
          npm test -- --run tests/unit/bible-api-book-cache.test.js tests/unit/bible-api-search.test.js
          rm -f package-lock.json

      - name: Remove one-shot workflow
        run: |
          rm -f ".github/workflows/! 435.yml"

      - name: Commit issue 435 fix
        run: |
          git config user.name "stevenfarless"
          git config user.email "125781365+stevenfarless@users.noreply.github.com"
          git add bible-api.js app.js ".github/workflows/! 435.yml"
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(debug): add background failure diagnostics" \
            -m "Replace swallowed background catches for search-index persistence, book prefetch, adjacent-book prefetch, and startup meta loading with low-noise console/debug diagnostics. Keep user-facing behavior unchanged while making failure reports easier to inspect.\n\nRefs #435"
          git push origin HEAD:exp
