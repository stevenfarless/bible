name: Assign Unmilestoned Issues

on:
  workflow_dispatch:
  push:
    branches:
      - exp
    paths:
      - .github/workflows/assign-unmilestoned-issues.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: assign-unmilestoned-issues
  cancel-in-progress: false

jobs:
  assign-milestones:
    name: Assign open issues to matching milestones
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: exp

      - name: Assign milestones
        uses: actions/github-script@v8
        with:
          script: |
            const { execFileSync } = require('node:child_process');

            execFileSync(
              'python3',
              ['.github/scripts/assign_unmilestoned_issues.py'],
              {
                stdio: 'inherit',
                env: {
                  ...process.env,
                  GITHUB_TOKEN: github.token,
                },
              }
            );
