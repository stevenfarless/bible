name: Separate Book Filters From Scroll

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  separate-book-filters:
    name: Separate book filters from scrollable content
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: exp
          fetch-depth: 0

      - name: Apply structural layout fix
        run: python3 .github/scripts/separate_book_filters_from_scroll.py

      - name: Verify changes
        run: |
          node --check modals.js
          node --check tests/smoke.spec.js
          git diff --check
          grep -F 'id="bookTestamentFilters"' index.html
          grep -F "const filterBar = app.bookModal?.querySelector('.book-testament-filters');" modals.js
          grep -F "#bookModal .modal-content > .book-testament-filters" tests/smoke.spec.js
          grep -F "top: 0;" css/components.css
          if grep -Fq -- "--book-filter-row-height" css/components.css; then
            echo "Old sticky offset variable still present"
            exit 1
          fi
          if grep -Fq "modalBody.appendChild(filterBar)" modals.js; then
            echo "Filter bar is still appended inside the scrollable body"
            exit 1
          fi
          git diff -- index.html modals.js css/components.css tests/smoke.spec.js

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html modals.js css/components.css tests/smoke.spec.js
          git commit -m "fix: separate book filters from scrollable content"
          git pull --rebase origin exp
          git push origin exp
