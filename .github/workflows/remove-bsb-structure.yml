name: Remove bsb structure directory

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-dir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: json-ver
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove bsb structure directory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -r --ignore-unmatch 'bsb structure/'
          git diff --cached --quiet || git commit -m "chore: remove orphaned bsb structure/ directory from repo root"
          git push
