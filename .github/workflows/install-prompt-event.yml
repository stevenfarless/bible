name: "! install prompt event"

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: install-prompt-event-exp
  cancel-in-progress: false

jobs:
  install-prompt-event:
    name: Apply install prompt event patch
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exp
        uses: actions/checkout@v7
        with:
          ref: exp
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Apply install prompt event patch
        run: python3 .github/scripts/install_prompt_event_patch.py

      - name: Validate install prompt event patch
        run: |
          git diff --check
          node --check app.js
          node --check install-prompt.js

          grep -q "const installPromptModulePromise = import('./install-prompt.js')" app.js
          grep -q "void installPromptModulePromise" app.js
          grep -q "module.initInstallPrompt(this);" app.js

          if grep -q "void import('./install-prompt.js')" app.js; then
            echo "Old late install prompt import remains in app.js."
            exit 1
          fi

          grep -q "function handleBeforeInstallPrompt(event)" install-prompt.js
          grep -q "window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);" install-prompt.js
          grep -q "if (initialized) schedulePrompt();" install-prompt.js
          grep -q "if (hasInstallPath() || isIosSafari()) schedulePrompt();" install-prompt.js

          BEFOREINSTALLPROMPT_COUNT="$(grep -c "window.addEventListener('beforeinstallprompt'" install-prompt.js)"
          if [ "$BEFOREINSTALLPROMPT_COUNT" != "1" ]; then
            echo "Expected exactly one beforeinstallprompt listener registration, found $BEFOREINSTALLPROMPT_COUNT."
            exit 1
          fi

          UNEXPECTED="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev '^(app.js|install-prompt.js)$' || true)"
          test -z "$UNEXPECTED" || {
            echo "Unexpected changed files:"
            echo "$UNEXPECTED"
            exit 1
          }

      - name: Install offline audit dependencies
        run: npm install --no-save --package-lock=false esbuild firebase

      - name: Run offline build audit
        run: node scripts/prepare-offline-build.mjs

      - name: Commit install prompt event patch
        run: |
          if git diff --quiet -- app.js install-prompt.js; then
            echo "No install prompt event changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js install-prompt.js
          git commit \
            -m "fix(pwa): register install prompt event earlier" \
            -m "Start loading the install prompt module during app startup and register the browser install event listener at module load time so fast cache-hit sessions do not miss Edge's beforeinstallprompt event." \
            -m "Keep the visible custom install prompt delayed until the reader startup path has finished."
          git push origin exp

      - name: Dispatch GitHub Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESPONSE_FILE="$(mktemp)"
          STATUS="$({
            curl -sS \
              -o "$RESPONSE_FILE" \
              -w '%{http_code}' \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-gh-pages.yml/dispatches" \
              -d '{"ref":"exp"}'
          })"

          if [ "$STATUS" != "204" ]; then
            echo "Deploy to GitHub Pages workflow dispatch failed with HTTP $STATUS."
            cat "$RESPONSE_FILE"
            exit 1
          fi

          echo "Deploy to GitHub Pages dispatched for exp."
