name: Scottish Psalter Finalize

on:
  workflow_dispatch:
  push:
    branches: [exp]
    paths:
      - .github/workflows/scottish-psalter.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exp
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: exp

      - name: Wire Psalter integration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact anchor, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "events.js",
              'import { initSwipe } from "./swipe.js";\n',
              'import { initSwipe } from "./swipe.js";\nimport { installPsalmTranslations } from "./psalm-translations.js";\n',
          )
          replace_once(
              "events.js",
              "  installCanonFallback(app);\n  attachButtonHaptics(app);",
              "  installCanonFallback(app);\n  installPsalmTranslations(app);\n  attachButtonHaptics(app);",
          )
          replace_once(
              "sw.js",
              "  './translation-store.js',\n",
              "  './translation-store.js',\n  './psalm-translations.js',\n",
          )
          replace_once(
              "psalm-translations.js",
              'const SCOTTISH_PSALTER_LABEL = "Scottish 1650";',
              'const SCOTTISH_PSALTER_LABEL = "MP1650";',
          )
          replace_once(
              "psalm-translations.js",
              'heading.textContent = "Psalms for Singing";',
              'heading.textContent = "Metrical Psalters";',
          )
          PY

      - name: Generate pinned Psalter data
        run: |
          python3 scripts/import_scottish_psalter.py
          mkdir -p /tmp/mp1650-check
          python3 scripts/import_scottish_psalter.py \
            --output /tmp/mp1650-check/Psalm.json \
            --source-metadata /tmp/mp1650-check/source.json
          cmp special-psalms/MP1650/Psalm.json /tmp/mp1650-check/Psalm.json
          cmp special-psalms/MP1650/source.json /tmp/mp1650-check/source.json

      - name: Validate implementation
        run: |
          node --check psalm-translations.js
          node --check events.js
          node --check sw.js
          python3 -m py_compile scripts/import_scottish_psalter.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("special-psalms/MP1650/Psalm.json").read_text(encoding="utf-8"))
          assert set(map(int, data)) == set(range(1, 151))
          assert data["1"]["1"].startswith("That man hath perfect blessedness,")
          assert data["23"]["1"].startswith("The Lord's my shepherd")
          assert "\n" in data["23"]["2"]
          assert data["100"]["1"].startswith("All people that on earth do dwell")
          assert data["150"]
          PY
          git diff --check

      - name: Restore validation workflow
        run: git show HEAD^:.github/workflows/scottish-psalter.yml > .github/workflows/scottish-psalter.yml

      - name: Verify change scope
        run: |
          python3 - <<'PY'
          import subprocess

          expected = {
              ".github/workflows/scottish-psalter.yml",
              "events.js",
              "psalm-translations.js",
              "special-psalms/MP1650/Psalm.json",
              "special-psalms/MP1650/source.json",
              "sw.js",
          }
          lines = subprocess.check_output(
              ["git", "status", "--porcelain", "--untracked-files=all"],
              text=True,
          ).splitlines()
          changed = {line[3:] for line in lines if line}
          unexpected = changed - expected
          if unexpected:
              raise SystemExit(f"Unexpected changed files: {sorted(unexpected)}")
          missing = {"events.js", "psalm-translations.js", "special-psalms/MP1650/Psalm.json", "special-psalms/MP1650/source.json", "sw.js"} - changed
          if missing:
              raise SystemExit(f"Expected changes missing: {sorted(missing)}")
          PY

      - name: Commit completed feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/scottish-psalter.yml \
            events.js \
            psalm-translations.js \
            special-psalms/MP1650/Psalm.json \
            special-psalms/MP1650/source.json \
            sw.js
          git commit \
            -m "feat(psalms): add Scottish Metrical Psalter" \
            -m "Add the generated Scottish Psalter corpus and wire the Psalms-only translation override into the reader and offline app shell. Preserve the normal Bible translation outside Psalms while supporting explicit offline installation and metrical line breaks."
          git push origin HEAD:exp
