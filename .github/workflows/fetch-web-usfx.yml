name: Fetch WEB Translation (USFX)

on:
  workflow_dispatch:

jobs:
  fetch-web:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout script from dev
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-scripts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch, convert, and push WEB translation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_REF_NAME: main-book-update
        run: python dev-scripts/.github/scripts/fetch_web_usfx.py
