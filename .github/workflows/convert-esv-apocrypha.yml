name: Convert ESV Apocrypha EPUB

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main-book-update
        uses: actions/checkout@v6
        with:
          ref: main-book-update
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout script from dev
        uses: actions/checkout@v6
        with:
          ref: dev
          path: dev-scripts
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install beautifulsoup4 lxml

      - name: Convert EPUB to per-book JSON
        run: python dev-scripts/.github/scripts/convert_esv_apocrypha.py

      - name: Commit results
        run: |
          git config user.name "stevenfarless"
          git config user.email "125781365+stevenfarless@users.noreply.github.com"
          git add translations/ESV/
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "feat(esv): add apocrypha books from epub conversion"
            git push
          fi
