name: Cleanup gh-pages on branch delete

on:
  delete:
    branches:
      - '**'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Remove deleted branch folder
        run: |
          DEST="${{ github.event.ref }}"
          DEST="${DEST//\//-}"
          if [ -d "$DEST" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -rf "$DEST"
            git commit -m "chore(gh-pages): remove preview for deleted branch $DEST"
            git push
          else
            echo "No preview folder found for $DEST, nothing to do."
          fi
