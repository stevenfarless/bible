name: Upload Translations to Firebase

on:
  workflow_dispatch:
    inputs:
      translation:
        description: 'Translation to upload (e.g. ESV, KJV) — leave blank to upload all'
        required: false
        default: ''

jobs:
  upload:
    name: Upload to Firebase Realtime Database
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main-book-update
        uses: actions/checkout@v4
        with:
          ref: main-book-update
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout script from dev
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-scripts
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install firebase-admin

      - name: Write service account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/service_account.json

      - name: Upload translations
        env:
          TARGET_TRANSLATION: ${{ github.event.inputs.translation }}
        run: python dev-scripts/.github/scripts/upload_translations.py

      - name: Clean up key
        if: always()
        run: rm -f /tmp/service_account.json
