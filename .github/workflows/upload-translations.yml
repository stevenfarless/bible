name: Upload Translations to Firebase

on:
  workflow_dispatch:
    inputs:
      translation:
        description: 'Translation to upload (e.g. ESV, KJV) — leave blank to upload all'
        required: false
        default: ''
      branch:
        description: 'Branch to read translations from'
        required: false
        default: 'exp'

jobs:
  upload:
    name: Upload to Firebase Realtime Database
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'exp' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install firebase-admin

      - name: Write service account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/service_account.json

      - name: Upload translations
        env:
          TARGET_TRANSLATION: ${{ github.event.inputs.translation }}
        run: |
          python - <<'EOF'
          import os, json, glob, sys
          import firebase_admin
          from firebase_admin import credentials, db

          cred = credentials.Certificate("/tmp/service_account.json")
          firebase_admin.initialize_app(cred, {
              "databaseURL": "https://esv-bible-6dffb-default-rtdb.firebaseio.com"
          })

          target = os.environ.get("TARGET_TRANSLATION", "").strip().upper()

          # Per-book layout: translations/{ABBR}/{Book}.json
          # Skip structure subdirs (BSB_structure, WEB_structure) and meta/index files.
          trans_root = "translations"
          trans_dirs = sorted(
              d for d in os.listdir(trans_root)
              if os.path.isdir(os.path.join(trans_root, d))
          )

          if not trans_dirs:
              print("No translation directories found under translations/")
              sys.exit(1)

          uploaded = 0
          for abbr in trans_dirs:
              if target and abbr.upper() != target:
                  continue

              folder = os.path.join(trans_root, abbr)
              book_files = sorted(
                  f for f in os.listdir(folder)
                  if f.endswith(".json") and not f.endswith("_structure.json")
              )

              if not book_files:
                  print(f"  {abbr}: no book files found, skipping")
                  continue

              print(f"Uploading {abbr} ({len(book_files)} books)...")

              # Build full translation object {bookName: {chapterNum: {verseNum: text}}}
              translation_data = {}
              for fname in book_files:
                  book_name = fname[:-5]  # strip .json
                  # Skip known non-book files
                  if book_name in ("meta", "index", "search-index"):
                      continue
                  path = os.path.join(folder, fname)
                  with open(path, "r", encoding="utf-8-sig") as f:
                      translation_data[book_name] = json.load(f)

              # Also include meta if present
              meta_path = os.path.join(folder, "meta.json")
              if os.path.exists(meta_path):
                  with open(meta_path, "r", encoding="utf-8-sig") as f:
                      translation_data["meta"] = json.load(f)

              ref = db.reference(f"translations/{abbr}")
              ref.set(translation_data)
              print(f"  {abbr}: uploaded {len(translation_data)} nodes to Firebase.")
              uploaded += 1

          print(f"\nDone. {uploaded} translation(s) uploaded.")
          EOF

      - name: Clean up key
        if: always()
        run: rm -f /tmp/service_account.json
