name: Publish v2.2.0-dev4

on:
  push:
    branches: [exp]
    paths:
      - .github/workflows/publish-v2.2.0-dev4.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_DEV_SHA: 3b37906117303f0c49a91cc373c401890febbe5f
      RELEASE_ID: '345696732'
    steps:
      - name: Update dev4 tag and prerelease
        shell: bash
        run: |
          set -euo pipefail

          DEV_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/branches/dev" --jq '.commit.sha')"
          if [ "$DEV_SHA" != "$EXPECTED_DEV_SHA" ]; then
            echo "dev moved: expected $EXPECTED_DEV_SHA, found $DEV_SHA" >&2
            exit 1
          fi

          RELEASE_TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.tag_name')"
          if [ "$RELEASE_TAG" != "v2.2.0-dev4" ]; then
            echo "release ${RELEASE_ID} no longer targets v2.2.0-dev4" >&2
            exit 1
          fi

          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/v2.2.0-dev4" \
            -f sha="$EXPECTED_DEV_SHA" \
            -F force=true >/dev/null

          cat > /tmp/release.md <<'EOF'
          ## New in v2.2.0-dev4

          ### Scottish Metrical Psalter
          - Added the **Scottish Psalter (1650)**, a rhymed and metered version of all 150 Psalms designed for singing.
          - While reading Psalms, the Translation picker now includes a dedicated **Metrical Psalters** section.
          - The Psalter preserves its poetic line breaks and appears as **MP1650** when selected.
          - It downloads on first use so it remains available offline afterward.
          - Selecting the Psalter does not replace your normal Bible translation. Leaving Psalms automatically returns to your usual translation, and returning to Psalms restores the Psalter selection.

          ### Reading and navigation
          - Book, chapter, and verse selection now flows more naturally from one picker to the next.
          - The chapter picker includes **Go**, so you can open a chapter without having to choose a verse.
          - Verse-by-verse reading has improved left spacing and indentation for cleaner alignment.

          ### Speed, reliability, and polish
          - Continued startup work reduces unnecessary font, stylesheet, and formatting work before the reader is ready.
          - Cached-passage restoration and startup layout stability have been improved.
          - Repeat visits and offline use benefit from improved caching of versioned app assets.
          - Additional accessibility improvements, bug fixes, dependency updates, and performance refinements are included.

          ---

          ## v2.2.0-dev3 notes carried forward

          ## Coming soon
          ### Faster reading
          - Lege Lux opens to the Bible text faster.
          - Saved passages restore more quickly.
          - The first screen should feel steadier.
          - Repeat visits should feel smoother.

          ### Better place keeping
          - Your chapter and translation restore more reliably.
          - Switching translations should keep your place better.
          - New changes are less likely to be overwritten.

          ### Bookmarks
          - Added colored verse bookmarks.
          - Bookmarks can be red, green, or blue.
          - Bookmarked verses show ribbon markers.
          - Added a bookmarks sheet for saved verses.
          - Signed-in bookmarks can sync across devices.

          ### Better search
          - Search is easier to use on phones.
          - Search should feel faster.
          - Results fit the screen better.
          - Matching sections open automatically.
          - Results scroll without moving the passage.
          - Matches are more accurate and easier to see.
          - Partial word matches work more reliably.

          ### Better controls
          - Chapter swipes recover more cleanly.
          - Verse tools respond more reliably.
          - Verse tool labels are clearer.
          - Verse copy and share actions now work.
          - Added a verse selection gesture setting.
          - Escape can clear the selected verse.
          - The reference picker Go button works better.
          - Picker buttons behave better on iPhone.

          ### Appearance updates
          - Added Light, Dark, and System buttons.
          - Added Aa− and Aa+ font size controls.
          - Added the Luna Lux theme.
          - Added a new pink theme.
          - Heavy theme files load only when needed.

          ### Install prompt
          - Added a smarter install prompt.
          - The prompt waits until reading is ready.
          - Supported browsers can install normally.
          - iPhone and iPad users get Home Screen steps.
          - Dismissed prompts stay hidden for a while.

          ### Reading options
          - Added fullscreen reading while scrolling.
          - Added optional Android vibration feedback.
          - Added a setting for vibration feedback.

          ### About and diagnostics
          - Added Source Code links for GitHub and GitLab.
          - Version details are easier to match with reports.
          - Debug reports include more useful app details.
          - Debug reports now include bookmark details.

          ### Known limitations
          - The tool drawer may not behave consistently in all situations.
          - Vibration feedback is not yet available on iOS.

          ### Fixes and performance
          - Improved startup speed.
          - Improved offline reliability.
          - Improved saved setting reliability.
          - Improved font loading.
          - Fixed theme generation issues.
          - Fixed several smaller bugs.

          **Full Changelog**: https://github.com/stevenfarless/lege-lux/compare/v2.2.0-dev1...v2.2.0-dev4
          EOF

          python3 - <<'PY'
          import json
          from pathlib import Path

          body = Path('/tmp/release.md').read_text(encoding='utf-8')
          payload = {
              'tag_name': 'v2.2.0-dev4',
              'target_commitish': 'dev',
              'name': 'v2.2.0-dev4',
              'body': body,
              'draft': False,
              'prerelease': True,
          }
          Path('/tmp/release.json').write_text(json.dumps(payload), encoding='utf-8')
          PY

          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            --input /tmp/release.json >/dev/null

          TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v2.2.0-dev4" --jq '.object.sha')"
          RELEASE_NAME="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.name')"
          RELEASE_PRERELEASE="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.prerelease')"

          test "$TAG_SHA" = "$EXPECTED_DEV_SHA"
          test "$RELEASE_NAME" = "v2.2.0-dev4"
          test "$RELEASE_PRERELEASE" = "true"
