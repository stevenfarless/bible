name: Add Settings Sheet Snap Points

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-settings-sheet:
    name: Patch settings bottom sheet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: exp
          fetch-depth: 0

      - name: Patch settings sheet
        run: python3 .github/scripts/add_settings_sheet_snap_points.py

      - name: Verify changes
        run: |
          git diff --check
          git diff -- css/modals.css bottom-sheet-drag.js

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/modals.css bottom-sheet-drag.js
          git commit -m "feat: add snap positions to settings bottom sheet"
          git push origin exp
