name: "! install prompt"

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: install-prompt-exp
  cancel-in-progress: false

jobs:
  install-prompt:
    name: Apply smart install prompt
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exp
        uses: actions/checkout@v7
        with:
          ref: exp
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Apply install prompt implementation
        run: python3 .github/scripts/install_prompt.py

      - name: Validate install prompt changes
        run: |
          git diff --check

          grep -q 'id="installPrompt"' index.html
          grep -q 'id="installPromptInstall"' index.html
          grep -q 'id="iosInstallSteps"' index.html

          if grep -q 'id="installBanner"' index.html; then
            echo "Old install banner markup is still present."
            exit 1
          fi

          grep -q '/\* PWA install prompt \*/' css/components.css
          grep -q '.install-prompt__sheet' css/components.css

          if grep -q 'install-banner' css/components.css; then
            echo "Old install banner CSS is still present."
            exit 1
          fi

          grep -q "import('./install-prompt.js')" app.js
          grep -q "'./install-prompt.js'," sw.js
          grep -q "export function initInstallPrompt" install-prompt.js
          grep -q "beforeinstallprompt" install-prompt.js
          grep -q "appinstalled" install-prompt.js
          grep -q "'**/tests/install-prompt.spec.js'" playwright.config.js
          test -f tests/install-prompt.spec.js

          if grep -q 'INSTALL_PROMPT_DISMISSED_KEY' app.js; then
            echo "Old app.js install prompt implementation is still present."
            exit 1
          fi

          UNEXPECTED="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev '^(index.html|css/components.css|app.js|sw.js|playwright.config.js|install-prompt.js|tests/install-prompt.spec.js)$' || true)"
          test -z "$UNEXPECTED" || {
            echo "Unexpected changed files:"
            echo "$UNEXPECTED"
            exit 1
          }

      - name: Install dependencies
        run: |
          npm install --package-lock=false
          npm install --no-save --package-lock=false @playwright/test esbuild firebase marked
          npx playwright install chromium --with-deps

      - name: Run unit tests
        run: npm test

      - name: Run Chromium tests
        env:
          BASE_URL: http://localhost:8080
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          python3 -m http.server 8080 > /tmp/lege-lux-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 10); do
            curl -fsS http://localhost:8080 > /dev/null && break
            sleep 1
          done

          curl -fsS http://localhost:8080 > /dev/null || {
            cat /tmp/lege-lux-http.log
            exit 1
          }

          npx playwright test --project=chromium

      - name: Run offline build audit
        run: node scripts/prepare-offline-build.mjs

      - name: Commit install prompt implementation
        run: |
          if git diff --quiet -- index.html css/components.css app.js sw.js playwright.config.js install-prompt.js tests/install-prompt.spec.js; then
            echo "No install prompt changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css/components.css app.js sw.js playwright.config.js install-prompt.js tests/install-prompt.spec.js
          cat > /tmp/install-prompt-commit-message <<'EOF'
          feat(pwa): add smart install prompt

          Replace the eager install banner with a delayed bottom-sheet prompt that
          appears only when Lege Lux is not already installed, waits until the
          reader is available, respects dismissal cooldowns, uses the Chromium
          beforeinstallprompt flow when available, and shows iOS Add to Home
          Screen instructions on Safari.

          Add browser coverage for repeat-visit gating, install acceptance,
          dismissal cooldowns, standalone suppression, and the iOS instruction path.

          Refs #415
          EOF
          git commit -F /tmp/install-prompt-commit-message
          git push origin exp

      - name: Dispatch GitHub Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESPONSE_FILE="$(mktemp)"
          STATUS="$({
            curl -sS \
              -o "$RESPONSE_FILE" \
              -w '%{http_code}' \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-gh-pages.yml/dispatches" \
              -d '{"ref":"exp"}'
          })"

          if [ "$STATUS" != "204" ]; then
            echo "Deploy to GitHub Pages workflow dispatch failed with HTTP $STATUS."
            cat "$RESPONSE_FILE"
            exit 1
          fi

          echo "Deploy to GitHub Pages dispatched for exp."
