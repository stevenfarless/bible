name: Sync Translations Between Branches

on:
  workflow_dispatch:
    inputs:
      branch_a:
        description: 'First branch'
        required: true
        type: string
      branch_b:
        description: 'Second branch'
        required: true
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout branch_a (full history)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch_a }}
          fetch-depth: 0

      - name: Fetch branch_b
        run: git fetch origin ${{ github.event.inputs.branch_b }}

      - name: Copy translations missing from branch_a (present in branch_b)
        id: a_from_b
        run: |
          B="origin/${{ github.event.inputs.branch_b }}"
          SOURCE_LIST=$(git ls-tree --name-only "$B" translations/)
          TARGET_LIST=$(ls translations/)
          MISSING=$(comm -23 <(echo "$SOURCE_LIST" | sort) <(echo "$TARGET_LIST" | sort))
          if [ -z "$MISSING" ]; then
            echo "branch_a already has all translations from branch_b."
          else
            for T in $MISSING; do
              NAME=$(basename "$T")
              echo "Adding $NAME to ${{ github.event.inputs.branch_a }}"
              git checkout "$B" -- "translations/$NAME"
            done
          fi
          echo "added=$MISSING" >> "$GITHUB_OUTPUT"

      - name: Commit to branch_a
        run: |
          git config user.name  "stevenfarless"
          git config user.email "125781365+stevenfarless@users.noreply.github.com"
          git add translations/
          if git diff --cached --quiet; then
            echo "Nothing to commit to ${{ github.event.inputs.branch_a }}."
          else
            git commit -m "chore: sync missing translations from ${{ github.event.inputs.branch_b }} into ${{ github.event.inputs.branch_a }}"
            git push origin HEAD:${{ github.event.inputs.branch_a }}
          fi

      - name: Checkout branch_b
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch_b }}
          fetch-depth: 0

      - name: Fetch branch_a
        run: git fetch origin ${{ github.event.inputs.branch_a }}

      - name: Copy translations missing from branch_b (present in branch_a)
        id: b_from_a
        run: |
          A="origin/${{ github.event.inputs.branch_a }}"
          SOURCE_LIST=$(git ls-tree --name-only "$A" translations/)
          TARGET_LIST=$(ls translations/)
          MISSING=$(comm -23 <(echo "$SOURCE_LIST" | sort) <(echo "$TARGET_LIST" | sort))
          if [ -z "$MISSING" ]; then
            echo "branch_b already has all translations from branch_a."
          else
            for T in $MISSING; do
              NAME=$(basename "$T")
              echo "Adding $NAME to ${{ github.event.inputs.branch_b }}"
              git checkout "$A" -- "translations/$NAME"
            done
          fi
          echo "added=$MISSING" >> "$GITHUB_OUTPUT"

      - name: Commit to branch_b
        run: |
          git config user.name  "stevenfarless"
          git config user.email "125781365+stevenfarless@users.noreply.github.com"
          git add translations/
          if git diff --cached --quiet; then
            echo "Nothing to commit to ${{ github.event.inputs.branch_b }}."
          else
            git commit -m "chore: sync missing translations from ${{ github.event.inputs.branch_a }} into ${{ github.event.inputs.branch_b }}"
            git push origin HEAD:${{ github.event.inputs.branch_b }}
          fi
