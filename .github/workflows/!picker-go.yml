name: "! picker go"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: picker-go-exp
  cancel-in-progress: false

jobs:
  picker-go:
    name: Move picker Go action
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exp
        uses: actions/checkout@v7
        with:
          ref: exp
          fetch-depth: 0

      - name: Apply picker Go change
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -B -m py_compile .github/scripts/picker_go.py
          python3 -B .github/scripts/picker_go.py
          python3 -B .github/scripts/picker_go.py
          rm -rf .github/scripts/__pycache__

      - name: Validate picker Go change
        run: |
          grep -q "picker-actions picker-actions--top" modals.js
          grep -q "goButton.textContent = 'Go';" modals.js
          grep -q 'view.appendChild(actions);' modals.js
          grep -q 'view.appendChild(grid);' modals.js
          ! grep -q "goButton.textContent = 'Go to chapter';" modals.js
          ! grep -q 'picker-actions--footer' modals.js
          grep -q '.picker-actions--top' css/modals.css
          grep -q 'position: sticky;' css/modals.css
          grep -q 'top: 0;' css/modals.css
          grep -q 'background-color: var(--bg-card);' css/modals.css
          ! grep -q '.picker-actions--footer' css/modals.css
          node --check modals.js
          git diff --check

      - name: Verify changed files
        run: |
          allowed='^(css/modals\.css|modals\.js)$'
          unexpected="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"
          test -z "$unexpected" || {
            echo "Unexpected changed files:"
            echo "$unexpected"
            exit 1
          }

      - name: Commit picker Go change
        run: |
          files=(modals.js css/modals.css)
          if [ -z "$(git status --porcelain -- "${files[@]}")" ]; then
            echo "Picker Go action is already moved."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit \
            -m "fix(picker): move chapter go action to the top" \
            -m "Rename the chapter picker action to Go, move it above the chapter grid, and make the action row sticky so it remains reachable while scrolling."
          git push origin exp
