name: Fix Structure Scaffold

on:
  push:
    branches:
      - exp
    paths:
      - '.github/workflows/fix-structure-scaffold.yml'

permissions:
  contents: write

jobs:
  fix:
    name: Restore passage scaffolding
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exp
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: exp
          fetch-depth: 0

      - name: Apply scaffold fix
        run: python scripts/fix-scaffold.py

      - name: Validate scaffold fix
        shell: bash
        run: |
          node --check bible-api.js
          node --check bsb-structure.js
          git diff --check
          grep -Fq '.map((v) => /^\d+$/.test(v) ? Number(v) : v)' bible-api.js
          if grep -Fq "translation === 'BST'" bsb-structure.js; then
            echo 'BST scaffold guard is still present'
            exit 1
          fi

      - name: Remove one-time files
        run: rm scripts/fix-scaffold.py .github/workflows/fix-structure-scaffold.yml

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "stevenfarless"
          git config user.email "125781365+stevenfarless@users.noreply.github.com"
          git add bible-api.js bsb-structure.js scripts/fix-scaffold.py .github/workflows/fix-structure-scaffold.yml
          git commit -m "fix(reader): restore translation scaffolding" -m "Keep ordinary numeric verse IDs numeric inside passage layout while preserving lettered LXX verse labels, and allow BST to use the existing BSB/WEB structure scaffold."
          git push origin exp
