name: Remove Phase 11 Diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - exp
    paths:
      - .github/workflows/remove-phase-11-diagnostics.yml
      - .github/scripts/remove_phase11_diagnostics.py

permissions:
  contents: write
  actions: write

concurrency:
  group: remove-phase-11-diagnostics-exp
  cancel-in-progress: false

jobs:
  cleanup:
    name: Remove Phase 11 diagnostics and deploy Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exp
        uses: actions/checkout@v6
        with:
          ref: exp
          fetch-depth: 0

      - name: Remove Phase 11 diagnostics
        run: |
          python3 .github/scripts/remove_phase11_diagnostics.py
          rm -f .github/workflows/apply-phase-11-lcp-diagnostics.yml
          rm -f .github/scripts/phase11_lcp_diagnostics.py
          rm -f .github/scripts/remove_phase11_diagnostics.py
          rm -f .github/workflows/remove-phase-11-diagnostics.yml

      - name: Validate cleanup
        run: |
          git diff --check
          ! grep -q '_recordPassagePaintDiagnostics' app.js
          ! grep -q 'passageHtmlInserted:' app.js
          ! grep -q '=== LCP diagnostics ===' app.js
          ! grep -q 't_passage_html_inserted' app.js
          ! grep -q 'firstParaRect_' app.js
          ! grep -q 'fontsStatusAtPassageReady' app.js
          test ! -f .github/workflows/apply-phase-11-lcp-diagnostics.yml
          test ! -f .github/scripts/phase11_lcp_diagnostics.py
          test ! -f .github/scripts/remove_phase11_diagnostics.py
          test ! -f .github/workflows/remove-phase-11-diagnostics.yml

      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo "No Phase 11 diagnostics cleanup changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -F - <<'EOF'
          chore(debug): remove Phase 11 LCP diagnostics

          Remove the temporary LCP passage render diagnostics from app.js and
          delete the Phase 11 diagnostic workflow and helper scripts after the
          investigation confirmed the passage render path is healthy.
          EOF
          git push origin exp

      - name: Dispatch GitHub Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESPONSE_FILE="$(mktemp)"
          STATUS="$({
            curl -sS \
              -o "$RESPONSE_FILE" \
              -w '%{http_code}' \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-gh-pages.yml/dispatches" \
              -d '{"ref":"exp"}'
          })"

          if [ "$STATUS" != "204" ]; then
            echo "Deploy to GitHub Pages workflow dispatch failed with HTTP $STATUS."
            cat "$RESPONSE_FILE"
            exit 1
          fi

          echo "Deploy to GitHub Pages dispatched for exp."
