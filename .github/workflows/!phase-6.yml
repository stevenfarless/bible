name: "! Phase 6"

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: issue-393-phase-6-exp
  cancel-in-progress: false

jobs:
  fix:
    name: Extend static asset cache handling and deploy Pages
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exp
        uses: actions/checkout@v6
        with:
          ref: exp
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Apply Phase 6 service-worker cache update
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('sw.js')
          text = path.read_text()

          if 'function isLongLivedStaticAsset(url)' not in text:
              text = text.replace(
                  "const APP_SHELL_PATTERN = /\\.(js|mjs|css)$/;",
                  "const APP_SHELL_PATTERN = /\\.(js|mjs|css)$/;\nconst LONG_LIVED_STATIC_PATTERN = /\\.(js|mjs|css|woff2?|png|ico|webmanifest)$/;"
              )
              text = text.replace(
                  "function isFirebaseCacheable(url) {",
                  "function isLongLivedStaticAsset(url) {\n  if (url.origin !== self.location.origin) return false;\n  if (!LONG_LIVED_STATIC_PATTERN.test(url.pathname)) return false;\n  if (url.pathname.endsWith('/index.html')) return false;\n  return url.searchParams.has('v') || url.pathname.includes('/fonts/');\n}\n\nfunction withLongLivedStaticHeaders(response) {\n  const headers = new Headers(response.headers);\n  headers.set('Cache-Control', 'public, max-age=31536000, immutable');\n  return new Response(response.body, {\n    status: response.status,\n    statusText: response.statusText,\n    headers,\n  });\n}\n\nfunction isFirebaseCacheable(url) {"
              )
              text = text.replace(
                  "          if (response.ok) {\n            const clone = response.clone();\n            caches.open(CACHE_NAME).then((cache) => {\n              cache.put(event.request, clone);\n            });\n          }\n          return response;",
                  "          if (response.ok) {\n            const cacheResponse = isLongLivedStaticAsset(url)\n              ? withLongLivedStaticHeaders(response.clone())\n              : response.clone();\n            caches.open(CACHE_NAME).then((cache) => {\n              cache.put(event.request, cacheResponse);\n            });\n          }\n          return response;"
              )
              text = text.replace(
                  "        return cached || networkFetch;",
                  "        if (cached) return cached;\n        return networkFetch.then((response) => {\n          if (response && isLongLivedStaticAsset(url)) {\n            return withLongLivedStaticHeaders(response.clone());\n          }\n          return response;\n        });"
              )
          else:
              print('Phase 6 service-worker cache update is already present.')

          path.write_text(text)
          PY

      - name: Validate changed files
        run: |
          node --check sw.js
          git diff --check

          grep -q 'function isLongLivedStaticAsset(url)' sw.js
          grep -q 'max-age=31536000, immutable' sw.js
          grep -q "url.searchParams.has('v') || url.pathname.includes('/fonts/')" sw.js
          grep -q "url.pathname.endsWith('/index.html')" sw.js
          grep -q "fetch(new Request(event.request, { cache: 'no-store' }))" sw.js

          if grep -q "url.pathname.includes('/translations/')" sw.js; then
            echo "Long-lived static cache handling must not target Bible JSON translations."
            exit 1
          fi

          UNEXPECTED="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev '^(sw.js)$' || true)"
          test -z "$UNEXPECTED" || {
            echo "Unexpected changed files:"
            echo "$UNEXPECTED"
            exit 1
          }

      - name: Install dependencies
        run: |
          npm install --package-lock=false
          npm install --no-save --package-lock=false @playwright/test esbuild firebase marked
          npx playwright install chromium --with-deps

      - name: Run unit tests
        run: npm test

      - name: Run Chromium tests
        env:
          BASE_URL: http://localhost:8080
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          python3 -m http.server 8080 > /tmp/lege-lux-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 10); do
            curl -fsS http://localhost:8080 > /dev/null && break
            sleep 1
          done

          curl -fsS http://localhost:8080 > /dev/null || {
            cat /tmp/lege-lux-http.log
            exit 1
          }

          npx playwright test tests/smoke.spec.js tests/auth-settings-race.spec.js --project=chromium

      - name: Run offline build audit
        run: node scripts/prepare-offline-build.mjs

      - name: Commit Phase 6
        run: |
          FILES=(
            sw.js
          )

          if git diff --quiet -- "${FILES[@]}"; then
            echo "No Phase 6 changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "${FILES[@]}"
            git commit -F - <<'EOF'
          perf: extend cache lifetime for versioned assets

          Store versioned static assets and local fonts with long-lived immutable
          response headers in the service-worker cache while keeping HTML and
          translation JSON outside the long-cache path.

          Refs #393
          EOF
            git push origin exp
          fi

      - name: Dispatch GitHub Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESPONSE_FILE="$(mktemp)"
          STATUS="$({
            curl -sS \
              -o "$RESPONSE_FILE" \
              -w '%{http_code}' \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-gh-pages.yml/dispatches" \
              -d '{"ref":"exp"}'
          })"

          if [ "$STATUS" != "204" ]; then
            echo "Deploy to GitHub Pages workflow dispatch failed with HTTP $STATUS."
            cat "$RESPONSE_FILE"
            exit 1
          fi

          echo "Deploy to GitHub Pages workflow dispatched for exp."
