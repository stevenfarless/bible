name: Deploy to GitHub Pages

on:
  push:
    branches:
      - '**'

concurrency:
  group: gh-pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install test and build dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false \
            @playwright/test@1.52.0 \
            esbuild@0.25.5 \
            marked@9.1.6

      - name: Derive destination directory
        id: dest
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            DEST="${GITHUB_REF_NAME//\//-}"
            echo "dir=$DEST" >> "$GITHUB_OUTPUT"
          fi

      - name: Inject build info
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          SHA7="${GITHUB_SHA::7}"
          if [ "${BRANCH}" = "main" ]; then
            sed -i "s|__BUILD_INFO__||g" index.html
            sed -i "s|__BUILD_COLOR__|#444444|g" css/pericope.css
          else
            case "${BRANCH}" in
              dev)  BUILD_COLOR="#09752b" ;;
              exp)  BUILD_COLOR="#790606" ;;
              *)    BUILD_COLOR="#444444" ;;
            esac
            echo "Injecting: $SHA7"
            sed -i "s|__BUILD_INFO__|${SHA7}|g" index.html
            sed -i "s|__BUILD_COLOR__|${BUILD_COLOR}|g" css/pericope.css
          fi
          sed -i "s/__BUILD_ID__/${SHA7}/g" sw.js index.html
          sed -i "s|\(<script[^>]* src=\"\)\([^?\"]*\)\(\.js\)\(\"\\\)|\1\2\3?v=${SHA7}\4|g" index.html
          sed -i "s|\(<link[^>]* href=\"css/[^?\"]*\)\(\.css\)\(\"\)|\1\2?v=${SHA7}\3|g" index.html
          echo "${GITHUB_SHA}" > version.txt

      - name: Inject Firebase config
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        run: |
          for f in config/firebase-config.js config/firebase-config.bundle.js; do
            sed -i "s|__FIREBASE_API_KEY__|${FIREBASE_API_KEY}|g" "$f"
            sed -i "s|__FIREBASE_APP_ID__|${FIREBASE_APP_ID}|g" "$f"
            sed -i "s|__FIREBASE_MESSAGING_SENDER_ID__|${FIREBASE_MESSAGING_SENDER_ID}|g" "$f"
          done

      - name: Run unit tests
        if: github.ref_name == 'exp'
        run: npm test

      - name: Prepare offline-first site
        env:
          INITIAL_OFFLINE_TRANSLATIONS: KJV,BSB
        run: node scripts/prepare-offline-build.mjs

      - name: Install Chromium
        if: github.ref_name == 'exp'
        run: npx playwright install chromium --with-deps

      - name: Start built site
        if: github.ref_name == 'exp'
        run: |
          python3 -m http.server 8080 --directory _site > /tmp/lege-lux-http.log 2>&1 &
          echo $! > /tmp/lege-lux-http.pid
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8080/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/lege-lux-http.log
          exit 1

      - name: Run built-site smoke tests
        if: github.ref_name == 'exp'
        env:
          BASE_URL: http://127.0.0.1:8080
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: npx playwright test --project=chromium

      - name: Verify cold offline startup
        if: github.ref_name == 'exp'
        env:
          BASE_URL: http://127.0.0.1:8080
        run: npx playwright test --config=playwright.offline.config.js --project=chromium

      - name: Upload test reports
        if: failure() && github.ref_name == 'exp'
        uses: actions/upload-artifact@v7
        with:
          name: exp-deployment-test-reports
          path: |
            playwright-report/
            test-results/
            offline-test-results/
            /tmp/lege-lux-http.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          destination_dir: ${{ steps.dest.outputs.dir }}
          keep_files: true
          force_orphan: false
          enable_jekyll: false
