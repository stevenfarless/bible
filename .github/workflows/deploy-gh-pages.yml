name: Deploy feat/unit-tests-89 to GitHub Pages

permissions:
  contents: write
  pages: write
  id-token: write

on:
  push:
    branches:
      - feat/unit-tests-89

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Inject BUILD_ID
        run: |
          echo "Injecting BUILD_ID: $GITHUB_SHA"
          sed -i "s/__BUILD_ID__/$GITHUB_SHA/g" sw.js
          sed -i "s/__BUILD_ID__/$GITHUB_SHA/g" index.html

      - name: Deploy to GitHub Pages (feat/unit-tests-89)
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./
          destination_dir: feat/unit-tests-89
          keep_files: true
