name: Deploy main to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # Stamps branch, run number, and SHA into the build-info badge
      - name: Inject build info
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          BUILD="${GITHUB_RUN_NUMBER}"
          SHA="${GITHUB_SHA::7}"
          # On main the badge CSS hides itself (data-branch=main),
          # but we still stamp it so the HTML is consistent
          INFO="${BRANCH} #${BUILD} · ${SHA}"
          echo "Injecting: $INFO"
          sed -i "s|__BUILD_INFO__|${INFO}|g" index.html
          # Set data-branch attr so CSS can hide it on main
          sed -i 's|id="build-info"|id="build-info" data-branch="main"|g' index.html
          sed -i "s/__BUILD_ID__/$GITHUB_SHA/g" sw.js index.html

      - name: Deploy to GitHub Pages (main)
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./
          destination_dir: .
          keep_files: true
