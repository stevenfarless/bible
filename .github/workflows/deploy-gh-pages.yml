name: Deploy to GitHub Pages

on:
  push:
    branches:
      - '**'
      - '!main'

concurrency:
  group: gh-pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Derive destination directory
        id: dest
        run: |
          # Replace every / with - so branch names like refactor/split-app-js
          # become a valid directory slug: refactor-split-app-js
          DEST="${GITHUB_REF_NAME//\//-}"
          echo "dir=$DEST" >> "$GITHUB_OUTPUT"

      - name: Inject build info
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          BUILD="${GITHUB_RUN_NUMBER}"
          SHA="${GITHUB_SHA::7}"
          INFO="${BRANCH} #${BUILD} · ${SHA}"
          echo "Injecting: $INFO"
          sed -i "s|__BUILD_INFO__|${INFO}|g" index.html
          sed -i "s/__BUILD_ID__/$GITHUB_SHA/g" sw.js index.html
          sed -i "s|\(<script[^>]* src=\"\)\([^?\"]*\)\(\.js\)\(\"\)|\1\2\3?v=${GITHUB_SHA}\4|g" index.html
          echo "$GITHUB_SHA" > version.txt

      - name: Inject Firebase config
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        run: |
          for f in config/firebase-config.js config/firebase-config.bundle.js; do
            sed -i "s|__FIREBASE_API_KEY__|${FIREBASE_API_KEY}|g" "$f"
            sed -i "s|__FIREBASE_APP_ID__|${FIREBASE_APP_ID}|g" "$f"
            sed -i "s|__FIREBASE_MESSAGING_SENDER_ID__|${FIREBASE_MESSAGING_SENDER_ID}|g" "$f"
          done

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./
          destination_dir: ${{ steps.dest.outputs.dir }}
          keep_files: true
          force_orphan: false
          enable_jekyll: false
