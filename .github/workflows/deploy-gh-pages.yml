name: Deploy to GitHub Pages

on:
  push:
    branches:
      - '**'
      - '!main'

concurrency:
  group: gh-pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Derive destination directory
        id: dest
        run: |
          # Replace every / with - so branch names like refactor/split-app-js
          # become a valid directory slug: refactor-split-app-js
          DEST="${GITHUB_REF_NAME//\//-}"
          echo "dir=$DEST" >> "$GITHUB_OUTPUT"

      - name: Inject build info
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          BUILD="${GITHUB_RUN_NUMBER}"
          SHA="${GITHUB_SHA::7}"
          INFO="${BRANCH} #${BUILD} · ${SHA}"
          echo "Injecting: $INFO"
          sed -i "s|__BUILD_INFO__|${INFO}|g" index.html
          sed -i "s/__BUILD_ID__/$GITHUB_SHA/g" sw.js index.html
          sed -i "s|\(<script[^>]* src=\"\)\([^?\"]*\)\(\.js\)\(\"\\)|\1\2\3?v=${GITHUB_SHA}\4|g" index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./
          destination_dir: ${{ steps.dest.outputs.dir }}
          keep_files: true
          force_orphan: false
          enable_jekyll: false
