name: "! Lock UI"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lock-ui-exp
  cancel-in-progress: false

jobs:
  implement:
    name: Apply issue 401 interface visibility setting
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exp
        uses: actions/checkout@v6
        with:
          ref: exp
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Validate patch script
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path

          path = Path('.github/scripts/implement-lock-ui.py')
          ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          PY

      - name: Apply issue 401 implementation
        run: |
          python3 .github/scripts/implement-lock-ui.py
          python3 .github/scripts/implement-lock-ui.py

      - name: Validate implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          required = {
              'reading-state.js': ['hideInterfaceOnScroll: true,'],
              'index.html': ['id="hideInterfaceOnScrollToggle"', 'Hide interface while scrolling'],
              'ui.js': ["'hideInterfaceOnScrollToggle'", "app.hideInterfaceOnScrollToggle = document.getElementById('hideInterfaceOnScrollToggle');"],
              'settings.js': ['hideInterfaceOnScroll: true,', "readBool('hideInterfaceOnScroll'", "hideInterfaceOnScroll: 'hideInterfaceOnScrollToggle'", "setting === 'hideInterfaceOnScroll'"],
              'events.js': ["app.hideInterfaceOnScrollToggle?.addEventListener('change', () => app.toggleSetting('hideInterfaceOnScroll'));"],
              'app.js': ["'hideInterfaceOnScroll'", 'if (!this.state.hideInterfaceOnScroll)', 'hideInterfaceOnScroll: this.state.hideInterfaceOnScroll,', '`  hideInterfaceOnScroll: ${app?.state?.hideInterfaceOnScroll}`'],
              'auth.js': ['hideInterfaceOnScroll: app.state.hideInterfaceOnScroll,', "applySetting('hideInterfaceOnScroll', s.hideInterfaceOnScroll);"],
          }

          for path_name, snippets in required.items():
              text = Path(path_name).read_text(encoding='utf-8')
              for snippet in snippets:
                  if snippet not in text:
                      raise SystemExit(f'Missing from {path_name}: {snippet}')

          app = Path('app.js').read_text(encoding='utf-8')
          init_start = app.find('    async init() {')
          listener = app.find('            attachEventListeners(this);', init_start)
          local = app.find('            this.loadLocalSettings();', init_start)
          if init_start < 0 or listener < 0 or local < 0 or not local < listener:
              raise SystemExit('app.js: loadLocalSettings must run before attachEventListeners in init')
          PY

          node --check app.js
          node --check auth.js
          node --check events.js
          node --check reading-state.js
          node --check settings.js
          node --check ui.js
          git diff --check

          allowed='^(reading-state\.js|index\.html|ui\.js|settings\.js|events\.js|app\.js|auth\.js)$'
          unexpected="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"
          test -z "$unexpected" || {
            echo "Unexpected changed files:"
            echo "$unexpected"
            exit 1
          }

      - name: Install dependencies
        run: npm install --package-lock=false

      - name: Run unit tests
        run: npm test

      - name: Commit issue 401 implementation
        run: |
          files=(
            reading-state.js
            index.html
            ui.js
            settings.js
            events.js
            app.js
            auth.js
          )

          if [ -z "$(git status --porcelain -- "${files[@]}")" ]; then
            echo "Issue 401 is already implemented."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -F - <<'EOF'
          feat: add interface auto-hide setting

          Add a persisted setting that controls whether the top interface hides
          during scrolling. Restore the setting before scroll listeners are
          attached, apply changes immediately when toggled, and include the
          setting in account sync and debug diagnostics.

          Refs #401
          EOF
          git push origin exp
