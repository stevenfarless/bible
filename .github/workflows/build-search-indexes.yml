name: Build search indexes

on:
  push:
    branches: [exp]
    paths:
      - 'translations/**/*.json'
      - 'scripts/build-search-indexes.cjs'
  workflow_dispatch:
    inputs:
      translations:
        description: 'Space-separated translation IDs to rebuild (blank = all)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build search indexes
        run: node scripts/build-search-indexes.cjs ${{ github.event.inputs.translations }}

      - name: Commit updated indexes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add translations/**/*_search_index.json
          if git diff --cached --quiet; then
            echo "No index changes."
          else
            git commit -m "chore(indexes): regenerate search indexes [skip ci]"
            git pull --rebase
            git push
          fi
