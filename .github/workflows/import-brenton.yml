name: Import Brenton Septuagint

on:
  push:
    branches:
      - exp
    paths:
      - .github/workflows/import-brenton.yml
      - scripts/import-brenton.py
      - scripts/brenton-integration.py
  workflow_dispatch:

jobs:
  import:
    name: Import Brenton Septuagint
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout exp
        uses: actions/checkout@v7
        with:
          ref: exp
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare importer
        run: python scripts/brenton-integration.py prepare

      - name: Import public-domain Brenton text
        run: python scripts/import-brenton.py

      - name: Integrate Brenton with reader
        run: python scripts/brenton-integration.py finalize

      - name: Validate Brenton corpus and reader syntax
        run: python scripts/brenton-integration.py validate

      - name: Remove one-time integration files
        run: rm .github/workflows/import-brenton.yml scripts/brenton-integration.py

      - name: Commit Brenton translation
        run: |
          git config user.name "stevenfarless"
          git config user.email "125781365+stevenfarless@users.noreply.github.com"
          git add translations/BST translations/index.json bible-api.js bsb-structure.js app.js swipe.js search.js scripts/import-brenton.py scripts/brenton-integration.py .github/workflows/import-brenton.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat(translations): add Brenton Septuagint" \
            -m "Import the public-domain 1851 Brenton Septuagint from eBible USFM, preserve native LXX versification and lettered verses, add metadata and local search indexing, and register BST as an on-demand translation."
          git push origin HEAD:exp
