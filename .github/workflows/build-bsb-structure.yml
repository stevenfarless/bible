name: Build BSB Structure Scaffold

on:
  workflow_dispatch:
  push:
    branches:
      - json-ver
    paths:
      - 'scripts/build-structure.js'
      - '.github/workflows/build-bsb-structure.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout json-ver
        uses: actions/checkout@v4
        with:
          ref: json-ver
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download HelloAOLab USFM source
        run: |
          curl -L https://api.github.com/repos/BereanBible/HelloAOLab/tarball -o /tmp/HelloAOLab.tar.gz
          mkdir -p /tmp/HelloAOLab
          tar -xzf /tmp/HelloAOLab.tar.gz --strip-components=1 -C /tmp/HelloAOLab
          # Show what's inside so we can confirm the USFM folder name
          ls /tmp/HelloAOLab/

      - name: Run build-structure.js
        run: |
          # Find the USFM directory — handles BSB_USFM or any variant
          USFM_DIR=$(find /tmp/HelloAOLab -maxdepth 2 -type d -iname '*usfm*' | head -1)
          echo "Using USFM dir: $USFM_DIR"
          node scripts/build-structure.js --usfm-dir "$USFM_DIR"

      - name: Commit and push scaffold JSONs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add translations/BSB/BSB_structure/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: regenerate BSB structure scaffold JSONs"
          git push origin json-ver
