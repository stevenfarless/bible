name: Build BSB Structure Scaffold

on:
  workflow_dispatch:
  push:
    branches:
      - json-ver
    paths:
      - 'scripts/build-structure.js'
      - '.github/workflows/build-bsb-structure.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout esv-bible (json-ver)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: json-ver
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Download BSB USFM zip
        run: |
          curl -L "https://bereanbible.com/bsb_usfm.zip" -o /tmp/BSB-USFM.zip
          echo "Downloaded $(wc -c < /tmp/BSB-USFM.zip) bytes"
          unzip -q /tmp/BSB-USFM.zip -d /tmp/BSB-USFM
          echo "Extracted contents:"
          ls /tmp/BSB-USFM/

      - name: Run build-structure.js
        run: |
          USFM_DIR=$(find /tmp/BSB-USFM -maxdepth 2 -name '*.usfm' | head -1 | xargs dirname)
          echo "Using USFM dir: $USFM_DIR"
          node scripts/build-structure.js --usfm-dir "$USFM_DIR"

      - name: Commit and push scaffold JSONs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add translations/BSB/BSB_structure/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: regenerate BSB structure scaffold JSONs"
          git push origin json-ver
