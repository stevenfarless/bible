name: Build BSB Structure Scaffold

on:
  workflow_dispatch:
  push:
    branches:
      - json-ver
    paths:
      - 'scripts/build-structure.js'
      - '.github/workflows/build-bsb-structure.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout esv-bible (json-ver)
        uses: actions/checkout@v4
        with:
          ref: json-ver
          token: ${{ secrets.GITHUB_TOKEN }}
          path: esv-bible

      - name: Checkout HelloAOLab (USFM source)
        uses: actions/checkout@v4
        with:
          repository: BereanBible/HelloAOLab
          path: HelloAOLab

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show USFM directory contents
        run: ls HelloAOLab/

      - name: Run build-structure.js
        run: |
          USFM_DIR=$(find HelloAOLab -maxdepth 2 -type d -iname '*usfm*' | head -1)
          echo "Using USFM dir: $USFM_DIR"
          node esv-bible/scripts/build-structure.js --usfm-dir "$USFM_DIR"
        working-directory: ${{ github.workspace }}

      - name: Commit and push scaffold JSONs
        working-directory: esv-bible
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add translations/BSB/BSB_structure/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: regenerate BSB structure scaffold JSONs"
          git push origin json-ver
