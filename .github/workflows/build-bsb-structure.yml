name: Build BSB Structure Scaffold

on:
  workflow_dispatch:
  push:
    branches:
      - json-ver
    paths:
      - 'scripts/build-structure.js'
      - '.github/workflows/build-bsb-structure.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout json-ver
        uses: actions/checkout@v4
        with:
          ref: json-ver
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download HelloAOLab USFM source
        run: |
          curl -L https://github.com/BereanBible/HelloAOLab/archive/refs/heads/master.zip -o /tmp/HelloAOLab.zip
          unzip -q /tmp/HelloAOLab.zip -d /tmp/
          # The zip extracts to HelloAOLab-master/
          echo "USFM_DIR=/tmp/HelloAOLab-master/BSB_USFM" >> $GITHUB_ENV

      - name: Run build-structure.js
        run: node scripts/build-structure.js --usfm-dir ${{ env.USFM_DIR }}

      - name: Commit and push scaffold JSONs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add translations/BSB/BSB_structure/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: regenerate BSB structure scaffold JSONs"
          git push origin json-ver
