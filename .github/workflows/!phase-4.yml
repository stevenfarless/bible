name: "! Phase 4"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue-389-phase-4-exp
  cancel-in-progress: false

jobs:
  fix:
    name: Use system monospace for visible startup UI
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exp
        uses: actions/checkout@v6
        with:
          ref: exp
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Apply reviewed patch
        run: |
          PATCH=.github/patches/issue-389-phase-4.patch

          if git apply --check --recount "$PATCH"; then
            git apply --recount "$PATCH"
          elif git apply --reverse --check --recount "$PATCH"; then
            echo "Phase 4 changes are already present."
          else
            echo "The affected files no longer match the reviewed Phase 4 patch."
            exit 1
          fi

      - name: Validate changed files
        run: |
          node --check sw.js
          node --check tests/smoke.spec.js
          git diff --check

          grep -q 'font-family: ui-monospace, SFMono-Regular' css/components.css
          grep -q 'font-family: ui-monospace, SFMono-Regular' css/pericope.css
          grep -q 'visible monospace UI avoids loading iA Writer Mono' tests/smoke.spec.js

          if grep -q "'iA Writer Mono S'" css/components.css; then
            echo "Visible navigation selectors still reference iA Writer Mono."
            exit 1
          fi

          if grep -q "#build-info[[:space:][:print:]]*'iA Writer Mono S'" css/pericope.css; then
            echo "The build badge still references the iA Writer Mono web font."
            exit 1
          fi

          if grep -q "'./fonts/iAWriterMonoS-Regular.woff'" sw.js; then
            echo "The service-worker app shell still precaches iA Writer Mono."
            exit 1
          fi

          test -f fonts/iAWriterMonoS-Regular.woff
          grep -q "font-family: 'iA Writer Mono S'" css/fonts.css

          UNEXPECTED="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev '^(css/components.css|css/pericope.css|sw.js|tests/smoke.spec.js)$' || true)"
          test -z "$UNEXPECTED" || {
            echo "Unexpected changed files:"
            echo "$UNEXPECTED"
            exit 1
          }

      - name: Install dependencies
        run: |
          npm install --package-lock=false
          npm install --no-save --package-lock=false @playwright/test esbuild firebase marked
          npx playwright install chromium --with-deps

      - name: Run unit tests
        run: npm test

      - name: Run Chromium tests
        env:
          BASE_URL: http://localhost:8080
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          python3 -m http.server 8080 > /tmp/lege-lux-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 10); do
            curl -fsS http://localhost:8080 > /dev/null && break
            sleep 1
          done

          curl -fsS http://localhost:8080 > /dev/null || {
            cat /tmp/lege-lux-http.log
            exit 1
          }

          npx playwright test tests/smoke.spec.js tests/auth-settings-race.spec.js --project=chromium

      - name: Run offline build audit
        run: node scripts/prepare-offline-build.mjs

      - name: Commit Phase 4
        run: |
          FILES=(
            css/components.css
            css/pericope.css
            sw.js
            tests/smoke.spec.js
          )

          if git diff --quiet -- "${FILES[@]}"; then
            echo "No Phase 4 changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${FILES[@]}"
          git commit -F - <<'EOF'
          perf(fonts): use system monospace for startup UI

          Avoid loading the iA Writer Mono web font during startup by using the
          device monospace stack for the build badge plus current chapter and
          verse selectors, and remove the unused font from app-shell precaching.

          Refs #389
          EOF
          git push origin exp
