name: Prepare Translations

on:
  workflow_dispatch:
    inputs:
      translation_id:
        description: 'Translation ID to process (leave blank for all)'
        required: false
        default: ''

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Run prepare-all
        run: node scripts/prepare-all.js ${{ inputs.translation_id }}

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add translations/
          git diff --cached --quiet || git commit -m "chore(translations): run prepare-all pipeline [skip ci]"
          git push
