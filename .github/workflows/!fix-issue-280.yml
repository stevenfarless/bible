name: "! fix issue 280"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fix-issue-280-exp
  cancel-in-progress: false

jobs:
  fix-service-worker:
    name: Fix issue 280 offline Firebase bundle cache
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exp
        uses: actions/checkout@v6
        with:
          ref: exp
          fetch-depth: 0

      - name: Apply issue 280 patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sw_path = Path('sw.js')
          text = sw_path.read_text(encoding='utf-8')

          bundle_entry = "  './config/firebase-config.bundle.js',"
          if bundle_entry not in text:
              anchor = "  './firebase-config.js',\n  './translations/index.json',"
              replacement = "  './firebase-config.js',\n" + bundle_entry + "\n  './translations/index.json',"
              if anchor not in text:
                  raise SystemExit('Expected APP_SHELL firebase-config.js anchor was not found.')
              text = text.replace(anchor, replacement, 1)

          old_match = "      caches.match(event.request).then((cached) => {\n        // Start background fetch to keep cache fresh"
          new_match = "      caches.match(event.request, { ignoreSearch: true }).then((cached) => {\n        // Start background fetch to keep cache fresh"
          if old_match in text:
              text = text.replace(old_match, new_match, 1)
          elif new_match not in text:
              raise SystemExit('Expected app-shell cache lookup was not found.')

          sw_path.write_text(text, encoding='utf-8')
          PY

      - name: Validate issue 280 patch
        run: |
          node --check sw.js
          git diff --check

          python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path('sw.js').read_text(encoding='utf-8')
          match = re.search(r'const APP_SHELL = \[(.*?)\];', text, re.S)
          if not match:
              raise SystemExit('APP_SHELL was not found.')

          app_shell = match.group(1)
          required_entries = [
              "'./firebase-config.js'",
              "'./config/firebase-config.bundle.js'",
          ]
          for entry in required_entries:
              if entry not in app_shell:
                  raise SystemExit(f'Missing APP_SHELL entry: {entry}')

          if "caches.match(event.request, { ignoreSearch: true }).then((cached) => {" not in text:
              raise SystemExit('App-shell cache lookup does not ignore query strings.')

          if "caches.match(event.request).then((cached) => {" in text:
              raise SystemExit('Obsolete exact app-shell cache lookup is still present.')
          PY

          unexpected="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev '^sw\.js$' || true)"
          test -z "$unexpected" || {
            echo "Unexpected changed files:"
            echo "$unexpected"
            exit 1
          }

      - name: Commit issue 280 fix branch
        id: commit_fix
        run: |
          if [ -z "$(git status --porcelain -- sw.js)" ]; then
            echo "Issue 280 is already fixed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch="fix/issue-280-offline-firebase-bundle-${GITHUB_RUN_ID}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add sw.js
          git commit -F - <<'EOF'
          fix(sw): cache Firebase auth bundle offline

          Add the Firebase Auth bundle to the service worker app shell and make
          app-shell cache lookups ignore build query strings. This lets an
          installed offline session resolve the cached bundle when app.js imports
          config/firebase-config.bundle.js with the current build ID.

          Keep the root firebase-config.js entry because bible-api.js still imports
          FIREBASE_DB_URL from it.

          Fixes #280
          EOF
          git push origin "$branch"

      - name: Open pull request
        if: steps.commit_fix.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_BRANCH: ${{ steps.commit_fix.outputs.branch }}
        run: |
          gh pr create \
            --base exp \
            --head "$ISSUE_BRANCH" \
            --title "fix(sw): cache Firebase auth bundle offline" \
            --body-file - <<'EOF'
          ## Summary

          - Add `./config/firebase-config.bundle.js` to the normal service worker app shell.
          - Keep `./firebase-config.js` because `bible-api.js` still imports `FIREBASE_DB_URL` from it.
          - Make app-shell cache lookups ignore build query strings so `?v=<buildId>` requests can resolve the cached bundle offline.

          ## Validation

          - `node --check sw.js`
          - `git diff --check`
          - Targeted workflow validation for the expected APP_SHELL entries and query-tolerant cache lookup

          Fixes #280
          EOF
