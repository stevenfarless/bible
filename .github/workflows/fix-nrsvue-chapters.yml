name: Fix NRSVUE Missing Chapters

on:
  workflow_dispatch:

jobs:
  fix-nrsvue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout json-ver
        uses: actions/checkout@v4.2.2
        with:
          ref: json-ver
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and patch NRSVUE chapters
        env:
          BG_USERNAME: ${{ secrets.BG_USERNAME }}
          BG_PASSWORD: ${{ secrets.BG_PASSWORD }}
        run: |
          python - <<'EOF'
          import json, re, time, requests, os, sys

          BG_API = "https://api.biblegateway.com/2"
          TRANSLATION = "NRSVUE"

          # Get access token
          username = os.environ["BG_USERNAME"]
          password = os.environ["BG_PASSWORD"]
          token_resp = requests.get(
              f"{BG_API}/request_access_token",
              params={"username": username, "password": password},
              timeout=15,
          )
          token_data = token_resp.json()
          if "error" in token_data:
              print(f"Auth error: {token_data['error']}")
              sys.exit(1)
          access_token = token_data["access_token"]
          print(f"Got access token (expires {token_data.get('expires')})")

          CHAPTERS_TO_FIX = [
              ("Matthew", "Matt",    17, [21]),
              ("Matthew", "Matt",    18, [11]),
              ("Matthew", "Matt",    23, [14]),
              ("Mark",    "Mark",    7,  [16]),
              ("Mark",    "Mark",    9,  [44, 46]),
              ("Mark",    "Mark",    11, [26]),
              ("Mark",    "Mark",    15, [28]),
              ("Luke",    "Luke",    17, [36]),
              ("Luke",    "Luke",    23, [17]),
              ("John",    "John",    5,  [4]),
              ("Acts",    "Acts",    8,  [37]),
              ("Acts",    "Acts",    15, [34]),
              ("Acts",    "Acts",    24, [7]),
              ("Acts",    "Acts",    28, [29]),
              ("Romans",  "Rom",     16, [24]),
          ]

          def fetch_chapter(osis, chapter):
              url = f"{BG_API}/bible/{osis}.{chapter}/{TRANSLATION}"
              r = requests.get(url, params={"access_token": access_token}, timeout=15)
              r.raise_for_status()
              return r.json()

          def parse_verses(data):
              """
              BG v2 returns: {"data": [{"verse_id": "Matt.17.1", "verse": [{"text": "..."}]}]}
              """
              verses = {}
              for item in data.get("data", []):
                  verse_id = item.get("verse_id", "")  # e.g. "Matt.17.1"
                  parts = verse_id.rsplit(".", 1)
                  if len(parts) != 2:
                      continue
                  v_num = parts[1]
                  # verse text is a list of text segments
                  segments = item.get("verse", [])
                  text = " ".join(s.get("text", "") for s in segments if isinstance(s, dict))
                  text = re.sub(r"\s+", " ", text).strip()
                  if text:
                      verses[v_num] = text
              return verses

          bible_path = "translations/NRSVUE/NRSVUE_bible.json"
          with open(bible_path, "r", encoding="utf-8") as f:
              bible = json.load(f)

          for book, osis, chapter, absent in CHAPTERS_TO_FIX:
              ch_str = str(chapter)
              print(f"Fetching {book} {chapter}...", flush=True)
              try:
                  data = fetch_chapter(osis, chapter)
              except Exception as e:
                  print(f"  ERROR: {e}")
                  continue

              if "error" in data:
                  print(f"  API error: {data['error']}")
                  continue

              fetched = parse_verses(data)

              if len(fetched) < 5:
                  print(f"  WARNING: only {len(fetched)} verses parsed — skipping")
                  print(f"  Raw response keys: {list(data.keys())}")
                  print(f"  First item: {data.get('data', [{}])[0] if data.get('data') else 'empty'}")
                  continue

              for v in absent:
                  fetched.pop(str(v), None)

              bible[book][ch_str] = fetched
              print(f"  Stored {len(fetched)} verses (absent: {absent})")
              time.sleep(0.3)

          with open(bible_path, "w", encoding="utf-8") as f:
              json.dump(bible, f, ensure_ascii=False, indent=2)

          print("Done.")
          EOF

      - name: Commit patched bible
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add translations/NRSVUE/NRSVUE_bible.json
          git diff --cached --quiet || git commit -m "fix(nrsvue): re-patch NT chapters via BibleGateway v2 API"
          git push
