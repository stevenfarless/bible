name: Fix NRSVUE Missing Chapters

on:
  workflow_dispatch:

jobs:
  fix-nrsvue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout json-ver
        uses: actions/checkout@v4.2.2
        with:
          ref: json-ver
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Fetch and patch NRSVUE chapters
        run: |
          python - <<'EOF'
          import json, re, time, requests
          from bs4 import BeautifulSoup

          TRANSLATION = "NRSVUE"
          BASE = "https://www.biblegateway.com/passage/"
          HEADERS = {"User-Agent": "Mozilla/5.0"}

          CHAPTERS_TO_FIX = [
              ("Matthew", "Matt",    17, [21]),
              ("Matthew", "Matt",    18, [11]),
              ("Matthew", "Matt",    23, [14]),
              ("Mark",    "Mark",    7,  [16]),
              ("Mark",    "Mark",    9,  [44, 46]),
              ("Mark",    "Mark",    11, [26]),
              ("Mark",    "Mark",    15, [28]),
              ("Luke",    "Luke",    17, [36]),
              ("Luke",    "Luke",    23, [17]),
              ("John",    "John",    5,  [4]),
              ("Acts",    "Acts",    8,  [37]),
              ("Acts",    "Acts",    15, [34]),
              ("Acts",    "Acts",    24, [7]),
              ("Acts",    "Acts",    28, [29]),
              ("Romans",  "Rom",     16, [24]),
          ]

          def fetch_chapter(osis, chapter):
              search = f"{osis} {chapter}"
              r = requests.get(BASE, params={"search": search, "version": TRANSLATION}, headers=HEADERS, timeout=15)
              r.raise_for_status()
              return r.text

          def parse_verses(html, osis, chapter):
              soup = BeautifulSoup(html, "lxml")
              verses = {}
              pattern = re.compile(rf"{osis}-{chapter}-(\d+)")
              for span in soup.find_all("span", class_=True):
                  classes = " ".join(span.get("class", []))
                  m = pattern.search(classes)
                  if not m:
                      continue
                  v_num = m.group(1)
                  if any(c in classes for c in ["chapternum", "footnote", "crossreference"]):
                      continue
                  text = span.get_text(" ", strip=True)
                  text = re.sub(r"^\d+\s*", "", text).strip()
                  if not text:
                      continue
                  if v_num in verses:
                      verses[v_num] += " " + text
                  else:
                      verses[v_num] = text
              return verses

          bible_path = "translations/NRSVUE/NRSVUE_bible.json"
          with open(bible_path, "r", encoding="utf-8") as f:
              bible = json.load(f)

          for book, osis, chapter, absent in CHAPTERS_TO_FIX:
              ch_str = str(chapter)
              print(f"Fetching {book} {chapter}...", flush=True)
              try:
                  html = fetch_chapter(osis, chapter)
              except Exception as e:
                  print(f"  ERROR: {e}")
                  continue

              fetched = parse_verses(html, osis, chapter)

              if len(fetched) < 5:
                  print(f"  WARNING: only {len(fetched)} verses parsed — skipping")
                  soup = BeautifulSoup(html, "lxml")
                  p = soup.find(class_="passage-text")
                  print(f"  HTML preview: {str(p)[:800] if p else 'no .passage-text found'}")
                  continue

              for v in absent:
                  fetched.pop(str(v), None)

              bible[book][ch_str] = fetched
              print(f"  Stored {len(fetched)} verses (absent: {absent})")
              time.sleep(1)

          with open(bible_path, "w", encoding="utf-8") as f:
              json.dump(bible, f, ensure_ascii=False, indent=2)

          print("Done.")
          EOF

      - name: Commit patched bible
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add translations/NRSVUE/NRSVUE_bible.json
          git diff --cached --quiet || git commit -m "fix(nrsvue): patch all truncated NT chapters via BibleGateway scrape"
          git push
