name: Fix NRSVUE Missing Chapters

on:
  workflow_dispatch:

jobs:
  fix-nrsvue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout json-ver
        uses: actions/checkout@v4.2.2
        with:
          ref: json-ver
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright beautifulsoup4 lxml
          python -m playwright install chromium --with-deps

      - name: Fetch and patch NRSVUE chapters
        run: |
          python - <<'EOF'
          import json, re, time
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright

          TRANSLATION = "NRSVUE"
          CHAPTERS_TO_FIX = [
              ("Matthew", "Matt",    17, [21]),
              ("Matthew", "Matt",    18, [11]),
              ("Matthew", "Matt",    23, [14]),
              ("Mark",    "Mark",    7,  [16]),
              ("Mark",    "Mark",    9,  [44, 46]),
              ("Mark",    "Mark",    11, [26]),
              ("Mark",    "Mark",    15, [28]),
              ("Luke",    "Luke",    17, [36]),
              ("Luke",    "Luke",    23, [17]),
              ("John",    "John",    5,  [4]),
              ("Acts",    "Acts",    8,  [37]),
              ("Acts",    "Acts",    15, [34]),
              ("Acts",    "Acts",    24, [7]),
              ("Acts",    "Acts",    28, [29]),
              ("Romans",  "Rom",     16, [24]),
          ]

          def parse_verses(html, osis, chapter):
              soup = BeautifulSoup(html, "lxml")

              # Remove all non-verse nodes before extraction
              for tag in soup.find_all(class_=re.compile(
                  r"footnote|crossreference|chapternum|versenum|"
                  r"heading|std-text-header|passage-display-bcv|full-chap-link"
              )):
                  tag.decompose()
              for tag in soup.find_all(["sup", "h1", "h2", "h3", "h4"]):
                  tag.decompose()

              verses = {}
              usfm_pattern = re.compile(rf"{osis}\.{chapter}\.(\d+)", re.IGNORECASE)
              for span in soup.find_all("span", attrs={"data-usfm": usfm_pattern}):
                  usfm = span.get("data-usfm", "")
                  m = usfm_pattern.search(usfm)
                  if not m:
                      continue
                  v_num = m.group(1)
                  text = re.sub(r"\s+", " ", span.get_text(" ", strip=True)).strip()
                  if not text:
                      continue
                  if v_num in verses:
                      verses[v_num] += " " + text
                  else:
                      verses[v_num] = text
              return verses

          bible_path = "translations/NRSVUE/NRSVUE_bible.json"
          with open(bible_path, "r", encoding="utf-8") as f:
              bible = json.load(f)

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(
                  user_agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                             "(KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
                  locale="en-US",
              )
              page = context.new_page()

              # Accept cookies on first load so the session cookie persists
              print("Loading BibleGateway to accept cookies...", flush=True)
              page.goto("https://www.biblegateway.com", wait_until="domcontentloaded", timeout=30000)
              time.sleep(2)
              # Dismiss cookie banner if present
              try:
                  page.click("button:has-text('Accept')", timeout=5000)
                  print("  Accepted cookie banner")
              except Exception:
                  print("  No cookie banner found")
              time.sleep(1)

              for book, osis, chapter, absent in CHAPTERS_TO_FIX:
                  ch_str = str(chapter)
                  url = (
                      f"https://www.biblegateway.com/passage/"
                      f"?search={osis}+{chapter}&version={TRANSLATION}"
                  )
                  print(f"Fetching {book} {chapter}...", flush=True)
                  try:
                      page.goto(url, wait_until="domcontentloaded", timeout=30000)
                      # Wait for verse content to appear
                      page.wait_for_selector("[data-usfm]", timeout=10000)
                      html = page.content()
                  except Exception as e:
                      print(f"  ERROR: {e}")
                      continue

                  fetched = parse_verses(html, osis, chapter)

                  if len(fetched) < 5:
                      print(f"  WARNING: only {len(fetched)} verses — skipping")
                      # Print first data-usfm found for debugging
                      soup = BeautifulSoup(html, "lxml")
                      first = soup.find(attrs={"data-usfm": True})
                      print(f"  First data-usfm: {first.get('data-usfm') if first else 'none'}")
                      continue

                  for v in absent:
                      fetched.pop(str(v), None)

                  bible[book][ch_str] = fetched
                  print(f"  Stored {len(fetched)} verses (absent: {absent})")
                  time.sleep(0.5)

              browser.close()

          with open(bible_path, "w", encoding="utf-8") as f:
              json.dump(bible, f, ensure_ascii=False, indent=2)

          print("Done.")
          EOF

      - name: Commit patched bible
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add translations/NRSVUE/NRSVUE_bible.json
          git diff --cached --quiet || git commit -m "fix(nrsvue): re-patch NT chapters via Playwright scrape"
          git push
