name: Fix NRSVUE Missing Chapters

on:
  workflow_dispatch:

jobs:
  fix-nrsvue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout json-ver
        uses: actions/checkout@v4.2.2
        with:
          ref: json-ver
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright beautifulsoup4 lxml
          python -m playwright install chromium --with-deps

      - name: Fetch and patch NRSVUE chapters
        run: |
          python - <<'EOF'
          import json, re, time
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright

          TRANSLATION = "NRSVUE"
          CHAPTERS_TO_FIX = [
              ("Matthew", "Matt", 17, [21]),
          ]

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(
                  user_agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                             "(KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
                  locale="en-US",
              )
              page = context.new_page()

              print("Loading BibleGateway homepage...", flush=True)
              page.goto("https://www.biblegateway.com", wait_until="networkidle", timeout=30000)
              time.sleep(3)
              page.screenshot(path="homepage.png")
              print(f"  Title: {page.title()}")
              print(f"  URL: {page.url}")

              book, osis, chapter, absent = CHAPTERS_TO_FIX[0]
              url = f"https://www.biblegateway.com/passage/?search={osis}+{chapter}&version={TRANSLATION}"
              print(f"\nNavigating to {url}", flush=True)
              page.goto(url, wait_until="networkidle", timeout=30000)
              time.sleep(3)
              page.screenshot(path="passage.png")
              print(f"  Title: {page.title()}")
              print(f"  URL: {page.url}")

              html = page.content()
              with open("passage.html", "w", encoding="utf-8") as f:
                  f.write(html)

              # Check what's in the page
              soup = BeautifulSoup(html, "lxml")
              first_usfm = soup.find(attrs={"data-usfm": True})
              print(f"  data-usfm found: {first_usfm.get('data-usfm') if first_usfm else 'NONE'}")
              print(f"  passage-text div: {'FOUND' if soup.find(class_='passage-text') else 'NOT FOUND'}")
              print(f"  HTML length: {len(html)}")
              # Print first 2000 chars of body text for inspection
              body = soup.find('body')
              print(f"  Body preview:\n{body.get_text(' ', strip=True)[:2000] if body else 'no body'}")

              browser.close()
          print("Done.")
          EOF

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bg-debug
          path: |
            homepage.png
            passage.png
            passage.html
