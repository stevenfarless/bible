name: Fix NRSVUE Missing Chapters

on:
  workflow_dispatch:

jobs:
  fix-nrsvue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout json-ver
        uses: actions/checkout@v4
        with:
          ref: json-ver
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Fetch and patch NRSVUE chapters
        env:
          BG_USERNAME: ${{ secrets.BG_USERNAME }}
          BG_PASSWORD: ${{ secrets.BG_PASSWORD }}
        run: |
          python - <<'EOF'
          import os, json, re, requests
          from bs4 import BeautifulSoup

          BASE = "https://api.biblegateway.com/2"
          username = os.environ["BG_USERNAME"]
          password = os.environ["BG_PASSWORD"]

          # Authenticate
          r = requests.get(
              f"{BASE}/request_access_token",
              params={"username": username, "password": password}
          )
          r.raise_for_status()
          print("Auth response:", r.text[:300])
          token = r.json()["access_token"]
          print("Authenticated.")

          TRANSLATION = "NRSVUE"

          CHAPTERS_TO_FIX = [
              ("Matthew", 17, [21]),
              ("Matthew", 18, [11]),
              ("Matthew", 23, [14]),
              ("Mark",    7,  [16]),
              ("Mark",    9,  [44, 46]),
              ("Mark",    11, [26]),
              ("Mark",    15, [28]),
              ("Luke",    17, [36]),
              ("Luke",    23, [17]),
              ("John",    5,  [4]),
              ("Acts",    8,  [37]),
              ("Acts",    15, [34]),
              ("Acts",    24, [7]),
              ("Acts",    28, [29]),
              ("Romans",  16, [24]),
          ]

          BG_BOOK = {
              "Matthew": "Matt", "Mark": "Mark", "Luke": "Luke",
              "John": "John", "Acts": "Acts", "Romans": "Rom",
          }

          def fetch_chapter(book, chapter):
              ref = f"{BG_BOOK[book]} {chapter}"
              url = f"{BASE}/bible/{ref}/{TRANSLATION}"
              r = requests.get(url, params={"access_token": token})
              r.raise_for_status()
              data = r.json()
              return data[0]["content"]

          def parse_verses(html, book, chapter):
              soup = BeautifulSoup(html, "lxml")
              verses = {}
              # BG wraps verses in <span class="text BOOK-CH-V">
              pattern = re.compile(rf"{BG_BOOK[book]}-{chapter}-(\d+)")
              for span in soup.find_all("span", class_=True):
                  classes = " ".join(span.get("class", []))
                  m = pattern.search(classes)
                  if not m:
                      continue
                  v_num = m.group(1)
                  text = span.get_text(" ", strip=True)
                  # remove leading verse number digit(s) if present
                  text = re.sub(r"^\d+\s*", "", text).strip()
                  if not text:
                      continue
                  if v_num in verses:
                      verses[v_num] += " " + text
                  else:
                      verses[v_num] = text
              return verses

          bible_path = "translations/NRSVUE/NRSVUE_bible.json"
          with open(bible_path, "r", encoding="utf-8") as f:
              bible = json.load(f)

          for book, chapter, absent in CHAPTERS_TO_FIX:
              ch_str = str(chapter)
              print(f"Fetching {book} {chapter}...")
              try:
                  html = fetch_chapter(book, chapter)
              except Exception as e:
                  print(f"  ERROR fetching: {e}")
                  continue

              fetched = parse_verses(html, book, chapter)

              if not fetched:
                  print(f"  WARNING: no verses parsed for {book} {chapter} — skipping")
                  print(f"  HTML preview: {html[:500]}")
                  continue

              for v in absent:
                  fetched.pop(str(v), None)

              bible[book][ch_str] = fetched
              print(f"  Stored {len(fetched)} verses (absent: {absent})")

          with open(bible_path, "w", encoding="utf-8") as f:
              json.dump(bible, f, ensure_ascii=False, indent=2)

          print("Done.")
          EOF

      - name: Commit patched bible
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add translations/NRSVUE/NRSVUE_bible.json
          git diff --cached --quiet || git commit -m "fix(nrsvue): patch all truncated NT chapters via Bible Gateway API"
          git push
