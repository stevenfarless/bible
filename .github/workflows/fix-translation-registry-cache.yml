name: Fix Translation Registry Cache

on:
  push:
    branches:
      - exp
    paths:
      - '.github/workflows/fix-translation-registry-cache.yml'

permissions:
  contents: write

jobs:
  fix:
    name: Version translation registry fetch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exp
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: exp
          fetch-depth: 0

      - name: Patch registry fetch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.js')
          text = path.read_text()
          old = '      const res = await fetch("./translations/index.json");'
          new = '''      const buildId =
            document.querySelector('meta[name="build-id"]')?.content || "";
          const registryUrl =
            buildId && !buildId.startsWith("__BUILD_")
              ? `./translations/index.json?v=${encodeURIComponent(buildId)}`
              : "./translations/index.json";
          const res = await fetch(registryUrl);'''

          if old not in text:
              raise SystemExit('Expected translation registry fetch not found')
          if text.count(old) != 1:
              raise SystemExit('Translation registry fetch is not unique')

          path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate registry fix
        shell: bash
        run: |
          node --check app.js
          git diff --check
          grep -F 'translations/index.json?v=${encodeURIComponent(buildId)}' app.js
          grep -F 'buildId && !buildId.startsWith("__BUILD_")' app.js

      - name: Remove one-time workflow
        run: rm .github/workflows/fix-translation-registry-cache.yml

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "stevenfarless"
          git config user.email "125781365+stevenfarless@users.noreply.github.com"
          git add app.js .github/workflows/fix-translation-registry-cache.yml
          git commit -m "fix(translations): bypass stale registry cache" -m "Version the translation registry request with the deployed build ID so newly added translations appear immediately even while an older service worker still controls the page."
          git push origin exp
