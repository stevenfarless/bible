name: Repair smoke tests and index syntax

on:
  push:
    branches:
      - exp
    paths:
      - .github/workflows/repair-smoke-and-index.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exp
        uses: actions/checkout@v4
        with:
          ref: exp

      - name: Apply targeted repairs
        shell: python
        run: |
          from pathlib import Path

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          old_key = 'vigil: 1, uxorem-amo: 1'
          new_key = "vigil: 1, 'uxorem-amo': 1"
          if old_key not in index:
              raise SystemExit('Malformed theme allowlist key was not found')
          index_path.write_text(index.replace(old_key, new_key, 1), encoding='utf-8')

          test_path = Path('tests/smoke.spec.js')
          tests = test_path.read_text(encoding='utf-8')

          reading_call = "await openSettingsSection(page, 'reading');"
          if tests.count(reading_call) != 2:
              raise SystemExit(f'Expected two stale reading-section calls, found {tests.count(reading_call)}')
          tests = tests.replace(
              reading_call,
              "await openSettingsSection(page, 'appearance');"
          )

          old_signup = "await page.locator('#showSignup').click();"
          if tests.count(old_signup) != 1:
              raise SystemExit(f'Expected one stale signup selector, found {tests.count(old_signup)}')
          tests = tests.replace(
              old_signup,
              "await page.locator('#showSignupLink').click();",
              1
          )

          test_path.write_text(tests, encoding='utf-8')

      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/smoke.spec.js
          git commit -m "fix: repair index syntax and smoke selectors"
          git push origin HEAD:exp
