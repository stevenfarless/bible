name: Import Bible Translation

on:
  workflow_dispatch:
    inputs:
      source_path:
        description: 'Paste anything: full GitHub URL, owner/repo/blob/branch/path, or "path at branch · owner/repo"'
        required: true
        type: string
      abbreviation:
        description: 'Abbreviation to use (e.g. NRSV). Leave blank to auto-derive from filename.'
        required: false
        type: string

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout json-ver branch
        uses: actions/checkout@v4
        with:
          ref: json-ver

      - name: Parse input and fetch translation
        id: fetch
        run: |
          RAW_INPUT="${{ github.event.inputs.source_path }}"

          INPUT=$(echo "$RAW_INPUT" | sed 's|https\?://github\.com/||')

          if echo "$INPUT" | grep -q ' at .* · '; then
            FILE_PATH=$(echo "$INPUT" | sed 's/ at .*//')
            OWNER_REPO=$(echo "$INPUT" | sed 's/.* · //')
            BRANCH=$(echo "$INPUT" | sed 's/.* at //;s/ · .*//')
            RAW_URL="https://raw.githubusercontent.com/${OWNER_REPO}/${BRANCH}/${FILE_PATH}"
          elif echo "$INPUT" | grep -q '^[^/]*/[^/]*/blob/'; then
            OWNER=$(echo "$INPUT" | cut -d/ -f1)
            REPO=$(echo "$INPUT"   | cut -d/ -f2)
            BRANCH=$(echo "$INPUT" | cut -d/ -f4)
            FILE_PATH=$(echo "$INPUT" | cut -d/ -f5-)
            RAW_URL="https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${FILE_PATH}"
          else
            OWNER=$(echo "$INPUT"    | cut -d/ -f1)
            REPO=$(echo "$INPUT"     | cut -d/ -f2)
            FILE_PATH=$(echo "$INPUT" | cut -d/ -f3-)
            RAW_URL="https://raw.githubusercontent.com/${OWNER}/${REPO}/main/${FILE_PATH}"
          fi

          echo "Fetching: $RAW_URL"
          curl -fsSL "$RAW_URL" -o /tmp/source_bible.json

          ABBREV="${{ github.event.inputs.abbreviation }}"
          if [ -z "$ABBREV" ]; then
            BASENAME=$(basename "$FILE_PATH" .json)
            ABBREV=$(echo "$BASENAME" | sed 's/^[a-z]*_//' | tr '[:lower:]' '[:upper:]')
          fi

          echo "abbrev=$ABBREV" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Split and write translation files
        env:
          ABBREV: ${{ steps.fetch.outputs.abbrev }}
        run: |
          python3 - <<'PYEOF'
          import json, os, pathlib

          abbrev = os.environ["ABBREV"]

          with open("/tmp/source_bible.json", encoding="utf-8") as f:
              raw = json.load(f)

          def normalize_chapters(chapters):
              """
              Convert chapters to {"1": {"1": verse, ...}, ...} regardless of source format.
              Handles:
                - dict of dicts:  {"1": {"1": "..."}}
                - dict of lists:  {"1": ["verse1", "verse2"]}
                - list of dicts:  [{"verses": [...]}] or [{"1": "..."}]
                - list of lists:  [["verse1", "verse2"]]
              """
              if isinstance(chapters, dict):
                  normalized = {}
                  for ch_num, verses in chapters.items():
                      if isinstance(verses, dict):
                          normalized[str(ch_num)] = {str(k): v for k, v in verses.items()}
                      elif isinstance(verses, list):
                          normalized[str(ch_num)] = {str(i + 1): v for i, v in enumerate(verses)}
                      else:
                          normalized[str(ch_num)] = {"1": verses}
                  return normalized
              elif isinstance(chapters, list):
                  normalized = {}
                  for ch_idx, verses in enumerate(chapters):
                      ch_num = str(ch_idx + 1)
                      if isinstance(verses, dict):
                          if "verses" in verses:
                              verse_list = verses["verses"]
                              normalized[ch_num] = {str(i + 1): v for i, v in enumerate(verse_list)}
                          else:
                              normalized[ch_num] = {str(k): v for k, v in verses.items() if k not in ("chapter", "name")}
                      elif isinstance(verses, list):
                          normalized[ch_num] = {str(i + 1): v for i, v in enumerate(verses)}
                      else:
                          normalized[ch_num] = {"1": verses}
                  return normalized
              return {}

          def extract_bible(data):
              """
              Return a dict of {BookName: normalized_chapters}.
              Handles top-level dict, list of books, or single-key wrapper.
              """
              if isinstance(data, list):
                  result = {}
                  for book in data:
                      if isinstance(book, dict):
                          name = book.get("name") or book.get("book") or book.get("title") or f"Book{len(result)+1}"
                          chapters = book.get("chapters") or book.get("verses") or {}
                          result[name] = normalize_chapters(chapters)
                  return result

              if isinstance(data, dict):
                  if len(data) == 1:
                      val = next(iter(data.values()))
                      if isinstance(val, (list, dict)):
                          return extract_bible(val)

                  result = {}
                  for key, val in data.items():
                      if isinstance(val, (dict, list)):
                          result[key] = normalize_chapters(val)
                  return result

              return {}

          bible = extract_bible(raw)

          if not bible:
              raise ValueError(f"Could not parse bible structure. Top-level type: {type(raw)}, preview: {str(raw)[:300]}")

          base = pathlib.Path(f"translations/{abbrev}")
          books_dir = base / f"{abbrev}_books"
          books_dir.mkdir(parents=True, exist_ok=True)

          for book_name, chapters in bible.items():
              book_file = books_dir / f"{book_name}.json"
              with open(book_file, "w", encoding="utf-8") as f:
                  json.dump({book_name: chapters}, f, ensure_ascii=False, indent=2)
              print(f"  wrote {book_file}")

          bible_file = base / f"{abbrev}_bible.json"
          with open(bible_file, "w", encoding="utf-8") as f:
              json.dump(bible, f, ensure_ascii=False, indent=2)
          print(f"  wrote {bible_file}")

          print(f"Done. {len(bible)} books written for {abbrev}.")
          PYEOF

      - name: Commit and push
        env:
          ABBREV: ${{ steps.fetch.outputs.abbrev }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add translations/
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "feat(translations): import ${ABBREV} translation"
          git push
