name: "! Phase 9"

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: phase-9-exp
  cancel-in-progress: false

jobs:
  fix:
    name: Defer full font catalog and deploy Pages
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exp
        uses: actions/checkout@v6
        with:
          ref: exp
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Defer non-critical font catalog
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          critical_fonts = """\t<style id="startup-font-faces">
\t\t@font-face {
\t\t\tfont-family: 'Cinzel';
\t\t\tsrc: url('./fonts/Cinzel-Regular.woff2') format('woff2');
\t\t\tfont-weight: 400;
\t\t\tfont-style: normal;
\t\t\tfont-display: swap;
\t\t}

\t\t@font-face {
\t\t\tfont-family: 'Gentium Book Plus';
\t\t\tsrc: url('./fonts/GentiumBookPlus-Regular.woff2') format('woff2');
\t\t\tfont-weight: 400;
\t\t\tfont-style: normal;
\t\t\tfont-display: swap;
\t\t}
\t</style>
\t<link rel="preload" href="css/fonts.css" as="style" onload="this.onload=null;this.rel='stylesheet'" />
\t<noscript><link rel="stylesheet" href="css/fonts.css" /></noscript>"""

          old = '\t<link rel="stylesheet" href="css/fonts.css" />'
          if old in text:
              text = text.replace(old, critical_fonts, 1)
              path.write_text(text)
          elif 'id="startup-font-faces"' in text and 'rel="preload" href="css/fonts.css" as="style"' in text:
              print('Phase 9 font startup optimization is already present.')
          else:
              raise SystemExit('Expected blocking fonts.css link was not found in index.html.')
          PY

      - name: Validate changed files
        run: |
          git diff --check

          grep -q '<style id="startup-font-faces">' index.html
          grep -q "font-family: 'Cinzel';" index.html
          grep -q "font-family: 'Gentium Book Plus';" index.html
          grep -q "url('./fonts/Cinzel-Regular.woff2')" index.html
          grep -q "url('./fonts/GentiumBookPlus-Regular.woff2')" index.html
          grep -q 'rel="preload" href="css/fonts.css" as="style"' index.html
          grep -q '<noscript><link rel="stylesheet" href="css/fonts.css" /></noscript>' index.html

          if grep -q '^\s*<link rel="stylesheet" href="css/fonts.css" />' index.html; then
            echo "fonts.css still blocks first render."
            exit 1
          fi

          grep -q 'rel="stylesheet" href="css/base.css"' index.html
          grep -q 'rel="stylesheet" href="css/tokens.css"' index.html
          grep -q 'rel="stylesheet" href="css/themes.css"' index.html
          grep -q 'rel="stylesheet" href="css/layout.css"' index.html
          grep -q 'rel="stylesheet" href="css/components.css"' index.html
          grep -q 'rel="stylesheet" href="css/pericope.css"' index.html

          UNEXPECTED="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev '^(index.html)$' || true)"
          test -z "$UNEXPECTED" || {
            echo "Unexpected changed files:"
            echo "$UNEXPECTED"
            exit 1
          }

      - name: Install dependencies
        run: |
          npm install --package-lock=false
          npm install --no-save --package-lock=false @playwright/test esbuild firebase marked
          npx playwright install chromium --with-deps

      - name: Run unit tests
        run: npm test

      - name: Run Chromium tests
        env:
          BASE_URL: http://localhost:8080
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          python3 -m http.server 8080 > /tmp/lege-lux-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 10); do
            curl -fsS http://localhost:8080 > /dev/null && break
            sleep 1
          done

          curl -fsS http://localhost:8080 > /dev/null || {
            cat /tmp/lege-lux-http.log
            exit 1
          }

          npx playwright test tests/smoke.spec.js tests/auth-settings-race.spec.js --project=chromium

      - name: Run offline build audit
        run: node scripts/prepare-offline-build.mjs

      - name: Commit Phase 9
        run: |
          FILES=(
            index.html
          )

          if git diff --quiet -- "${FILES[@]}"; then
            echo "No Phase 9 changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "${FILES[@]}"
            git commit -F - <<'EOF'
          perf(fonts): defer full font catalog from startup

          Inline the startup Cinzel and Gentium regular font faces while loading
          the full font catalog stylesheet after first paint. This keeps the
          reader's initial typography available without making every optional
          font declaration render-blocking.
          EOF
            git push origin exp
          fi

      - name: Dispatch GitHub Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESPONSE_FILE="$(mktemp)"
          STATUS="$({
            curl -sS \
              -o "$RESPONSE_FILE" \
              -w '%{http_code}' \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-gh-pages.yml/dispatches" \
              -d '{"ref":"exp"}'
          })"

          if [ "$STATUS" != "204" ]; then
            echo "Deploy to GitHub Pages workflow dispatch failed with HTTP $STATUS."
            cat "$RESPONSE_FILE"
            exit 1
          fi

          echo "Deploy to GitHub Pages workflow dispatched for exp."
