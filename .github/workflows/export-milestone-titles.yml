name: Remove Version Numbers from Milestones

on:
  issues:
    types:
      - opened

permissions:
  contents: write
  issues: write

jobs:
  rename:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}

    steps:
      - name: Checkout exp
        uses: actions/checkout@v6
        with:
          ref: exp
          fetch-depth: 0

      - name: Rename milestones
        shell: bash
        run: |
          set -euo pipefail

          declare -A RENAMES=(
            [3]='json-ver Stability'
            [4]='UI & Responsive'
            [5]='Repo Hygiene (no tag)'
            [6]='Text Layout & Display'
            [7]='Greek & Hebrew Texts'
            [8]='Translation Expansion'
            [9]='User Features'
            [11]='Bug Fixes'
            [12]='Performance & Search'
            [13]='Translations & Refactoring'
            [14]='UI Overhaul & Source Texts'
            [15]='Critical Performance (CWV)'
          )

          for number in "${!RENAMES[@]}"; do
            desired="${RENAMES[$number]}"
            current="$(gh api "repos/${REPO}/milestones/${number}" --jq '.title')"

            if [[ "$current" == "$desired" ]]; then
              echo "Milestone #${number} already named: ${desired}"
              continue
            fi

            gh api --method PATCH "repos/${REPO}/milestones/${number}" \
              -f title="$desired" \
              >/dev/null

            echo "Renamed milestone #${number}: ${current} -> ${desired}"
          done

      - name: Export and verify milestone titles
        shell: bash
        run: |
          set -euo pipefail

          gh api --paginate "repos/${REPO}/milestones?state=all&per_page=100" \
            --jq '[.[] | {number, title, state, description}]' \
            > .github/milestone-titles.json

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path('.github/milestone-titles.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          if data and isinstance(data[0], list):
              data = [item for page in data for item in page]

          data.sort(key=lambda item: item['number'])
          path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')

          versioned = [
              item
              for item in data
              if re.search(r'(?i)(?:^|\s)(?:version\s+|v)\d+(?:\.\d+){0,2}(?:\s|$|[—–-])', item['title'])
          ]

          if versioned:
              for item in versioned:
                  print(f"Versioned milestone remains: #{item['number']} {item['title']}")
              raise SystemExit('Version numbers remain in milestone titles')

          print('All milestone titles are free of version-number prefixes')
          PY

      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/milestone-titles.json

          if git diff --cached --quiet; then
            echo "Milestone title report unchanged"
            exit 0
          fi

          git commit -m "chore: record cleaned milestone titles"
          git pull --rebase origin exp
          git push origin exp
