name: Create Theme

on:
  workflow_dispatch:
    inputs:
      theme_name:
        description: Theme name
        required: true
        type: string
      existing_theme_action:
        description: Existing theme
        required: true
        default: stop
        type: choice
        options:
          - stop
          - overwrite
          - rename
      rename_theme_id:
        description: Rename ID
        required: false
        type: string
      mode:
        description: Mode
        required: true
        default: dark
        type: choice
        options:
          - dark
          - light
      bg_base:
        description: Base background
        required: true
        type: string
      bg_card:
        description: Card background
        required: true
        type: string
      text_heading:
        description: Heading text
        required: true
        type: string
      text_body:
        description: Body text
        required: true
        type: string
      text_muted:
        description: Muted text
        required: true
        type: string
      primary_color:
        description: Primary color
        required: true
        type: string
      brand_secondary:
        description: Secondary color
        required: true
        type: string
      accent_color:
        description: Accent color
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-theme:
    name: Create theme
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: exp
          fetch-depth: 0

      - name: Generate theme
        env:
          THEME_NAME: ${{ inputs.theme_name }}
          EXISTING_THEME_ACTION: ${{ inputs.existing_theme_action }}
          RENAME_THEME_ID: ${{ inputs.rename_theme_id }}
          THEME_MODE: ${{ inputs.mode }}
          BG_BASE: ${{ inputs.bg_base }}
          BG_CARD: ${{ inputs.bg_card }}
          TEXT_HEADING: ${{ inputs.text_heading }}
          TEXT_BODY: ${{ inputs.text_body }}
          TEXT_MUTED: ${{ inputs.text_muted }}
          PRIMARY_COLOR: ${{ inputs.primary_color }}
          BRAND_SECONDARY: ${{ inputs.brand_secondary }}
          ACCENT_COLOR: ${{ inputs.accent_color }}
        run: python3 .github/scripts/create_theme.py

      - name: Verify generated theme
        run: |
          node --check ui.js
          git diff --check
          git diff -- css/themes.css index.html ui.js

      - name: Commit theme
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/themes.css index.html ui.js
          git commit -m "feat: add generated theme"
          git push origin exp
