name: Fix Brenton Lettered Verses

on:
  push:
    branches:
      - exp
    paths:
      - .github/workflows/fix-brenton-lettered-verses.yml
  workflow_dispatch:

jobs:
  fix:
    name: Integrate lettered LXX verse labels
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout exp
        uses: actions/checkout@v7
        with:
          ref: exp
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch reader paths
        run: python .github/scripts/fix-brenton-lettered-verses.py

      - name: Validate syntax and stale numeric coercions
        run: |
          node --check events.js
          node --check navigation.js
          node --check modals.js
          node --check bookmarks.js
          git diff --check
          python - <<'PY'
          from pathlib import Path

          events = Path('events.js').read_text(encoding='utf-8')
          navigation = Path('navigation.js').read_text(encoding='utf-8')
          modals = Path('modals.js').read_text(encoding='utf-8')
          bookmarks = Path('bookmarks.js').read_text(encoding='utf-8')

          assert 'const value = /^\\d+$/.test(raw) ? Number(raw) : raw.toLowerCase();' in events
          assert 'getCurrentVerseIds(app)' in navigation
          assert 'for (const verseId of verseIds)' in modals
          assert 'normalizeVerseId(app.state?.selectedVerse)' in bookmarks
          assert 'Number(item.verse)' not in bookmarks
          assert 'Number(app.state?.selectedVerse)' not in bookmarks
          PY

      - name: Remove one-time integration files
        run: rm .github/workflows/fix-brenton-lettered-verses.yml .github/scripts/fix-brenton-lettered-verses.py

      - name: Commit reader support
        run: |
          git config user.name "stevenfarless"
          git config user.email "125781365+stevenfarless@users.noreply.github.com"
          git add events.js navigation.js modals.js bookmarks.js .github/workflows/fix-brenton-lettered-verses.yml .github/scripts/fix-brenton-lettered-verses.py
          git commit -m "fix(reader): support lettered LXX verse labels" \
            -m "Preserve Brenton verse identifiers such as 72a during selection, picker navigation, keyboard verse movement, and bookmarks so native Septuagint versification remains usable throughout the reader."
          git push origin HEAD:exp
