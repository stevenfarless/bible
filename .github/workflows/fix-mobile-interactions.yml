name: Fix Mobile Interaction Regressions

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-mobile-interactions:
    name: Repair appearance and verse interactions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: exp
          fetch-depth: 0

      - name: Apply repairs
        run: python3 .github/scripts/fix_mobile_interactions.py

      - name: Verify changes
        run: |
          node --check events.js
          git diff --check
          grep -F "setLightMode(app, event.currentTarget.value);" events.js
          grep -F "if (event.target.closest('.selected-verse-glow, .verse-tools-tray, .verse-tools-trigger')) return;" events.js
          grep -F -- "-webkit-user-select: none;" css/interactions.css
          git diff -- events.js css/interactions.css

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.js css/interactions.css
          git commit -m "fix: repair appearance and verse interactions"
          git push origin exp
