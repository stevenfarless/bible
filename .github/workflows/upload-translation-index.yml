name: Upload Translation Index to Firebase

on:
  workflow_dispatch:

jobs:
  upload:
    name: Build and upload translationIndex
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install firebase-admin

      - name: Write service account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/service_account.json

      - name: Build and upload translation index
        run: |
          python - <<'EOF'
          import os
          import glob
          import firebase_admin
          from firebase_admin import credentials, db

          cred = credentials.Certificate("/tmp/service_account.json")
          firebase_admin.initialize_app(cred, {
              "databaseURL": "https://esv-bible-6dffb-default-rtdb.firebaseio.com"
          })

          # Human-readable labels for known translation IDs.
          # Add entries here as new translations are added.
          LABELS = {
              "BSB":     "Berean Standard Bible",
              "CSB":     "Christian Standard Bible",
              "ESV":     "English Standard Version",
              "ISV":     "International Standard Version",
              "KJV":     "King James Version",
              "LEB":     "Lexham English Bible",
              "MEV":     "Modern English Version",
              "MSB":     "Majority Standard Bible",
              "NIV":     "New International Version",
              "NKJV":    "New King James Version",
              "NLT":     "New Living Translation",
              "NRSVUE":  "New Revised Standard Version Updated Edition",
          }

          # Derive list of translations from folders present in translations/
          translation_dirs = sorted([
              os.path.basename(d)
              for d in glob.glob("translations/*/")
              if os.path.isdir(d)
          ])

          if not translation_dirs:
              print("No translation folders found under translations/.")
              exit(1)

          index = []
          for abbr in translation_dirs:
              entry = {
                  "id":    abbr,
                  "label": LABELS.get(abbr, abbr),
              }
              index.append(entry)
              print(f"  {abbr}: {entry['label']}")

          ref = db.reference("translationIndex")
          ref.set(index)
          print(f"Uploaded translationIndex with {len(index)} entries.")
          EOF

      - name: Clean up key
        if: always()
        run: rm -f /tmp/service_account.json
