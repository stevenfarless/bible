name: Sync BSB Structure to dev and firebase

on:
  workflow_dispatch:

jobs:
  sync:
    name: Copy BSB_structure folder from main to dev and firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync to dev
        run: |
          git checkout dev
          git checkout main -- translations/BSB/BSB_structure/
          git add translations/BSB/BSB_structure/
          git diff --cached --quiet || git commit -m "chore: sync BSB_structure from main"
          git push origin dev

      - name: Sync to firebase
        run: |
          git checkout firebase
          git checkout main -- translations/BSB/BSB_structure/
          git add translations/BSB/BSB_structure/
          git diff --cached --quiet || git commit -m "chore: sync BSB_structure from main"
          git push origin firebase
