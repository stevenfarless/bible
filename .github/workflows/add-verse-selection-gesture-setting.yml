name: Add Verse Selection Gesture Setting

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-verse-selection:
    name: Add verse selection gesture setting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: exp
          fetch-depth: 0

      - name: Patch verse selection setting
        run: python3 .github/scripts/add_verse_selection_gesture_setting.py

      - name: Verify changes
        run: |
          git diff --check
          git diff -- index.html ui.js settings.js events.js app.js

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ui.js settings.js events.js app.js
          git commit -m "feat: add verse selection gesture setting"
          git push origin exp
