name: "! Bookmark Icon Fix"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bookmark-icon-fix-exp
  cancel-in-progress: false

jobs:
  bookmark-icon-fix:
    name: Fix bookmark tray icon
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exp
        uses: actions/checkout@v7
        with:
          ref: exp
          fetch-depth: 0

      - name: Apply bookmark icon fix
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -B -m py_compile .github/scripts/bookmark_icon_fix.py
          python3 -B .github/scripts/bookmark_icon_fix.py
          python3 -B .github/scripts/bookmark_icon_fix.py
          rm -rf .github/scripts/__pycache__

      - name: Validate bookmark icon fix
        run: |
          grep -q 'stroke="#1c1c1a"' reading-state.js
          grep -q 'fill="currentColor"' reading-state.js
          grep -q 'stroke-width="2.2"' reading-state.js
          grep -q 'verse-tool-icon--bookmark-add' reading-state.js
          grep -q 'overflow: visible;' css/interactions.css
          node --check reading-state.js
          git diff --check

      - name: Verify changed files
        run: |
          allowed='^(reading-state\.js|css/interactions\.css)$'
          unexpected="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"
          test -z "$unexpected" || {
            echo "Unexpected changed files:"
            echo "$unexpected"
            exit 1
          }

      - name: Commit bookmark icon fix
        run: |
          files=(reading-state.js css/interactions.css)
          if [ -z "$(git status --porcelain -- "${files[@]}")" ]; then
            echo "Bookmark icon fix is already applied."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit \
            -m "fix(bookmarks): use a bolder add-bookmark tray icon" \
            -m "Replace the thin bookmark tray icon with a chunkier filled bookmark and a more visible plus sign so the control reads clearly at mobile size."
          git push origin exp
