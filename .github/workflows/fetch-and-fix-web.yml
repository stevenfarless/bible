name: Fetch and Fix WEB Translation

on:
  workflow_dispatch:

jobs:
  fetch-and-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Fetch WEB and fix all translation meta
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          TARGET_BRANCH: main-book-update
        run: python dev-scripts/.github/scripts/fetch_and_fix_web.py
