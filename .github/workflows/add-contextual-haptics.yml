name: Add Contextual Haptics

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: add-contextual-haptics-exp
  cancel-in-progress: false

jobs:
  add-contextual-haptics:
    name: Add contextual haptic feedback
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exp
        uses: actions/checkout@v6
        with:
          ref: exp
          fetch-depth: 0

      - name: Restore and verify reviewed patcher
        run: |
          source_commit=7af08f20a86233d530cf0b243291c6656fd75bc0

          git show "$source_commit:.github/workflows/add-contextual-haptics.yml" \
            | sed -n "/<<'PATCH'/,/^          PATCH$/p" \
            | sed '1d;$d;s/^          //' \
            > /tmp/contextual-haptics.py.gz.b64

          # Correct the single transcription error in the archived payload.
          sed -i 's/QhPLLkSbvWkwaYTCb/QhPLLkSbvWkwaaYTCb/' \
            /tmp/contextual-haptics.py.gz.b64

          base64 --decode /tmp/contextual-haptics.py.gz.b64 \
            | gzip --decompress \
            > /tmp/contextual-haptics.py

          echo '63f1e9da30bea1ad0937ffb167b59cf82306256aa0a1fdeff3a74274378299f0  /tmp/contextual-haptics.py' \
            | sha256sum --check --strict

          python3 -m py_compile /tmp/contextual-haptics.py

      - name: Apply contextual haptics
        run: python3 /tmp/contextual-haptics.py

      - name: Validate focused changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          required = {
              'haptics.js': [
                  'const LIGHT_CLICK_MS = 10;',
                  'const FIRM_CLICK_MS = 24;',
                  'export function hapticLight(app)',
                  'export function hapticFirm(app)',
              ],
              'index.html': ['href="haptics.js"', 'id="hapticsSetting"', 'id="hapticsToggle"'],
              'sw.js': ["'./haptics.js',"],
              'settings.js': [
                  'hapticsEnabled:      true,',
                  "readBool('hapticsEnabled'",
                  "hapticsEnabled:    'hapticsToggle'",
              ],
              'auth.js': [
                  'hapticsEnabled: app.state.hapticsEnabled,',
                  's.hapticsEnabled ?? app.state.hapticsEnabled ?? true',
              ],
              'app.js': [
                  "import { hapticLight } from './haptics.js';",
                  'execCommand copy returned false',
              ],
              'events.js': [
                  "import { hapticLight, hapticFirm } from './haptics.js';",
                  'if (await handleChangeEmail(app))',
                  'if (await handleChangePassword(app))',
                  "const update = app.toggleSetting('hapticsEnabled');",
              ],
              'modals.js': [
                  'export function closeModal(app, modal, { haptic = true } = {})',
                  'if (haptic) hapticLight(app);',
                  'if (shouldHaptic) hapticFirm(app);',
              ],
              'keyboard.js': ["app.closeModal(activeModal, { haptic: false });"],
              'swipe.js': ['hapticLight(app);', 'hapticFirm(app);'],
              'bottom-sheet-drag.js': ['state !== previousSnapState', 'hapticFirm(app);'],
              'tests/unit/haptics.test.js': ['uses 10ms for light feedback', 'uses 24ms for firm feedback'],
              'tests/smoke.spec.js': [
                  'self.__hapticCalls = [];',
                  "haptics: modal selection closes with one light pulse",
                  "haptics: keyboard shortcuts and disabled preference stay silent",
              ],
          }

          for path_name, snippets in required.items():
              text = Path(path_name).read_text(encoding='utf-8')
              for snippet in snippets:
                  assert snippet in text, f'Missing from {path_name}: {snippet}'

          direct_vibrate = []
          for path in Path('.').glob('*.js'):
              if path.name == 'haptics.js':
                  continue
              if 'navigator.vibrate' in path.read_text(encoding='utf-8'):
                  direct_vibrate.append(str(path))

          assert not direct_vibrate, f'Direct vibration calls remain: {direct_vibrate}'
          assert 'function _haptic(' not in Path('swipe.js').read_text(encoding='utf-8')
          assert '_haptic(true)' not in Path('swipe.js').read_text(encoding='utf-8')
          assert '_haptic(false)' not in Path('swipe.js').read_text(encoding='utf-8')
          PY

          node --check haptics.js
          node --check app.js
          node --check auth.js
          node --check bottom-sheet-drag.js
          node --check events.js
          node --check keyboard.js
          node --check modals.js
          node --check reading-state.js
          node --check search.js
          node --check settings.js
          node --check swipe.js
          node --check ui.js
          node --check tests/smoke.spec.js
          git diff --check
          git diff --stat

      - name: Verify changed-file scope
        run: |
          allowed='^(haptics\.js|index\.html|sw\.js|ui\.js|reading-state\.js|settings\.js|auth\.js|app\.js|events\.js|modals\.js|keyboard\.js|search\.js|swipe\.js|bottom-sheet-drag\.js|tests/unit/haptics\.test\.js|tests/smoke\.spec\.js)$'
          unexpected="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"

          if [ -n "$unexpected" ]; then
            echo "Unexpected changed files:"
            echo "$unexpected"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Install Playwright
        run: npm install --no-save @playwright/test

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Start local HTTP server
        run: |
          python3 -m http.server 8080 &
          for i in $(seq 1 10); do
            curl -s http://localhost:8080 > /dev/null && break || sleep 1
          done

      - name: Run browser smoke tests
        env:
          BASE_URL: http://localhost:8080
        run: npx playwright test tests/smoke.spec.js --project=chromium

      - name: Commit haptic feedback
        run: |
          files=(
            haptics.js
            index.html
            sw.js
            ui.js
            reading-state.js
            settings.js
            auth.js
            app.js
            events.js
            modals.js
            keyboard.js
            search.js
            swipe.js
            bottom-sheet-drag.js
            tests/unit/haptics.test.js
            tests/smoke.spec.js
          )

          if [ -z "$(git status --porcelain -- "${files[@]}")" ]; then
            echo "Contextual haptics are already implemented"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -F - <<'EOF'
          feat(haptics): add contextual interaction feedback

          Add configurable light and firm vibration feedback for navigation,
          verse selection, modal closing, settings controls, sheet snap points,
          search, copy actions, and boundary gestures.

          Centralize vibration handling, preserve local migration state, verify
          successful actions before feedback, and keep automatic, failed,
          cancelled, and keyboard shortcut actions silent.
          EOF
          git push origin exp
