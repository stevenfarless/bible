      - name: Validate focused changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          required = {
              "haptics.js": [
                  "const LIGHT_CLICK_MS = 10;",
                  "const FIRM_CLICK_MS = 24;",
                  "export function hapticLight(app)",
                  "export function hapticFirm(app)",
              ],
              "index.html": [
                  'rel="modulepreload" href="haptics.js"',
                  'id="hapticsSetting"',
                  'id="hapticsToggle"',
              ],
              "sw.js": ["'./haptics.js',"],
              "settings.js": [
                  "hapticsEnabled:      true,",
                  "readBool('hapticsEnabled',      DEFAULTS.hapticsEnabled)",
                  "hapticsSetting.hidden = typeof navigator.vibrate !== 'function';",
              ],
              "auth.js": [
                  "hapticsEnabled: app.state.hapticsEnabled,",
                  "s.hapticsEnabled ?? true",
              ],
              "events.js": [
                  "import { hapticLight, hapticFirm } from './haptics.js';",
                  "if (selectVerse(pressedVerse)) hapticFirm(app);",
                  "app.hapticsToggle?.addEventListener('change'",
              ],
              "modals.js": [
                  "export function closeModal(app, modal, { haptic = true } = {})",
                  "if (haptic) hapticLight(app);",
                  "if (shouldHaptic) hapticFirm(app);",
              ],
              "swipe.js": [
                  "import { hapticLight, hapticFirm } from './haptics.js';",
                  "hapticLight(app);",
                  "hapticFirm(app);",
              ],
              "bottom-sheet-drag.js": [
                  "import { hapticFirm } from './haptics.js';",
                  "state !== previousSnapState",
              ],
              "tests/unit/haptics.test.js": [
                  "uses 10ms for light feedback",
                  "uses 24ms for firm feedback",
              ],
          }

          for path_name, snippets in required.items():
              text = Path(path_name).read_text(encoding="utf-8")
              for snippet in snippets:
                  assert snippet in text, f"Missing from {path_name}: {snippet}"

          direct_vibrate = []
          for path in Path('.').glob('*.js'):
              if path.name == 'haptics.js':
                  continue
              text = path.read_text(encoding='utf-8')
              if 'navigator.vibrate' in text:
                  direct_vibrate.append(str(path))

          assert not direct_vibrate, f"Direct vibration calls remain: {direct_vibrate}"
          assert "function _haptic(" not in Path('swipe.js').read_text(encoding='utf-8')
          assert "_haptic(true)" not in Path('swipe.js').read_text(encoding='utf-8')
          assert "_haptic(false)" not in Path('swipe.js').read_text(encoding='utf-8')
          PY

          node --check haptics.js
          node --check app.js
          node --check auth.js
          node --check bottom-sheet-drag.js
          node --check events.js
          node --check keyboard.js
          node --check modals.js
          node --check reading-state.js
          node --check search.js
          node --check settings.js
          node --check swipe.js
          node --check ui.js
          git diff --check
          git diff --stat

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install repository dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Install Playwright
        run: npm install --no-save @playwright/test

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Start local HTTP server
        run: |
          python3 -m http.server 8080 &
          for i in $(seq 1 10); do
            curl -s http://localhost:8080 > /dev/null && break || sleep 1
          done

      - name: Run browser smoke tests
        env:
          BASE_URL: http://localhost:8080
        run: npx playwright test tests/smoke.spec.js --project=chromium

      - name: Commit haptic feedback
        run: |
          files=(
            haptics.js
            index.html
            sw.js
            ui.js
            reading-state.js
            settings.js
            auth.js
            app.js
            events.js
            modals.js
            keyboard.js
            search.js
            swipe.js
            bottom-sheet-drag.js
            tests/unit/haptics.test.js
          )

          if git diff --quiet -- "${files[@]}"; then
            echo "Contextual haptics are already implemented"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -F - <<'EOF'
          feat(haptics): add contextual interaction feedback

          Add configurable light and firm vibration feedback for navigation,
          verse selection, modal closing, settings controls, sheet snap points,
          search, copy actions, and boundary gestures.

          Centralize vibration handling, respect user activation and browser
          support, persist the preference locally and through Firebase, and keep
          automatic, failed, cancelled, and keyboard shortcut actions silent.
          EOF
          git push origin exp
