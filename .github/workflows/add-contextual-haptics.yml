name: Add Contextual Haptics

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-contextual-haptics:
    name: Add contextual haptic feedback
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exp
        uses: actions/checkout@v6
        with:
          ref: exp
          fetch-depth: 0

      - name: Apply contextual haptics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path_name, old, new):
              path = Path(path_name)
              text = path.read_text(encoding="utf-8")
              old_count = text.count(old)
              new_count = text.count(new)

              if old_count == 1:
                  path.write_text(text.replace(old, new, 1), encoding="utf-8")
                  print(f"Updated: {path_name}")
                  return

              if old_count == 0 and new_count == 1:
                  print(f"Already updated: {path_name}")
                  return

              raise SystemExit(
                  f"Unexpected replacement state in {path_name}: "
                  f"old={old_count}, new={new_count}"
              )

          def replace_count(path_name, old, new, expected):
              path = Path(path_name)
              text = path.read_text(encoding="utf-8")
              old_count = text.count(old)
              new_count = text.count(new)

              if old_count == expected:
                  path.write_text(text.replace(old, new), encoding="utf-8")
                  print(f"Updated {expected} occurrences: {path_name}")
                  return

              if old_count == 0 and new_count == expected:
                  print(f"Already updated: {path_name}")
                  return

              raise SystemExit(
                  f"Unexpected replacement state in {path_name}: "
                  f"old={old_count}, new={new_count}, expected={expected}"
              )

          def write_new(path_name, content):
              path = Path(path_name)
              normalized = content.rstrip() + "\n"

              if path.exists():
                  current = path.read_text(encoding="utf-8")
                  if current == normalized:
                      print(f"Already present: {path_name}")
                      return
                  raise SystemExit(f"Refusing to overwrite unexpected file: {path_name}")

              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(normalized, encoding="utf-8")
              print(f"Created: {path_name}")

          write_new(
              "haptics.js",
              """const LIGHT_CLICK_MS = 10;
          const FIRM_CLICK_MS = 24;

          function vibrate(app, duration) {
              if (app?.state?.hapticsEnabled !== true) return false;
              if (typeof navigator.vibrate !== 'function') return false;

              if (
                  navigator.userActivation &&
                  !navigator.userActivation.hasBeenActive
              ) {
                  return false;
              }

              try {
                  return navigator.vibrate(duration);
              } catch (_) {
                  return false;
              }
          }

          export function hapticLight(app) {
              return vibrate(app, LIGHT_CLICK_MS);
          }

          export function hapticFirm(app) {
              return vibrate(app, FIRM_CLICK_MS);
          }""",
          )

          write_new(
              "tests/unit/haptics.test.js",
              """import {
              afterEach,
              describe,
              expect,
              it,
              vi,
          } from 'vitest';

          import {
              hapticLight,
              hapticFirm,
          } from '../../haptics.js';

          afterEach(() => {
              vi.unstubAllGlobals();
          });

          function createApp(enabled = true) {
              return {
                  state: {
                      hapticsEnabled: enabled,
                  },
              };
          }

          function installNavigator(vibrate, hasBeenActive = true) {
              vi.stubGlobal('navigator', {
                  vibrate,
                  userActivation: {
                      hasBeenActive,
                  },
              });
          }

          describe('haptics', () => {
              it('uses 10ms for light feedback', () => {
                  const vibrate = vi.fn(() => true);
                  installNavigator(vibrate);

                  expect(hapticLight(createApp())).toBe(true);
                  expect(vibrate).toHaveBeenCalledWith(10);
              });

              it('uses 24ms for firm feedback', () => {
                  const vibrate = vi.fn(() => true);
                  installNavigator(vibrate);

                  expect(hapticFirm(createApp())).toBe(true);
                  expect(vibrate).toHaveBeenCalledWith(24);
              });

              it('does nothing when disabled', () => {
                  const vibrate = vi.fn(() => true);
                  installNavigator(vibrate);

                  expect(hapticLight(createApp(false))).toBe(false);
                  expect(vibrate).not.toHaveBeenCalled();
              });

              it('does nothing before user activation', () => {
                  const vibrate = vi.fn(() => true);
                  installNavigator(vibrate, false);

                  expect(hapticFirm(createApp())).toBe(false);
                  expect(vibrate).not.toHaveBeenCalled();
              });

              it('does nothing when vibration is unsupported', () => {
                  installNavigator(undefined);

                  expect(hapticLight(createApp())).toBe(false);
              });

              it('fails silently when vibration throws', () => {
                  installNavigator(() => {
                      throw new Error('blocked');
                  });

                  expect(hapticFirm(createApp())).toBe(false);
              });
          });""",
          )

