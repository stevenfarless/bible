name: "! Source code"

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: source-code-exp
  cancel-in-progress: false

jobs:
  source-code:
    name: Add source code links
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exp
        uses: actions/checkout@v7
        with:
          ref: exp
          fetch-depth: 0

      - name: Apply source code links
        run: python3 .github/scripts/source_code_links.py

      - name: Validate source code links
        run: |
          git diff --check

          grep -q 'data-section="source-code"' index.html
          grep -q 'data-target="source-code"' index.html
          grep -q 'data-panel="source-code"' index.html
          grep -q 'Source Code' index.html
          grep -q 'https://github.com/stevenfarless/lege-lux' index.html
          grep -q 'https://gitlab.com/stevenfarless/lege-lux' index.html
          grep -q 'aria-label="View Lege Lux on GitHub"' index.html
          grep -q 'aria-label="View Lege Lux on GitLab"' index.html
          grep -q 'target="_blank" rel="noopener noreferrer"' index.html
          grep -q 'class="source-code-icon"' index.html

          if grep -q 'class="source-code-section"' index.html; then
            echo "Source Code should be an About sub-accordion, not a standalone section."
            exit 1
          fi

          grep -q '.source-code-group' css/components.css
          grep -q '.source-code-links' css/components.css
          grep -q 'grid-template-columns: repeat(2, minmax(0, 1fr));' css/components.css
          grep -q '.source-code-link' css/components.css
          grep -q '.source-code-link:focus-visible' css/components.css
          grep -q 'justify-content: center;' css/components.css
          grep -q 'min-height: 48px;' css/components.css
          grep -q 'touch-action: manipulation;' css/components.css
          grep -q 'fill: currentColor;' css/components.css

          if grep -q 'simpleicons.org\|cdn.jsdelivr\|unpkg.com' index.html css/components.css; then
            echo "External icon source found; icons must be inline or local."
            exit 1
          fi

          UNEXPECTED="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev '^(index.html|css/components.css)$' || true)"
          test -z "$UNEXPECTED" || {
            echo "Unexpected changed files:"
            echo "$UNEXPECTED"
            exit 1
          }

      - name: Commit source code links
        run: |
          if git diff --quiet -- index.html css/components.css; then
            echo "No source code link changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css/components.css
          git commit \
            -m "feat(about): add source code repository links" \
            -m "Add a final Source Code accordion to the About section with side-by-side GitHub and GitLab links." \
            -m "The links use inline SVG icons, existing theme variables, accessible labels, and external-link attributes without adding dependencies or runtime icon requests." \
            -m "Closes #398"
          git push origin exp

      - name: Dispatch GitHub Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESPONSE_FILE="$(mktemp)"
          STATUS="$({
            curl -sS \
              -o "$RESPONSE_FILE" \
              -w '%{http_code}' \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-gh-pages.yml/dispatches" \
              -d '{"ref":"exp"}'
          })"

          if [ "$STATUS" != "204" ]; then
            echo "Deploy to GitHub Pages workflow dispatch failed with HTTP $STATUS."
            cat "$RESPONSE_FILE"
            exit 1
          fi

          echo "Deploy to GitHub Pages dispatched for exp."
