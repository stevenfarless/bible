name: "! 435 fix"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue-435-fix-exp
  cancel-in-progress: false

jobs:
  fix:
    name: Add background diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exp
        uses: actions/checkout@v4
        with:
          ref: exp
          fetch-depth: 0

      - name: Apply issue 435 fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_pattern(path, pattern, replacement, label):
              text = path.read_text(encoding='utf-8')
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              path.write_text(text, encoding='utf-8')

          app = Path('app.js')
          api = Path('bible-api.js')

          replace_pattern(
              api,
              r'idbPutSearchIndex\(translation, index\)\.catch\(\(\) => \{ \}\);',
              """idbPutSearchIndex(translation, index)
                        .then((stored) => {
                            if (!stored) {
                                console.warn(`BibleApi: failed to persist search index for ${translation}`);
                            }
                        })
                        .catch((error) => {
                            console.warn(`BibleApi: failed to persist search index for ${translation}`, error);
                        });""",
              'search-index persistence diagnostics',
          )

          replace_pattern(
              app,
              r'this\.bibleApi\._loadBook\(t, book\)\s*\.catch\(\(\) => \{ \}\)\s*\.finally\(\(\) => setTimeout\(next, 300\)\);',
              """this.bibleApi._loadBook(t, book)
                .catch((error) => {
                    console.warn(`BibleApp: current-book prefetch failed for ${t}/${book}`, error);
                    this._dbgEvent(`prefetch current failed: ${t}/${book} — ${error?.message || error}`);
                })
                .finally(() => setTimeout(next, 300));""",
              'current-book prefetch diagnostics',
          )

          replace_pattern(
              app,
              r'this\.bibleApi\._loadBook\(translation, book\)\.catch\(\(\) => \{ \}\);',
              """this.bibleApi._loadBook(translation, book).catch((error) => {
                    console.warn(`BibleApp: adjacent-book prefetch failed for ${translation}/${book}`, error);
                    this._dbgEvent(`prefetch adjacent failed: ${translation}/${book} — ${error?.message || error}`);
                });""",
              'adjacent-book prefetch diagnostics',
          )

          replace_pattern(
              app,
              r'\.then\(meta => \{\s*if \(meta\?\.books\?\.length\) \{\s*this\.bibleApi\.setBookList\(startingTranslation, meta\.books\.map\(b => b\.name\)\);\s*this\._rebuildBibleBooks\(meta\);\s*this\._dbgEvent\(`setBookList: \$\{startingTranslation\} \(\$\{meta\.books\.length\} books\)`\);\s*}\s*}\)\s*\.catch\(\(\) => \{ \}\);',
              """.then(meta => {
                    if (meta?.books?.length) {
                        this.bibleApi.setBookList(startingTranslation, meta.books.map(b => b.name));
                        this._rebuildBibleBooks(meta);
                        this._dbgEvent(`setBookList: ${startingTranslation} (${meta.books.length} books)`);
                    }
                })
                .catch((error) => {
                    console.warn(`BibleApp: failed to load meta for starting translation ${startingTranslation}`, error);
                    this._dbgEvent(`starting translation meta failed: ${startingTranslation} — ${error?.message || error}`);
                });""",
              'starting translation meta diagnostics',
          )
          PY

      - name: Validate implementation markers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('app.js').read_text(encoding='utf-8')
          api = Path('bible-api.js').read_text(encoding='utf-8')

          required = [
              (api, 'BibleApi: failed to persist search index for ${translation}'),
              (api, '.then((stored) => {'),
              (app, 'BibleApp: current-book prefetch failed for ${t}/${book}'),
              (app, 'prefetch current failed: ${t}/${book}'),
              (app, 'BibleApp: adjacent-book prefetch failed for ${translation}/${book}'),
              (app, 'prefetch adjacent failed: ${translation}/${book}'),
              (app, 'BibleApp: failed to load meta for starting translation ${startingTranslation}'),
              (app, 'starting translation meta failed: ${startingTranslation}'),
          ]

          for haystack, needle in required:
              assert needle in haystack, f'Missing diagnostic marker: {needle}'

          forbidden = [
              (api, 'idbPutSearchIndex(translation, index).catch(() => { });'),
              (app, 'this.bibleApi._loadBook(translation, book).catch(() => { });'),
              (app, '.catch(() => { })\n                .finally(() => setTimeout(next, 300));'),
              (app, '.catch(() => { });'),
          ]

          for haystack, needle in forbidden:
              assert needle not in haystack, f'Empty background catch remains: {needle}'
          PY

      - name: Verify changed files
        run: |
          allowed='^(app\.js|bible-api\.js)$'
          unexpected="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"

          test -z "$unexpected" || {
            echo "Unexpected changed files:"
            echo "$unexpected"
            exit 1
          }

      - name: Run syntax checks
        run: |
          node --check app.js
          node --check bible-api.js
          git diff --check

      - name: Commit issue 435 fix
        run: |
          files=(app.js bible-api.js)

          git diff --stat -- "${files[@]}"

          if [ -z "$(git status --porcelain -- "${files[@]}")" ]; then
            echo "Issue 435 is already implemented."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit \
            -m "chore(debug): add background failure diagnostics" \
            -m "Replace swallowed non-critical background failures with low-noise contextual diagnostics for search-index persistence, book prefetch, adjacent-book prefetch, and starting-translation metadata loading." \
            -m "Fixes #435"
          git push origin exp
