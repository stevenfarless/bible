name: Convert BSB to JSON

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: json-ver
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Download BSB text
        run: curl -L "https://bereanbible.com/bsb.txt" -o bsb.txt

      - name: Convert to JSON
        run: python scripts/convert_bsb.py bsb.txt translations/BSB/BSB_books

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add translations/BSB/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: regenerate BSB JSON"
          git push origin json-ver
