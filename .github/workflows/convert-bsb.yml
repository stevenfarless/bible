name: Convert BSB to JSON

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: json-ver
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Download BSB text
        run: curl -L "https://bereanbible.com/bsb.txt" -o bsb.txt

      - name: Convert to JSON
        run: python scripts/convert_bsb.py bsb.txt translations/BSB/BSB_books

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add translations/BSB/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: regenerate BSB JSON"
          git push origin json-ver
