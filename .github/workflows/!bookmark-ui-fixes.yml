name: "! Bookmark UI Fixes"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bookmark-ui-fixes-exp
  cancel-in-progress: false

jobs:
  bookmark-ui-fixes:
    name: Apply bookmark UI fixes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exp
        uses: actions/checkout@v7
        with:
          ref: exp
          fetch-depth: 0

      - name: Apply bookmark UI fixes
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -B -m py_compile .github/scripts/bookmark_ui_fixes.py
          python3 -B .github/scripts/bookmark_ui_fixes.py
          python3 -B .github/scripts/bookmark_ui_fixes.py
          rm -rf .github/scripts/__pycache__

      - name: Validate bookmark UI fixes
        run: |
          grep -q 'verse-tool-icon--bookmark-add' reading-state.js
          grep -q 'verse-tool-btn--bookmark-menu-open' bookmarks.js
          grep -q 'const center = anchorRect.left - trayRect.left + anchorRect.width / 2;' bookmarks.js
          grep -q 'card.dataset.bookmarkJump = id;' bookmarks.js
          grep -q 'remove.textContent = "×";' bookmarks.js
          grep -q '.bookmark-card__remove' css/interactions.css
          grep -q '.verse-tool-btn--bookmark-menu-open::after' css/interactions.css
          ! grep -q 'jump.textContent = "↗";' bookmarks.js
          ! grep -q 'remove.textContent = "⋮";' bookmarks.js
          node --check bookmarks.js
          node --check reading-state.js
          git diff --check

      - name: Verify changed files
        run: |
          allowed='^(bookmarks\.js|reading-state\.js|css/interactions\.css)$'
          unexpected="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"
          test -z "$unexpected" || {
            echo "Unexpected changed files:"
            echo "$unexpected"
            exit 1
          }

      - name: Commit bookmark UI fixes
        run: |
          files=(bookmarks.js reading-state.js css/interactions.css)
          if [ -z "$(git status --porcelain -- "${files[@]}")" ]; then
            echo "Bookmark UI fixes are already applied."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit \
            -m "fix(bookmarks): refine sheet and tray controls" \
            -m "Make bookmark sheet cards tappable, replace the card action menu with an X remove button, anchor the color picker over the Bookmark tool, suppress its tooltip while open, and replace the B label with an add-bookmark SVG icon."
          git push origin exp
