name: Import flat verse translation

on:
  workflow_dispatch:
    inputs:
      translation_id:
        description: 'Uppercase translation ID, such as NASB'
        required: true
        type: string
      label:
        description: 'Full display label, including the edition when applicable'
        required: true
        type: string
      edition:
        description: 'Exact edition represented by the source data'
        required: true
        type: string
      year:
        description: 'Publication year for this edition'
        required: true
        type: string
      philosophy:
        description: 'Translation philosophy'
        required: true
        default: formal
        type: choice
        options:
          - formal
          - mediating
          - dynamic
      copyright:
        description: 'Copyright and attribution text approved for display'
        required: true
        type: string
      source_repository:
        description: 'Public GitHub repository containing the source JSON'
        required: true
        default: stevenfarless/Holy-Bible-JSON
        type: string
      source_ref:
        description: 'Exact 40-character source commit SHA'
        required: true
        type: string
      source_path:
        description: 'Path to the flat verse JSON file in the source repository'
        required: true
        default: bibles/english_nasb.json
        type: string
      expected_version:
        description: 'Exact version value expected in every source record'
        required: true
        default: NASB
        type: string
      expected_language:
        description: 'Exact language value expected in every source record'
        required: true
        default: English
        type: string
      language_code:
        description: 'BCP 47 language code used by Lege Lux'
        required: true
        default: en
        type: string
      upload_to_firebase:
        description: 'Upload the validated bundle to Firebase'
        required: true
        default: false
        type: boolean
      distribution_rights_confirmed:
        description: 'I have permission to distribute this edition through Lege Lux'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  import:
    name: Validate and convert translation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Lege Lux exp
        uses: actions/checkout@v7
        with:
          ref: exp
          persist-credentials: false

      - name: Validate workflow inputs
        env:
          TRANSLATION_ID: ${{ inputs.translation_id }}
          SOURCE_REF: ${{ inputs.source_ref }}
          UPLOAD_TO_FIREBASE: ${{ inputs.upload_to_firebase }}
          RIGHTS_CONFIRMED: ${{ inputs.distribution_rights_confirmed }}
        run: |
          set -euo pipefail
          if [[ ! "$TRANSLATION_ID" =~ ^[A-Z0-9][A-Z0-9_-]*$ ]]; then
            echo "translation_id must contain only uppercase letters, numbers, underscores, or hyphens."
            exit 1
          fi
          if [[ ! "$SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_ref must be an exact 40-character commit SHA."
            exit 1
          fi
          if [[ "$UPLOAD_TO_FIREBASE" == "true" && "$RIGHTS_CONFIRMED" != "true" ]]; then
            echo "Firebase upload requires distribution_rights_confirmed=true."
            exit 1
          fi
          if [[ -e "translations/$TRANSLATION_ID" ]]; then
            echo "translations/$TRANSLATION_ID already exists. This workflow will not overwrite it."
            exit 1
          fi

      - name: Checkout pinned source data
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_ref }}
          path: .translation-source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Resolve source file
        id: source
        env:
          SOURCE_PATH: ${{ inputs.source_path }}
        run: |
          set -euo pipefail
          SOURCE_ROOT="$(realpath .translation-source)"
          SOURCE_FILE="$(realpath -e ".translation-source/$SOURCE_PATH")"
          case "$SOURCE_FILE" in
            "$SOURCE_ROOT"/*) ;;
            *)
              echo "source_path must resolve inside the checked-out source repository."
              exit 1
              ;;
          esac
          if [[ ! -f "$SOURCE_FILE" ]]; then
            echo "Source path is not a file: $SOURCE_FILE"
            exit 1
          fi
          echo "file=$SOURCE_FILE" >> "$GITHUB_OUTPUT"

      - name: Validate importer syntax
        run: python -m py_compile scripts/import_flat_verse_json.py scripts/split_translations.py

      - name: Convert source into Lege Lux files
        env:
          SOURCE_FILE: ${{ steps.source.outputs.file }}
          TRANSLATION_ID: ${{ inputs.translation_id }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_LANGUAGE: ${{ inputs.expected_language }}
        run: |
          python scripts/import_flat_verse_json.py \
            "$SOURCE_FILE" \
            "$TRANSLATION_ID" \
            --expected-version "$EXPECTED_VERSION" \
            --expected-language "$EXPECTED_LANGUAGE"

      - name: Write translation metadata
        env:
          TRANSLATION_ID: ${{ inputs.translation_id }}
          LABEL: ${{ inputs.label }}
          EDITION: ${{ inputs.edition }}
          YEAR: ${{ inputs.year }}
          PHILOSOPHY: ${{ inputs.philosophy }}
          COPYRIGHT_TEXT: ${{ inputs.copyright }}
          LANGUAGE_CODE: ${{ inputs.language_code }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          translation_id = os.environ["TRANSLATION_ID"]
          try:
              year = int(os.environ["YEAR"])
          except ValueError as exc:
              raise SystemExit("year must be an integer") from exc

          info = {
              "id": translation_id,
              "label": os.environ["LABEL"],
              "abbreviation": translation_id,
              "language": os.environ["LANGUAGE_CODE"],
              "textDirection": "ltr",
              "year": year,
              "canon": "protestant",
              "philosophy": os.environ["PHILOSOPHY"],
              "edition": os.environ["EDITION"],
              "copyright": os.environ["COPYRIGHT_TEXT"],
          }

          path = Path("translations") / translation_id / "info.json"
          path.write_text(json.dumps(info, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Generate canon metadata
        env:
          TRANSLATION_ID: ${{ inputs.translation_id }}
        run: node scripts/generate-meta.js "$TRANSLATION_ID"

      - name: Audit converted translation
        env:
          TRANSLATION_ID: ${{ inputs.translation_id }}
        run: node --experimental-vm-modules scripts/audit-translations.js "$TRANSLATION_ID"

      - name: Build downloadable bundle
        env:
          TRANSLATION_ID: ${{ inputs.translation_id }}
        run: python dev-scripts/.github/scripts/bundle_translations.py "$TRANSLATION_ID"

      - name: Install Firebase uploader
        if: ${{ inputs.upload_to_firebase }}
        run: pip install firebase-admin

      - name: Write Firebase service account
        if: ${{ inputs.upload_to_firebase }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [[ -z "$FIREBASE_SERVICE_ACCOUNT" ]]; then
            echo "FIREBASE_SERVICE_ACCOUNT is not configured."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/service_account.json

      - name: Upload bundle to Firebase
        if: ${{ inputs.upload_to_firebase }}
        env:
          TARGET_TRANSLATION: ${{ inputs.translation_id }}
        run: python .github/scripts/upload_bundles.py

      - name: Write run summary
        env:
          TRANSLATION_ID: ${{ inputs.translation_id }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_PATH: ${{ inputs.source_path }}
          UPLOAD_TO_FIREBASE: ${{ inputs.upload_to_firebase }}
        run: |
          {
            echo "## Translation import"
            echo
            echo "- Translation: \`$TRANSLATION_ID\`"
            echo "- Source: \`$SOURCE_REPOSITORY@$SOURCE_REF:$SOURCE_PATH\`"
            echo "- Canon audit: passed"
            echo "- Bundle build: passed"
            echo "- Firebase upload: \`$UPLOAD_TO_FIREBASE\`"
            echo
            echo "Generated Bible text remained on the temporary Actions runner and was not committed to GitHub."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove generated text and credentials
        if: always()
        env:
          TRANSLATION_ID: ${{ inputs.translation_id }}
        run: |
          rm -rf .translation-source "translations/$TRANSLATION_ID"
          rm -f "bundles/${TRANSLATION_ID}_bundle.json" /tmp/service_account.json
