name: Select Verses With Long Press

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-events:
    name: Patch verse selection interaction
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: exp
          fetch-depth: 0

      - name: Patch events.js
        run: python3 .github/scripts/select_verses_with_long_press.py

      - name: Verify changes
        run: |
          git diff --check
          git diff -- events.js

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.js
          git commit -m "feat: select verses with long press instead of single tap"
          git push origin exp
