<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lege Lux — Icon Generator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #191a21;
      color: #f8f8f2;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      gap: 1.5rem;
      margin: 0;
    }
    h1 { font-size: 1.1rem; opacity: 0.7; margin: 0; }
    #preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 1rem;
      width: 100%;
      max-width: 700px;
    }
    .preview-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
    }
    .preview-item canvas {
      border-radius: 22%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      width: 100%;
      height: auto;
      max-width: 100px;
    }
    .preview-item span {
      font-size: 0.7rem;
      opacity: 0.55;
      text-align: center;
    }
    .btn-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
      max-width: 340px;
    }
    button {
      width: 100%;
      padding: 0.65rem 1.4rem;
      background: #FFD700;
      color: #1e1e2e;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #f0c800; }
    button:disabled { background: #555; color: #999; cursor: not-allowed; }
    #drop-zone {
      width: 100%;
      max-width: 340px;
      padding: 2rem;
      border: 2px dashed #44475a;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    #drop-zone.over { border-color: #FFD700; }
    #drop-zone p { margin: 0; opacity: 0.5; font-size: 0.9rem; }
    #file-input { display: none; }
    .note { font-size: 0.75rem; opacity: 0.4; text-align: center; max-width: 400px; }
    #status { font-size: 0.85rem; opacity: 0.7; min-height: 1.2em; }
  </style>
</head>
<body>
  <h1>Lege Lux — Icon Generator</h1>

  <div id="drop-zone" onclick="document.getElementById('file-input').click()">
    <p>📂 Click or drop <strong>logo_original.png</strong> here</p>
    <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp">
  </div>

  <div id="status">Waiting for image…</div>

  <div id="preview-grid"></div>

  <div class="btn-row">
    <button id="dl-all" disabled onclick="downloadAll()">&#8659; Download All Files</button>
  </div>

  <p class="note">
    Drop in <code>icons/logo_original.png</code> from your repo.<br>
    Downloads all required sizes and formats in one click.
  </p>

  <script>
    // All required output formats
    const EXPORTS = [
      { filename: 'icons/icon-512.png',         size: 512, radius: 0,   note: 'PWA manifest • Android' },
      { filename: 'icons/icon-192.png',         size: 192, radius: 0,   note: 'PWA manifest • Android home screen' },
      { filename: 'icons/apple-touch-icon.png', size: 180, radius: 0,   note: 'iOS Add to Home Screen' },
      { filename: 'icons/favicon-32.png',       size: 32,  radius: 0,   note: 'Browser tab' },
      { filename: 'icons/favicon-16.png',       size: 16,  radius: 0,   note: 'Browser tab (legacy)' },
      // favicon.ico: we export a 32px PNG named favicon.ico — most hosts/browsers accept PNG-named .ico
      // For a true .ico use favicon.io/favicon-converter with the 32px PNG
      { filename: 'favicon.ico.png',            size: 32,  radius: 0,   note: 'Rename to favicon.ico → repo root' },
    ];

    let sourceImg = null;
    const grid    = document.getElementById('preview-grid');
    const dlBtn   = document.getElementById('dl-all');
    const status  = document.getElementById('status');

    // ── Drag & drop + file input ─────────────────────
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');

    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('over');
      loadFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', () => loadFile(fileInput.files[0]));

    function loadFile(file) {
      if (!file) return;
      status.textContent = 'Loading…';
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          sourceImg = img;
          buildPreviews();
          dlBtn.disabled = false;
          status.textContent = `✓ Loaded — ${img.naturalWidth}×${img.naturalHeight}px`;
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // ── Build preview canvases ────────────────────────
    function buildPreviews() {
      grid.innerHTML = '';
      EXPORTS.forEach(exp => {
        const wrap = document.createElement('div');
        wrap.className = 'preview-item';

        const c = document.createElement('canvas');
        c.width  = exp.size;
        c.height = exp.size;
        drawToCanvas(c, exp.size);

        const label = document.createElement('span');
        label.textContent = `${exp.filename.split('/').pop()}\n${exp.size}×${exp.size}`;

        wrap.appendChild(c);
        wrap.appendChild(label);
        grid.appendChild(wrap);
      });
    }

    // ── Draw source image into a square canvas ────────
    // Fits the image to fill the canvas (cover), centered.
    function drawToCanvas(canvas, size) {
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, size, size);

      if (!sourceImg) return;

      const iw = sourceImg.naturalWidth;
      const ih = sourceImg.naturalHeight;
      const scale = Math.max(size / iw, size / ih);
      const dw = iw * scale;
      const dh = ih * scale;
      const dx = (size - dw) / 2;
      const dy = (size - dh) / 2;

      ctx.drawImage(sourceImg, dx, dy, dw, dh);
    }

    // ── Download all ──────────────────────────────────
    function downloadAll() {
      if (!sourceImg) return;
      status.textContent = 'Downloading…';

      EXPORTS.forEach((exp, i) => {
        setTimeout(() => {
          const c = document.createElement('canvas');
          c.width  = exp.size;
          c.height = exp.size;
          drawToCanvas(c, exp.size);

          const a = document.createElement('a');
          // Strip leading path for download filename
          a.download = exp.filename.replace('icons/', '');
          a.href = c.toDataURL('image/png');
          a.click();

          if (i === EXPORTS.length - 1) {
            status.textContent = `✓ All ${EXPORTS.length} files downloaded`;
          }
        }, i * 120); // stagger to avoid browser blocking rapid downloads
      });
    }
  </script>
</body>
</html>
