name: Stabilize Book Modal Height

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stabilize-book-modal-height:
    name: Keep book modal height stable across filters
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: exp
          fetch-depth: 0

      - name: Apply modal height stabilization
        run: python3 .github/scripts/stabilize_book_modal_height.py

      - name: Verify changes
        run: |
          node --check modals.js
          node --check tests/smoke.spec.js
          git diff --check
          grep -F 'content.style.height = `${content.offsetHeight}px`;' modals.js
          grep -F "const initialBookModalHeight = await modalContent.evaluate" tests/smoke.spec.js
          git diff -- modals.js tests/smoke.spec.js

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modals.js tests/smoke.spec.js
          git commit -m "fix: keep book modal height stable"
          git pull --rebase origin exp
          git push origin exp
